figuration 配置类里，用一个<strong>方法<\/strong>来创建 Bean，方法上贴？", "options": ["@Component", "@Bean", "@Autowired", "@ComponentScan"], "answer": [1], "why": ["它贴在类上", "方法造 Bean → @Bean", "它是自动塞", "它是扫描包"], "explain": "@Bean 贴方法，@Component 贴类。", "tags": ["basic"], "m": "base"}, {"id": "base-8", "type": "multi", "stem": "@SpringBootApplication 包含了哪些注解？", "options": ["@Configuration", "@EnableAutoConfiguration", "@ComponentScan", "@Transactional"], "answer": [0, 1, 2], "why": ["包含", "包含", "包含", "不包含，事务另外贴"], "explain": "一个顶三个。", "tags": ["basic"], "m": "base"}, {"id": "base-9", "type": "single", "stem": "@Service、@Repository、@Controller 和 @Component 的关系是？", "options": ["它们都是 @Component 的特殊版本", "它们互相冲突，只能用一个", "它们和 Spring 无关", "只有 @Component 能让 Spring 管理"], "answer": [0], "why": ["对，只是名字表明所在的层", "不冲突", "都是 Spring 注解", "它们都能让 Spring 管理"], "explain": "分层注解都是 @Component。", "tags": ["basic"], "m": "base"}, {"id": "base-10", "type": "single", "stem": "装着所有 Bean 的「容器」，在 Spring 中叫？", "options": ["ApplicationContext（应用上下文）", "DataSource", "DispatcherServlet", "JdbcTemplate"], "answer": [0], "why": ["对", "数据源", "处理网页请求的入口", "访问数据库的工具"], "explain": "容器 = 应用上下文。", "tags": ["basic"], "m": "base"}, {"id": "base-11", "type": "single", "stem": "Spring Boot 程序不需要另外安装网页服务器，是因为？", "options": ["自带内嵌的网页服务器（默认 Tomcat）", "它不处理网页请求", "它用浏览器当服务器", "它把程序部署到云上"], "answer": [0], "why": ["对", "它能处理", "无关", "无关"], "explain": "内嵌容器，默认 Tomcat。", "tags": ["basic"], "m": "base"}, {"id": "base-12", "type": "single", "stem": "查看 Spring Boot 程序是否健康的默认地址是？", "options": ["/actuator/health", "/health/check", "/status", "/admin"], "answer": [0], "why": ["需要 Actuator 依赖", "不是", "不是", "不是"], "explain": "Actuator 的健康端点。", "tags": ["basic"], "m": "base"}, {"id": "base-13", "type": "single", "stem": "把 Spring Boot 程序打成可以 `java -jar` 直接运行的包，靠的是？", "options": ["spring-boot-maven-plugin", "Spring Initializr", "Actuator", "Lombok"], "answer": [0], "why": ["Maven 打包插件", "生成工程的网站", "监控", "减少样板代码的工具"], "explain": "打可执行 jar → maven 插件。", "tags": ["basic"], "m": "base"}, {"id": "base-14", "type": "multi", "stem": "统一管理多个依赖版本，可以用？", "options": ["父 POM（spring-boot-starter-parent）", "BOM", "Actuator", "@Autowired"], "answer": [0, 1], "why": ["可以", "可以", "它是监控", "它是自动塞"], "explain": "父 POM / BOM 管版本。", "tags": ["basic"], "m": "base"}, {"id": "base-15", "type": "single", "stem": "Spring 5 要求的最低 Java 版本是？", "options": ["Java 6", "Java 7", "Java 8", "Java 11"], "answer": [2], "why": ["太低", "太低", "Spring 5 要求 Java 8+", "不是最低要求"], "explain": "第 03 讲：Spring 5 基于 Java 8。", "tags": ["basic"], "m": "base"}, {"id": "base-16", "type": "single", "stem": "判断：Spring 5 加入了对响应式编程（WebFlux）的支持", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "Spring 5 的新特性：Java 8、Kotlin、响应式。", "tags": ["basic"], "m": "base"}]}, {"id": "ds", "title": "数据源与连接池：单数据源、多数据源、HikariCP、Druid", "short": "数据源与连接池", "group": "第二章 JDBC 必知必会", "exam": "第 05—08 讲", "refs": [{"label": "HikariCP 官方说明", "url": "https://github.com/brettwooldridge/HikariCP"}], "lessons": [{"title": "数据源是什么，Boot 帮你配了哪些", "cards": ["### 一句话\n\n- <strong>数据源（DataSource）<\/strong> = 程序拿数据库连接的地方。\n- <strong>连接池<\/strong> = 提前开好一批数据库连接放着，用的时候借，用完还回去，省得每次重新连接。\n\n### 单数据源：Boot 自动配好三样东西（第 05 讲）\n\n只要引入 JDBC 依赖和数据库驱动，Spring Boot 会<strong>自动<\/strong>配置：\n\n| 自动配好的 | 作用 |\n|---|---|\n| <strong>DataSource<\/strong> | 数据源（连接池） |\n| <strong>DataSourceTransactionManager<\/strong> | 事务管理器（事务模块讲过） |\n| <strong>JdbcTemplate<\/strong> | 操作数据库的工具（下个模块讲） |\n\n连接信息写在配置文件里：`spring.datasource.url`、`spring.datasource.username`、`spring.datasource.password`。\n\n程序启动时可以自动执行 <strong>schema.sql<\/strong>（建表）和 <strong>data.sql<\/strong>（插入数据）。\n\n> 📌 对比：<strong>传统 Spring 要自己一个个写出来，Spring Boot 自动配。<\/strong>", "### 多数据源（第 06 讲）\n\n一个程序连两个数据库时，Boot 不知道该自动配哪个，要你自己来。两种办法：\n\n1. <strong>排除自动配置，全部自己配<\/strong>：每个数据库各配一套 DataSource、事务管理器等；\n2. <strong>用 @Primary 指定主数据源<\/strong>：Boot 的自动配置就围绕主数据源进行。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 多个同类型 Bean 里，指定<strong>默认用哪个<\/strong> | <strong>@Primary<\/strong> |\n| 不想用某个自动配置 | 在 @SpringBootApplication 里写 <strong>exclude<\/strong> |\n\n> ⚠️ 多数据源时，<strong>每个数据源要有自己的事务管理器<\/strong>。"]}, {"title": "HikariCP：Spring Boot 2 的默认连接池", "cards": ["### 一句话\n\n<strong>HikariCP 是 Spring Boot 2.x 默认的连接池，主打「快」。<\/strong>（Hikari 是日语「光」。Spring Boot 1.x 默认的是 Tomcat 连接池。）\n\n### 为什么快（了解，认得出关键词就行）\n\n- 字节码层面做了精简优化；\n- 用自己写的 <strong>FastList<\/strong> 代替 ArrayList；\n- 用无锁的 <strong>ConcurrentBag<\/strong> 管理连接。\n\n### 常用配置（前缀 `spring.datasource.hikari.`）\n\n| 配置 | 意思 | 默认值（补充） |\n|---|---|---|\n| <strong>maximumPoolSize<\/strong> | 最多多少个连接 | 10 |\n| minimumIdle | 最少保留多少空闲连接 | 和最大值一样 |\n| connectionTimeout | 借连接最多等多久 | 30 秒 |\n| idleTimeout | 空闲连接多久后关掉 | 10 分钟 |\n| maxLifetime | 一个连接最长活多久 | 30 分钟 |\n\n> 📌 记住：<strong>Boot 2 默认 HikariCP；最大连接数 maximumPoolSize。<\/strong>"]}, {"title": "Druid：阿里巴巴的连接池，主打监控", "cards": ["### 一句话\n\n<strong>Druid 是阿里巴巴开源的连接池，最大特点是「能监控」。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 阿里巴巴开源的连接池 | <strong>Druid<\/strong> |\n| 连接池 + SQL 监控、统计 | <strong>Druid<\/strong> |\n| Spring Boot 2 默认连接池、主打快 | <strong>HikariCP<\/strong> |\n\n### Druid 的能力（第 08、14 讲）\n\n- <strong>SQL 监控和统计<\/strong>：哪条 SQL 执行了多少次、多慢；\n- <strong>慢 SQL 记录<\/strong>：超过设定时间的 SQL 记下来；\n- <strong>防 SQL 注入<\/strong>：WallFilter（Wall = 防火墙）；\n- <strong>数据库密码加密<\/strong>：配置文件里不写明文密码；\n- <strong>Filter（过滤器）扩展<\/strong>：可以自己写 Filter 插入额外逻辑。\n\n接入方式：引入 <strong>druid-spring-boot-starter<\/strong>。\n\n> 💡 选连接池要综合看：稳定性、性能、能不能监控、还有没有人维护。"]}], "questions": [{"id": "ds-p1", "type": "multi", "stem": "引入 JDBC 依赖后，Spring Boot 会自动配置哪些？", "options": ["DataSource", "DataSourceTransactionManager", "JdbcTemplate", "RestTemplate"], "answer": [0, 1, 2], "why": ["数据源", "事务管理器", "数据库工具", "RestTemplate 是调用网络接口的，Boot 不会因为 JDBC 自动配它"], "explain": "单数据源三件套。", "tags": [], "lesson": 0, "m": "ds"}, {"id": "ds-p2", "type": "single", "stem": "Spring Boot 2.x 默认的连接池是？", "options": ["Druid", "HikariCP", "C3P0", "DBCP"], "answer": [1], "why": ["阿里的，主打监控", "Boot 2 默认", "老牌连接池", "老牌连接池"], "explain": "Boot 2 → HikariCP。", "tags": [], "lesson": 1, "m": "ds"}, {"id": "ds-p3", "type": "single", "stem": "阿里巴巴开源、主打 SQL 监控的连接池是？", "options": ["HikariCP", "Druid", "Tomcat JDBC", "Lettuce"], "answer": [1], "why": ["主打快", "阿里 + 监控 → Druid", "Boot 1.x 默认", "Lettuce 是 Redis 客户端"], "explain": "Druid = 监控。", "tags": [], "lesson": 2, "m": "ds"}, {"id": "ds-1", "type": "single", "stem": "数据库连接信息（地址、用户名、密码）配置项的前缀是？", "options": ["spring.datasource", "spring.jpa", "server", "spring.redis"], "answer": [0], "why": ["对", "JPA 的配置", "服务器配置", "Redis 配置"], "explain": "spring.datasource.url / username / password。", "tags": ["basic"], "m": "ds"}, {"id": "ds-2", "type": "single", "stem": "连接池的作用是？", "options": ["提前建好一批连接，借用和归还，避免频繁新建", "把多个数据库合并成一个", "加密数据库", "自动建表"], "answer": [0], "why": ["对", "无关", "无关", "无关"], "explain": "连接池 = 借和还。", "tags": ["basic"], "m": "ds"}, {"id": "ds-3", "type": "multi", "stem": "Spring Boot 启动时，可以自动执行哪些文件来建表、插数据？", "options": ["schema.sql", "data.sql", "pom.xml", "application.properties"], "answer": [0, 1], "why": ["建表", "插入数据", "Maven 配置文件", "配置文件，不是 SQL"], "explain": "schema 建表，data 插数据。", "tags": ["basic"], "m": "ds"}, {"id": "ds-4", "type": "single", "stem": "多个同类型的 Bean 中，指定默认使用哪一个，用？", "options": ["@Primary", "@Autowired", "@Bean", "@Service"], "answer": [0], "why": ["Primary = 主要的", "自动塞", "造 Bean", "业务层"], "explain": "多数据源常用 @Primary 指定主数据源。", "tags": ["basic"], "m": "ds"}, {"id": "ds-5", "type": "single", "stem": "配置多数据源时，下列说法正确的是？", "options": ["每个数据源要配自己的事务管理器", "Boot 会自动为每个数据源配好一切", "多数据源不能使用事务", "只能有一个 DataSource Bean"], "answer": [0], "why": ["对", "多数据源时 Boot 不知道配哪个，需要自己配", "可以用事务", "可以有多个"], "explain": "多数据源：自己配，或 @Primary 指定主的。", "tags": ["basic"], "m": "ds"}, {"id": "ds-6", "type": "single", "stem": "不想让 Spring Boot 自动配置某个功能，可以？", "options": ["在 @SpringBootApplication 中用 exclude 排除", "删掉 Spring Boot", "改用 @Primary", "加 @Autowired"], "answer": [0], "why": ["对", "没必要", "那是指定主 Bean", "那是自动塞"], "explain": "exclude = 排除。", "tags": ["basic"], "m": "ds"}, {"id": "ds-7", "type": "single", "stem": "HikariCP 中设置<strong>最大连接数<\/strong>的配置是？", "options": ["maximumPoolSize", "minimumIdle", "idleTimeout", "maxLifetime"], "answer": [0], "why": ["最大池大小", "最少空闲数", "空闲超时", "连接最长寿命"], "explain": "看英文：maximum pool size。", "tags": ["basic"], "m": "ds"}, {"id": "ds-8", "type": "single", "stem": "HikariCP 中，<strong>一个连接最长能活多久<\/strong>的配置是？", "options": ["maximumPoolSize", "connectionTimeout", "maxLifetime", "minimumIdle"], "answer": [2], "why": ["最大连接数", "借连接最多等多久", "life time = 寿命", "最少空闲数"], "explain": "maxLifetime = 最长寿命。", "tags": ["basic"], "m": "ds"}, {"id": "ds-9", "type": "single", "stem": "HikariCP 中，<strong>借连接时最多等多久<\/strong>的配置是？", "options": ["connectionTimeout", "idleTimeout", "maxLifetime", "maximumPoolSize"], "answer": [0], "why": ["connection timeout = 获取连接超时", "空闲多久后关闭", "最长寿命", "最大连接数"], "explain": "connectionTimeout。", "tags": ["basic"], "m": "ds"}, {"id": "ds-10", "type": "multi", "stem": "下列哪些是 HikariCP 速度快的原因？", "options": ["字节码精简优化", "用 FastList 代替 ArrayList", "无锁的 ConcurrentBag", "自带 SQL 监控页面"], "answer": [0, 1, 2], "why": ["是", "是", "是", "监控是 Druid 的特点"], "explain": "Hikari 主打快，Druid 主打监控。", "tags": ["basic"], "m": "ds"}, {"id": "ds-11", "type": "single", "stem": "Druid 中用于<strong>防 SQL 注入<\/strong>的是？", "options": ["WallFilter", "StatFilter", "FastList", "RowMapper"], "answer": [0], "why": ["Wall = 防火墙", "StatFilter 做统计", "Hikari 的内部结构", "JdbcTemplate 的结果映射"], "explain": "Wall = 防火墙。", "tags": ["basic"], "m": "ds"}, {"id": "ds-12", "type": "multi", "stem": "Druid 提供了哪些能力？", "options": ["SQL 监控统计", "慢 SQL 记录", "防 SQL 注入", "数据库密码加密"], "answer": [0, 1, 2, 3], "why": ["有", "有", "有", "有"], "explain": "Druid 主打监控和扩展。", "tags": ["basic"], "m": "ds"}, {"id": "ds-13", "type": "single", "stem": "在 Spring Boot 中接入 Druid，通常引入？", "options": ["druid-spring-boot-starter", "spring-boot-starter-actuator", "spring-boot-starter-web", "HikariCP"], "answer": [0], "why": ["Druid 的起步依赖", "监控端点", "Web", "另一个连接池"], "explain": "第三方起步依赖的命名：xxx-spring-boot-starter。", "tags": ["basic"], "m": "ds"}, {"id": "ds-14", "type": "single", "stem": "判断：Spring Boot 1.x 和 2.x 的默认连接池都是 HikariCP", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：1.x 默认是 Tomcat 连接池，2.x 才改为 HikariCP"], "explain": "Boot 2 → HikariCP。", "tags": ["basic"], "m": "ds"}, {"id": "ds-15", "type": "single", "stem": "判断：传统 Spring（不用 Boot）需要自己显式配置 DataSource、事务管理器等 Bean", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "Boot 自动配，传统 Spring 手动配。", "tags": ["basic"], "m": "ds"}]}, {"id": "jdbc", "title": "Spring JDBC：JdbcTemplate 与异常抽象", "short": "JdbcTemplate 与异常", "group": "第二章 JDBC 必知必会", "exam": "第 09、12 讲", "refs": [{"label": "Spring 5.3 文档 · JDBC", "url": "https://docs.spring.io/spring-framework/docs/5.3.x/reference/html/data-access.html#jdbc"}], "lessons": [{"title": "JdbcTemplate：直接写 SQL 的好帮手", "cards": ["### 一句话\n\n<strong>JdbcTemplate = Spring 提供的「写 SQL 操作数据库」的工具。<\/strong>它帮你处理打开连接、关闭连接这些杂事，你只管写 SQL。\n\n### 方法对号入座\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 增、删、改 | <strong>update()<\/strong> |\n| 查询，结果是多条 | <strong>query()<\/strong> / <strong>queryForList()<\/strong> |\n| 查询，结果只有一个（如一个数字、一个对象） | <strong>queryForObject()<\/strong> |\n| 批量执行多条 | <strong>batchUpdate()<\/strong> |\n| 执行任意语句（如建表） | <strong>execute()<\/strong> |\n\n> 💡 记法：<strong>改数据都用 update<\/strong>，不管是插入、修改还是删除。", "### 几个配套工具\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把查询结果的<strong>一行<\/strong>变成一个 Java 对象 | <strong>RowMapper<\/strong> |\n| 插入数据并<strong>拿到自动生成的主键<\/strong> | <strong>SimpleJdbcInsert<\/strong> |\n| SQL 里用 <strong>:名字<\/strong> 代替 <strong>?<\/strong> 当参数 | <strong>NamedParameterJdbcTemplate<\/strong> |\n\n例子：`SELECT * FROM FOO WHERE ID = ?` 用问号占位；NamedParameterJdbcTemplate 可以写成 `WHERE ID = :id`，更好读。\n\n> 📌 本节要点：<strong>update 改、query 查、RowMapper 转对象、SimpleJdbcInsert 拿主键、Named… 用名字当参数。<\/strong>"]}, {"title": "异常抽象：数据库报错统一翻译", "cards": ["### 一句话\n\n不同数据库（MySQL、Oracle……）报错的代码各不相同。<strong>Spring 把它们统一翻译成自己的一套异常，根叫 DataAccessException。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Spring 数据访问异常的<strong>统一父类<\/strong> | <strong>DataAccessException<\/strong> |\n| 违反唯一约束（主键重复） | <strong>DuplicateKeyException<\/strong> |\n| 负责把数据库错误码翻译成 Spring 异常 | <strong>SQLErrorCodeSQLExceptionTranslator<\/strong> |\n| 记录各数据库错误码对照的文件 | <strong>sql-error-codes.xml<\/strong> |\n\n- DataAccessException 是<strong>运行时异常<\/strong>（名字链上有 Runtime），所以在事务里<strong>会回滚<\/strong>。\n- 想<strong>自定义翻译<\/strong>：在自己项目里放一个 sql-error-codes.xml，覆盖默认的对照表。\n\n> 📌 好处一句话：<strong>换数据库，上层代码捕获的异常不用改。<\/strong>"]}], "questions": [{"id": "jdbc-p1", "type": "single", "stem": "JdbcTemplate 中，插入、修改、删除数据都用哪个方法？", "options": ["query()", "update()", "execute()", "queryForObject()"], "answer": [1], "why": ["查询", "改数据都用 update", "执行任意语句，一般用来建表", "查单个结果"], "explain": "改数据 → update。", "tags": [], "lesson": 0, "m": "jdbc"}, {"id": "jdbc-p2", "type": "single", "stem": "把查询结果的每一行转成一个 Java 对象，用？", "options": ["RowMapper", "DataSource", "SimpleJdbcInsert", "TransactionTemplate"], "answer": [0], "why": ["Row = 行，Mapper = 映射", "数据源", "插入并拿主键", "编程式事务"], "explain": "RowMapper = 行 → 对象。", "tags": [], "lesson": 0, "m": "jdbc"}, {"id": "jdbc-p3", "type": "single", "stem": "Spring 数据访问异常的统一父类是？", "options": ["SQLException", "DataAccessException", "RuntimeException", "IOException"], "answer": [1], "why": ["那是 JDBC 原生异常", "Spring 的统一父类", "它更上层，太宽泛", "无关"], "explain": "根 = DataAccessException。", "tags": [], "lesson": 1, "m": "jdbc"}, {"id": "jdbc-1", "type": "single", "stem": "JdbcTemplate 查询<strong>单个结果<\/strong>（如统计总数），用？", "options": ["queryForObject()", "queryForList()", "update()", "batchUpdate()"], "answer": [0], "why": ["单个 → ForObject", "多条", "改数据", "批量"], "explain": "queryForObject 查一个。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-2", "type": "single", "stem": "JdbcTemplate 批量执行多条语句，用？", "options": ["batchUpdate()", "update()", "execute()", "query()"], "answer": [0], "why": ["batch = 批量", "单条", "任意语句", "查询"], "explain": "batchUpdate。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-3", "type": "single", "stem": "插入数据后想<strong>拿到数据库自动生成的主键<\/strong>，可以用？", "options": ["SimpleJdbcInsert", "RowMapper", "DataAccessException", "NamedParameterJdbcTemplate"], "answer": [0], "why": ["对", "行转对象", "异常", "命名参数"], "explain": "SimpleJdbcInsert 能返回生成的主键。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-4", "type": "single", "stem": "SQL 中用 `:id` 这种<strong>名字<\/strong>代替 `?` 作为参数，用？", "options": ["NamedParameterJdbcTemplate", "SimpleJdbcInsert", "RowMapper", "DataSource"], "answer": [0], "why": ["Named Parameter = 命名参数", "插入拿主键", "行转对象", "数据源"], "explain": "名字参数 → Named…", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-5", "type": "single", "stem": "JdbcTemplate 帮开发者处理了什么？", "options": ["打开和关闭连接等资源管理", "自动设计表结构", "自动生成业务代码", "页面渲染"], "answer": [0], "why": ["对", "不会", "不会", "无关"], "explain": "只管写 SQL，杂事它干。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-6", "type": "single", "stem": "插入数据违反唯一约束（主键重复），Spring 会抛出？", "options": ["DuplicateKeyException", "NullPointerException", "IOException", "TimeoutException"], "answer": [0], "why": ["Duplicate Key = 重复的键", "空指针", "无关", "超时"], "explain": "重复键 → DuplicateKeyException。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-7", "type": "single", "stem": "负责把数据库错误码翻译成 Spring 异常的是？", "options": ["SQLErrorCodeSQLExceptionTranslator", "RowMapper", "JdbcTemplate", "HikariCP"], "answer": [0], "why": ["名字里有 ErrorCode 和 Translator（翻译器）", "行转对象", "它使用翻译器，但不是翻译器本身", "连接池"], "explain": "认 Translator = 翻译器。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-8", "type": "single", "stem": "记录各数据库错误码对照关系的文件是？", "options": ["sql-error-codes.xml", "schema.sql", "pom.xml", "application.yml"], "answer": [0], "why": ["对", "建表脚本", "Maven 配置", "配置文件"], "explain": "自定义翻译也是放一个 sql-error-codes.xml。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-9", "type": "single", "stem": "Spring 异常抽象的好处是？", "options": ["换数据库时，上层捕获的异常不用改", "让 SQL 执行更快", "不再需要数据库", "自动修复错误"], "answer": [0], "why": ["对", "无关", "无关", "无关"], "explain": "统一翻译。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-10", "type": "single", "stem": "判断：DataAccessException 是受检异常，在事务中默认不会回滚", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：它是运行时异常，默认会回滚"], "explain": "DataAccessException 继承自 RuntimeException。", "tags": ["basic"], "m": "jdbc"}, {"id": "jdbc-11", "type": "multi", "stem": "下列哪些是 JdbcTemplate 的方法？", "options": ["query()", "update()", "batchUpdate()", "getForObject()"], "answer": [0, 1, 2], "why": ["是", "是", "是", "那是 RestTemplate 的方法"], "explain": "getForObject 是 RestTemplate（调网络接口）的。", "tags": ["basic"], "m": "jdbc"}]}, {"id": "tx", "title": "Spring 事务", "short": "事务", "group": "第二章 JDBC 必知必会", "exam": "第 10、11、14 讲", "refs": [{"label": "Spring 5.3 文档 · 事务管理", "url": "https://docs.spring.io/spring-framework/docs/5.3.x/reference/html/data-access.html#transaction"}], "lessons": [{"title": "事务是什么，谁负责管它", "cards": ["### 一句话\n\n<strong>事务 = 一组数据库操作，要么全部成功，要么全部撤销。<\/strong>\n\n例子：下单要做两步，「插入订单」和「扣库存」。如果只做成了一步，数据就乱了。所以把两步捆在一起：\n\n- 都成功 → <strong>提交<\/strong>（正式保存）\n- 有一步失败 → <strong>回滚<\/strong>（全部撤销，当没发生过）\n\n> 💡 <strong>怎么学这个站<\/strong>：每个模块只要求「认得出」。看到题目里的描述，能选出对应的名字就够了。不用看懂代码，不用背原理。", "### 对号入座：三个核心接口（必背）\n\nSpring 用三个「接口」来管事务。接口你可以理解成「一个角色的名字」，不用管它是怎么写出来的。\n\n| 看到题目说…… | 就选 | 记法 |\n|---|---|---|\n| 负责<strong>开启、提交、回滚<\/strong> | <strong>PlatformTransactionManager<\/strong> | Manager = 经理，干活的 |\n| 描述事务的<strong>规则<\/strong>（传播、隔离、超时、只读） | <strong>TransactionDefinition<\/strong> | Definition = 定义，规则说明书 |\n| 表示事务<strong>当前的状态<\/strong> | <strong>TransactionStatus<\/strong> | Status = 状态 |\n\n> 📌 认准三个英文词：<strong>Manager 干活，Definition 定规则，Status 看状态。<\/strong>", "### 对号入座：不同技术用不同的「经理」\n\n| 用的是…… | 事务经理叫 |\n|---|---|\n| JDBC、JdbcTemplate、MyBatis | <strong>DataSource<\/strong>TransactionManager |\n| JPA | <strong>Jpa<\/strong>TransactionManager |\n| Hibernate | <strong>Hibernate<\/strong>TransactionManager |\n| 跨多个数据库（分布式事务） | <strong>Jta<\/strong>TransactionManager |\n\n记法：<strong>名字前半截就是它对应的技术<\/strong>，只有 JDBC 和 MyBatis 用的是 DataSource（数据源）。\n\n为什么要这样设计？一句话：<strong>上层代码只认「经理」这个角色，底层换技术时只换经理，上层不用改。<\/strong>这就是题目里说的「Spring 的事务抽象」。\n\nSpring Boot 会<strong>自动<\/strong>帮你配好对应的经理，不用自己写。"]}, {"title": "事务的四条规则：传播、隔离、超时、只读", "cards": ["### 四条规则（都写在 TransactionDefinition 里）\n\n| 规则 | 管什么 | <strong>默认值（必背）<\/strong> |\n|---|---|---|\n| <strong>传播行为<\/strong> | 一个有事务的方法调用另一个方法时，两者共不共用事务 | <strong>REQUIRED<\/strong> |\n| <strong>隔离级别<\/strong> | 同时进行的多个事务，互相能看到多少 | <strong>DEFAULT<\/strong>（跟着数据库自己的设置走） |\n| 超时 | 最多执行几秒，超时就回滚 | -1（不限制） |\n| 只读 | 是不是只查不改 | false（不是只读） |\n\n> 📌 考得最多的是两个默认值：<strong>传播 REQUIRED，隔离 DEFAULT。<\/strong>", "### 传播行为：7 种，名字就是意思\n\n场景：方法 A 已经开了事务，A 去调用方法 B。B 的传播行为决定 B 怎么做。\n\n| 名字 | 中文意思 | B 的做法 |\n|---|---|---|\n| <strong>REQUIRED<\/strong>（默认） | 需要 | 有事务就加入，没有就新建 |\n| <strong>REQUIRES_NEW<\/strong> | 需要<strong>新的<\/strong> | <strong>总是<\/strong>另开一个新事务 |\n| <strong>NESTED<\/strong> | 嵌套 | 在 A 的事务里「存个档」，嵌套执行 |\n| SUPPORTS | 支持 | 有就加入，没有就算了 |\n| NOT_SUPPORTED | 不支持 | 有也不用，不带事务执行 |\n| MANDATORY | 强制 | 必须已经有事务，<strong>没有就报错<\/strong> |\n| NEVER | 绝不 | 绝不能有事务，<strong>有就报错<\/strong> |\n\n> 💡 不用硬背表格，把英文单词翻成中文，意思基本就出来了。\n\n> ⚠️ 最容易混的一对：<strong>REQUIRES_NEW = 另开一个独立的新事务；NESTED = 还在原来的事务里，只是存了个档。<\/strong>", "### 隔离级别：先认三个「问题」，再认四个级别\n\n多个事务同时运行，可能出三种问题：\n\n| 问题 | 一句话 | 关键字 |\n|---|---|---|\n| <strong>脏读<\/strong> | 读到了别人<strong>还没提交<\/strong>的数据 | 未提交 |\n| <strong>不可重复读<\/strong> | 同一行数据，两次读到的<strong>值不一样<\/strong> | 值变了 |\n| <strong>幻读<\/strong> | 同样的查询，两次查到的<strong>行数不一样<\/strong> | 行数变了 |\n\n四个级别从低到高，每升一级多挡住一个问题：\n\n| 级别 | 挡住了 |\n|---|---|\n| READ_UNCOMMITTED（读未提交） | 什么都挡不住 |\n| <strong>READ_COMMITTED<\/strong>（读已提交） | 脏读 |\n| <strong>REPEATABLE_READ<\/strong>（可重复读） | 脏读、不可重复读 |\n| <strong>SERIALIZABLE<\/strong>（串行化） | 全部三个 |\n\n> 💡 记法：级别的名字就是它挡住的问题。「读已提交」→ 只读别人提交过的，所以没有脏读；「可重复读」→ 重复读同一行结果不变，所以没有不可重复读。"]}, {"title": "两种写法，和三个必背的坑", "cards": ["### 两种写法：认准名字就行\n\n| 写法 | 怎么写 | 认法 |\n|---|---|---|\n| <strong>编程式事务<\/strong> | 在代码里用 <strong>TransactionTemplate<\/strong> 包住要做的事 | 看到 Template |\n| <strong>声明式事务<\/strong> | 在方法上方贴一个 <strong>@Transactional<\/strong> | 看到 @Transactional |\n\n- 开头带 `@` 的叫<strong>注解<\/strong>，就是贴在代码上的一个标签，告诉 Spring「这个方法要放进事务里」。\n- 编程式里想手动回滚，用 <strong>setRollbackOnly()<\/strong>（字面意思：设为只能回滚）。\n- 传统 Spring 要写 <strong>@EnableTransactionManagement<\/strong> 打开注解功能；<strong>Spring Boot 自动打开<\/strong>，不用写。\n\n声明式事务是怎么实现的？一个词：<strong>AOP 代理<\/strong>。Spring 在你的方法外面套了一层「代理」，由代理负责开事务、提交、回滚。你只要记住「<strong>声明式事务靠代理<\/strong>」，下一页的坑都是从这来的。", "### 坑一：不是所有错误都会回滚（必背）\n\n方法贴了 @Transactional，执行中出错了，会不会回滚？<strong>看错误的名字：<\/strong>\n\n| 题目里出现的错误名字 | 结果 |\n|---|---|\n| 带 <strong>Runtime<\/strong> 的（如 `RuntimeException`） | <strong>回滚<\/strong> |\n| 不带 Runtime 的（如 `Exception`、`IOException`、`SQLException`） | <strong>不回滚<\/strong>，照样提交 |\n\n除非注解里写了 <strong>rollbackFor<\/strong>：`@Transactional(rollbackFor = Exception.class)`，那遇到 Exception 也会回滚。\n\n> 📌 一句话：<strong>默认只有 Runtime 类的错误才回滚；想让别的错误也回滚，写 rollbackFor。<\/strong>\n\n> ⚠️ 判断题陷阱：「@Transactional 方法出任何错都会回滚」——<strong>错<\/strong>。", "### 坑二、坑三：事务「失效」了\n\n<strong>坑二：同一个类里，自己调自己，事务不生效。<\/strong>（第 11、14 讲专门讲过）\n\n一个类里有两个方法 a 和 b，b 贴了 @Transactional，a 没贴。外面调用 a，a 再调用 b → <strong>b 的事务不生效<\/strong>。\n\n原因一句话：事务是外面那层代理加的，<strong>a 调 b 是在类里面直接调的，没经过代理<\/strong>。\n\n修法：给 a 也贴上 @Transactional，或者让调用经过代理。\n\n<strong>坑三：错误被自己「接住」了，事务不回滚。<\/strong>\n\n方法里用 try / catch 把错误接住了（catch 就是「接住错误」的意思），外面的代理就不知道出过错，<strong>照样提交<\/strong>。\n\n<strong>另外记一条<\/strong>：@Transactional 要贴在 <strong>public<\/strong> 方法上，贴在 private 方法上不生效。\n\n> 📌 三个坑：<strong>① 不带 Runtime 的错误默认不回滚 ② 类里自己调自己不生效 ③ 错误被 catch 接住了不回滚。<\/strong>"]}], "questions": [{"id": "tx-p1", "type": "single", "lesson": 0, "stem": "事务的意思是？", "options": ["一组操作要么全部成功，要么全部撤销", "把数据备份到另一台服务器", "让查询变得更快", "定时自动执行的任务"], "answer": [0], "why": ["这就是事务", "那是备份", "那是缓存、索引做的事", "那是定时任务"], "explain": "事务：全成功就提交，有失败就回滚。", "m": "tx", "tags": []}, {"id": "tx-p2", "type": "single", "lesson": 0, "stem": "负责<strong>开启、提交、回滚<\/strong>事务的是？", "options": ["TransactionDefinition", "TransactionStatus", "PlatformTransactionManager", "DataSource"], "answer": [2], "why": ["Definition 是规则说明书", "Status 是状态", "Manager = 干活的经理", "DataSource 是数据源，不是事务接口"], "explain": "Manager 干活，Definition 定规则，Status 看状态。", "m": "tx", "tags": []}, {"id": "tx-p3", "type": "single", "lesson": 1, "stem": "传播行为的默认值是？", "options": ["REQUIRES_NEW", "REQUIRED", "NESTED", "SUPPORTS"], "answer": [1], "why": ["总是新建，不是默认", "默认：有就加入，没有就新建", "嵌套，不是默认", "不是默认"], "explain": "默认值两个必背：传播 REQUIRED，隔离 DEFAULT。", "m": "tx", "tags": []}, {"id": "tx-p4", "type": "single", "lesson": 1, "stem": "读到了别的事务<strong>还没提交<\/strong>的数据，这叫？", "options": ["脏读", "不可重复读", "幻读", "回滚"], "answer": [0], "why": ["关键字「未提交」→ 脏读", "不可重复读是同一行值变了", "幻读是行数变了", "回滚不是并发问题"], "explain": "未提交 → 脏读；值变了 → 不可重复读；行数变了 → 幻读。", "m": "tx", "tags": []}, {"id": "tx-p5", "type": "single", "lesson": 2, "stem": "在方法上贴 `@Transactional`，属于哪种事务写法？", "options": ["编程式事务", "声明式事务", "分布式事务", "只读事务"], "answer": [1], "why": ["编程式是 TransactionTemplate", "贴注解 = 声明式", "分布式是 JTA", "只读是一条规则，不是写法"], "explain": "看到 Template → 编程式；看到 @Transactional → 声明式。", "m": "tx", "tags": []}, {"id": "tx-p6", "type": "single", "lesson": 2, "stem": "`@Transactional` 方法执行中抛出 `IOException`（没写 rollbackFor），结果是？", "options": ["回滚", "不回滚，照样提交", "程序直接退出", "自动重试"], "answer": [1], "why": ["名字里不带 Runtime，默认不回滚", "默认只有 Runtime 类错误才回滚", "不会退出", "不会重试"], "explain": "看名字：带 Runtime 回滚，不带不回滚，除非写 rollbackFor。", "m": "tx", "tags": []}, {"id": "tx-1", "type": "multi", "tags": ["basic"], "stem": "Spring 事务抽象的三个核心接口是？", "options": ["PlatformTransactionManager", "TransactionDefinition", "TransactionStatus", "TransactionTemplate"], "answer": [0, 1, 2], "why": ["经理：开启、提交、回滚", "定义：规则", "状态", "Template 是编程式事务的工具，不是三个核心接口之一"], "explain": "Manager、Definition、Status。", "m": "tx"}, {"id": "tx-2", "type": "single", "tags": ["basic"], "stem": "描述事务的传播行为、隔离级别、超时、只读等规则的是？", "options": ["PlatformTransactionManager", "TransactionDefinition", "TransactionStatus", "JdbcTemplate"], "answer": [1], "why": ["Manager 是干活的", "Definition = 规则说明书", "Status 是状态", "JdbcTemplate 是访问数据库的工具"], "explain": "Definition 定规则。", "m": "tx"}, {"id": "tx-3", "type": "single", "tags": ["basic"], "stem": "使用 MyBatis 或 JdbcTemplate 时，对应的事务管理器是？", "options": ["JpaTransactionManager", "DataSourceTransactionManager", "JtaTransactionManager", "HibernateTransactionManager"], "answer": [1], "why": ["JPA 用的", "JDBC、JdbcTemplate、MyBatis 都用 DataSource", "分布式事务用的", "Hibernate 用的"], "explain": "名字前半截是对应技术，只有 JDBC 和 MyBatis 用 DataSource。", "m": "tx"}, {"id": "tx-4", "type": "single", "tags": ["basic"], "stem": "使用 Spring Data JPA 时，对应的事务管理器是？", "options": ["DataSourceTransactionManager", "JpaTransactionManager", "JtaTransactionManager", "不需要事务管理器"], "answer": [1], "why": ["那是 JDBC / MyBatis 的", "JPA → JpaTransactionManager", "那是分布式事务的", "需要，Boot 会自动配"], "explain": "名字前半截就是技术名。", "m": "tx"}, {"id": "tx-5", "type": "single", "tags": ["basic"], "stem": "跨多个数据库的<strong>分布式事务<\/strong>，使用哪个事务管理器？", "options": ["DataSourceTransactionManager", "JpaTransactionManager", "JtaTransactionManager", "HibernateTransactionManager"], "answer": [2], "why": ["单个数据源用的", "JPA 用的", "JTA = 分布式事务", "Hibernate 用的"], "explain": "分布式 → Jta。", "m": "tx"}, {"id": "tx-6", "type": "single", "tags": ["basic"], "stem": "Spring 隔离级别的默认值 DEFAULT 表示？", "options": ["读未提交", "读已提交", "串行化", "使用数据库自己的默认隔离级别"], "answer": [3], "why": ["不是固定某一级", "不是固定某一级", "不是固定某一级", "DEFAULT = 跟着数据库走"], "explain": "例如 MySQL 默认是可重复读。", "m": "tx"}, {"id": "tx-7", "type": "single", "tags": ["basic"], "stem": "哪种传播行为表示「<strong>总是<\/strong>另开一个新的独立事务」？", "options": ["REQUIRED", "REQUIRES_NEW", "NESTED", "SUPPORTS"], "answer": [1], "why": ["有就加入，没有才新建", "REQUIRES_NEW = 需要新的", "是在原事务里存档，不是独立新事务", "有就加入，没有就算了"], "explain": "名字就是意思：REQUIRES_NEW「需要新的」。", "m": "tx"}, {"id": "tx-8", "type": "single", "tags": ["basic"], "stem": "哪种传播行为表示「必须已经有事务，<strong>没有就报错<\/strong>」？", "options": ["MANDATORY", "NEVER", "SUPPORTS", "NOT_SUPPORTED"], "answer": [0], "why": ["MANDATORY = 强制", "NEVER 是「有事务就报错」，正好相反", "有没有都行", "有也不用"], "explain": "MANDATORY 没有就报错；NEVER 有就报错。", "m": "tx"}, {"id": "tx-9", "type": "single", "tags": ["basic"], "stem": "哪种传播行为表示「绝不能在事务里运行，<strong>有事务就报错<\/strong>」？", "options": ["MANDATORY", "NEVER", "NOT_SUPPORTED", "REQUIRED"], "answer": [1], "why": ["那是没有就报错", "NEVER = 绝不", "NOT_SUPPORTED 是有也不用，但不报错", "有就加入"], "explain": "注意 NEVER（报错）和 NOT_SUPPORTED（不报错，只是不用）的区别。", "m": "tx"}, {"id": "tx-10", "type": "single", "tags": ["basic"], "stem": "关于 REQUIRES_NEW 和 NESTED，说法正确的是？", "options": ["两者完全一样", "REQUIRES_NEW 另开独立新事务；NESTED 在原事务里存档嵌套执行", "NESTED 另开独立新事务；REQUIRES_NEW 在原事务里存档", "两者都不使用事务"], "answer": [1], "why": ["区别是考点", "NEW = 新的独立事务；NESTED = 嵌套、存档", "说反了", "两者都用事务"], "explain": "最容易混的一对，记住「NEW 是新的，NESTED 是存档」。", "m": "tx"}, {"id": "tx-11", "type": "single", "tags": ["basic"], "stem": "同一个事务里，两次读同一行数据，<strong>值不一样<\/strong>了。这是？", "options": ["脏读", "不可重复读", "幻读", "死锁"], "answer": [1], "why": ["脏读是读到未提交的", "值变了 → 不可重复读", "幻读是行数变了", "死锁是互相等待"], "explain": "未提交 → 脏读；值变了 → 不可重复读；行数变了 → 幻读。", "m": "tx"}, {"id": "tx-12", "type": "single", "tags": ["basic"], "stem": "同样的条件查询两次，<strong>查到的行数不一样<\/strong>了。这是？", "options": ["脏读", "不可重复读", "幻读", "超时"], "answer": [2], "why": ["脏读是读到未提交的", "不可重复读是值变了", "行数变了 → 幻读", "超时是执行太久"], "explain": "行数变了 → 幻读。", "m": "tx"}, {"id": "tx-13", "type": "single", "tags": ["basic"], "stem": "能挡住<strong>全部三种<\/strong>并发问题（脏读、不可重复读、幻读）的隔离级别是？", "options": ["READ_UNCOMMITTED", "READ_COMMITTED", "REPEATABLE_READ", "SERIALIZABLE"], "answer": [3], "why": ["什么都挡不住", "只挡脏读", "挡脏读和不可重复读", "串行化，最高级别，全挡"], "explain": "级别从低到高，每升一级多挡一个问题。", "m": "tx"}, {"id": "tx-14", "type": "single", "tags": ["basic"], "stem": "READ_COMMITTED（读已提交）能挡住哪个问题？", "options": ["脏读", "不可重复读", "幻读", "全部"], "answer": [0], "why": ["只读别人提交过的，所以不会读到未提交的 → 没有脏读", "挡不住", "挡不住", "只有 SERIALIZABLE 全挡"], "explain": "名字就是它挡住的问题。", "m": "tx"}, {"id": "tx-15", "type": "single", "tags": ["basic"], "stem": "使用 `TransactionTemplate` 管理事务，属于？", "options": ["编程式事务", "声明式事务", "分布式事务", "只读事务"], "answer": [0], "why": ["看到 Template → 编程式", "声明式是贴 @Transactional", "不是", "不是"], "explain": "Template → 编程式；@Transactional → 声明式。", "m": "tx"}, {"id": "tx-16", "type": "single", "tags": ["basic"], "stem": "声明式事务（@Transactional）在 Spring 中是靠什么实现的？", "options": ["数据库触发器", "AOP 代理", "修改你的 SQL", "多线程"], "answer": [1], "why": ["无关", "Spring 在方法外面套一层代理来开事务、提交、回滚", "Spring 不改 SQL", "无关"], "explain": "声明式事务靠 AOP 代理。", "m": "tx"}, {"id": "tx-17", "type": "single", "tags": ["basic"], "stem": "传统 Spring（不用 Spring Boot）中，用哪个注解<strong>打开<\/strong>注解式事务功能？", "options": ["@EnableTransactionManagement", "@Transactional", "@EnableAutoConfiguration", "@Service"], "answer": [0], "why": ["Enable = 打开，TransactionManagement = 事务管理", "它是贴在方法上用的，不是打开功能的开关", "那是 Boot 自动配置的开关", "那是标记业务类的"], "explain": "Spring Boot 会自动打开，不用写。", "m": "tx"}, {"id": "tx-18", "type": "single", "tags": ["basic"], "stem": "@Transactional 方法中抛出哪种错误时，<strong>默认会回滚<\/strong>？", "options": ["RuntimeException", "IOException", "SQLException", "Exception"], "answer": [0], "why": ["名字带 Runtime → 回滚", "不带 Runtime → 默认不回滚", "不带 Runtime → 默认不回滚", "不带 Runtime → 默认不回滚"], "explain": "看名字：带 Runtime 回滚，不带不回滚。", "m": "tx"}, {"id": "tx-19", "type": "single", "tags": ["basic"], "stem": "想让 @Transactional 遇到 `Exception` 时也回滚，应该在注解里加？", "options": ["timeout", "readOnly", "rollbackFor", "propagation"], "answer": [2], "why": ["超时设置", "只读设置", "rollbackFor = 遇到什么要回滚", "传播行为"], "explain": "`@Transactional(rollbackFor = Exception.class)`。", "m": "tx"}, {"id": "tx-20", "type": "single", "tags": ["basic"], "stem": "判断：「@Transactional 方法出现任何错误，事务都会回滚」", "options": ["正确", "错误"], "answer": [1], "why": ["不带 Runtime 的错误默认不回滚", "默认只有 Runtime 类错误（和 Error）才回滚"], "explain": "常见陷阱题。", "m": "tx"}, {"id": "tx-21", "type": "multi", "tags": ["basic"], "stem": "下面哪些情况，@Transactional 的事务<strong>不会<\/strong>按预期回滚？", "options": ["同一个类里，没贴注解的方法调用了贴注解的方法", "方法里用 try/catch 把错误接住了", "抛出 IOException，且没写 rollbackFor", "抛出 RuntimeException 且没有被接住"], "answer": [0, 1, 2], "why": ["类里自己调自己，没经过代理，不生效", "错误被接住，代理不知道，照样提交", "不带 Runtime，默认不回滚", "这是标准的会回滚的情况"], "explain": "三个坑：自己调自己、错误被接住、不带 Runtime 的错误。", "m": "tx"}, {"id": "tx-22", "type": "single", "tags": ["basic"], "stem": "@Transactional 贴在哪种方法上才生效（课程所用版本）？", "options": ["public 方法", "private 方法", "任何方法都一样", "只能贴在类上"], "answer": [0], "why": ["贴在 public 方法上才生效", "贴在 private 上不生效", "不一样", "方法和类上都可以贴"], "explain": "记住：public 才生效。", "m": "tx"}, {"id": "tx-23", "type": "single", "tags": ["basic"], "stem": "编程式事务中，想手动让事务回滚，调用？", "options": ["setRollbackOnly()", "commit()", "setReadOnly()", "close()"], "answer": [0], "why": ["字面意思：设为只能回滚", "那是提交", "那是只读", "不是事务方法"], "explain": "setRollbackOnly = 设为只能回滚。", "m": "tx"}, {"id": "tx-a1", "type": "single", "tags": ["进阶"], "stem": "【进阶，可跳过】A 有事务，A 调用 B（REQUIRES_NEW）插入一条日志，B 正常结束。之后 A 出错回滚。日志还在吗？", "options": ["在", "不在", "看隔离级别", "看是否只读"], "answer": [0], "why": ["B 是独立的新事务，B 结束时已经提交了，A 回滚管不到它", "NESTED 才会被一起回滚", "无关", "无关"], "explain": "REQUIRES_NEW：独立事务，先提交了就留下。", "m": "tx"}, {"id": "tx-a2", "type": "single", "tags": ["进阶"], "stem": "【进阶，可跳过】同上一题，但 B 改成 NESTED。A 回滚后日志还在吗？", "options": ["在", "不在", "报错", "B 变成 REQUIRES_NEW"], "answer": [1], "why": ["NESTED 还在 A 的事务里，没有单独提交", "A 回滚，存档里的内容一起撤销", "不会报错", "不会自动转换"], "explain": "NESTED 是同一个事务里的存档，外层回滚连带它。", "m": "tx"}, {"id": "tx-a3", "type": "single", "tags": ["进阶"], "stem": "【进阶，可跳过】外面调用 `invoke()`，表里会不会留下 BBB？\n\n```java\n@Transactional(rollbackFor = RollbackException.class)\npublic void insertThenRollback() throws RollbackException {\n    插入 BBB;\n    throw new RollbackException();\n}\n\npublic void invoke() throws RollbackException {\n    insertThenRollback();   // 同一个类里直接调用\n}\n```", "options": ["会留下", "不会留下", "启动报错", "不确定"], "answer": [0], "why": ["类里自己调自己，没经过代理，事务没开，BBB 直接保存了", "要经过代理才会回滚", "能正常启动", "结果是确定的"], "explain": "第 11、14 讲的经典例子：自己调自己，事务失效。", "m": "tx"}, {"id": "tx-a4", "type": "multi", "tags": ["进阶"], "stem": "【进阶，可跳过】A 有事务，调用 B，B 出了 RuntimeException，A 用 try/catch 接住后继续正常结束。A 自己插入的数据<strong>能保存下来<\/strong>的是？", "options": ["B 是 REQUIRES_NEW", "B 是 NESTED", "B 是 REQUIRED"], "answer": [0, 1], "why": ["B 只回滚自己的独立事务", "B 只回滚到存档点", "B 和 A 共用一个事务，B 出错已经把整个事务标记成只能回滚，A 结束时也会回滚"], "explain": "（补充）REQUIRED 下内层出错会把共用的事务标记为只能回滚，外层接住也没用。", "m": "tx"}]}, {"id": "jpa", "title": "Spring Data JPA：实体、Repository 和按方法名查询", "short": "JPA", "group": "第三章 O/R Mapping 实践", "exam": "第 15—19、23 讲", "refs": [{"label": "Spring Data JPA 文档 · 按方法名查询", "url": "https://docs.spring.io/spring-data/jpa/docs/2.1.x/reference/html/#jpa.query-methods"}], "lessons": [{"title": "ORM、JPA、Hibernate、Spring Data JPA 是什么关系", "cards": ["### 一句话\n\nJava 里是「对象」，数据库里是「表」，两者结构不一样。<strong>ORM（对象关系映射）就是把对象和表自动对应起来<\/strong>，你操作对象，它帮你生成 SQL。\n\n| 名字 | 是什么 | 打个比方 |\n|---|---|---|\n| <strong>JPA<\/strong> | 一套<strong>规范<\/strong>（只定规则，不干活） | 驾照考试标准 |\n| <strong>Hibernate<\/strong> | JPA 的一种<strong>实现<\/strong>（真正干活的） | 一个具体的司机 |\n| <strong>Spring Data JPA<\/strong> | Spring 在 JPA 之上再简化一层，提供 <strong>Repository<\/strong> | 给司机配了自动驾驶 |\n\n> 📌 认准：<strong>JPA 是规范，Hibernate 是实现，Spring Data JPA 用 Repository 再简化。<\/strong>", "### 实体注解：对号入座（第 16 讲）\n\n「实体」就是和一张表对应的 Java 类。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 这个类对应数据库里的一张表 | <strong>@Entity<\/strong> |\n| 指定表名 | <strong>@Table<\/strong> |\n| 这个字段是主键 | <strong>@Id<\/strong> |\n| 主键自动生成 | <strong>@GeneratedValue<\/strong> |\n| 指定列名等 | <strong>@Column<\/strong> |\n| 多对多关系（如一个订单多杯咖啡，一种咖啡在多个订单里） | <strong>@ManyToMany<\/strong> |\n| 一对多 / 多对一 | <strong>@OneToMany / @ManyToOne<\/strong> |\n| 自动记录创建时间 / 更新时间 | <strong>@CreationTimestamp / @UpdateTimestamp<\/strong> |\n| 枚举存进数据库 | <strong>@Enumerated<\/strong> |\n| 多个实体的公共字段（如 id、创建时间）放到父类 | <strong>@MappedSuperclass<\/strong> |"]}, {"title": "Lombok：少写样板代码", "cards": ["### 一句话\n\n<strong>Lombok 用注解自动生成那些又长又无聊的代码<\/strong>（取值、赋值、构造方法等），课程里大量使用。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 自动生成 getter / setter / toString 等一大堆 | <strong>@Data<\/strong> |\n| 只生成 getter / setter | <strong>@Getter / @Setter<\/strong> |\n| 生成无参构造方法 | <strong>@NoArgsConstructor<\/strong> |\n| 生成全参构造方法 | <strong>@AllArgsConstructor<\/strong> |\n| 用「链式写法」创建对象 | <strong>@Builder<\/strong> |\n| 自动生成一个日志对象 log | <strong>@Slf4j<\/strong> |\n| 生成 toString 方法 | <strong>@ToString<\/strong> |\n\n### SpringBucks 建模要点（第 17 讲）\n\n- 金额不能用小数类型（会有精度问题），课程用 <strong>Joda Money<\/strong> 库表示金额；\n- 订单状态用<strong>枚举<\/strong>表示（如 INIT、PAID、BREWING、BREWED、TAKEN、CANCELLED）。"]}, {"title": "Repository：只写接口就能查数据库", "cards": ["### 一句话\n\n<strong>在 Spring Data JPA 里，你只需要写一个接口，不用写实现，Spring 自动帮你生成。<\/strong>\n\n三个常见的父接口，一个比一个功能多：\n\n| 接口 | 提供 |\n|---|---|\n| <strong>CrudRepository<\/strong> | 基本的增删改查（Crud = Create Read Update Delete） |\n| <strong>PagingAndSortingRepository<\/strong> | 再加上<strong>分页和排序<\/strong> |\n| <strong>JpaRepository<\/strong> | 再加上 JPA 特有的功能（如批量） |\n\n- 开启 Repository 扫描：<strong>@EnableJpaRepositories<\/strong>（Boot 自动开启）；\n- 不想让 Spring 为某个接口生成实现（比如它只是公共父接口）：<strong>@NoRepositoryBean<\/strong>。", "### 按方法名查询：方法名就是查询条件（第 18 讲）\n\n只要按规则起方法名，Spring 就能「读懂」并生成 SQL：\n\n| 方法名 | Spring 理解为 |\n|---|---|\n| `findByName(name)` | 按名字查 |\n| `findByNameAndPrice(...)` | 按名字<strong>和<\/strong>价格查 |\n| `findByCustomerOrderById(...)` | 按顾客查，<strong>按 id 排序<\/strong> |\n| `findTop3ByOrderByUpdateTimeDesc()` | 按更新时间倒序，取<strong>前 3 个<\/strong> |\n| `countByStatus(...)` | 按状态<strong>计数<\/strong> |\n\n- 开头：<strong>find…By / read…By / query…By / get…By<\/strong>（查询），<strong>count…By<\/strong>（计数）；\n- 中间：And、Or、OrderBy、Top / First；\n- 分页参数 <strong>Pageable<\/strong>，排序参数 <strong>Sort<\/strong>。\n\n### Repository 是怎么变成 Bean 的（第 19 讲，认关键词）\n\nSpring 为你的接口生成<strong>代理对象<\/strong>。基础的增删改查交给默认实现 <strong>SimpleJpaRepository<\/strong>；按方法名的查询，由框架<strong>解析方法名<\/strong>后执行。\n\n### Query by Example（第 23 讲）\n\n拿一个「样例对象」当查询条件：样例里填了什么字段，就按什么字段查。"]}], "questions": [{"id": "jpa-p1", "type": "single", "stem": "JPA、Hibernate 的关系是？", "options": ["JPA 是规范，Hibernate 是它的一种实现", "Hibernate 是规范，JPA 是实现", "  "options": ["命令行", "Maven 插件", "Java 代码", "浏览器插件"], "answer": [0, 1, 2], "why": ["可以", "可以", "可以", "不可以"], "explain": "三种方式。", "tags": ["basic"], "m": "mybatis"}, {"id": "mybatis-11", "type": "multi", "stem": "PageHelper 中可以用什么参数发起分页？", "options": ["RowBounds", "在方法参数中传页码和每页条数", "Pageable", "Sort"], "answer": [0, 1], "why": ["可以", "可以", "Spring Data 的", "Spring Data 的"], "explain": "RowBounds 或方法参数。", "tags": ["basic"], "m": "mybatis"}, {"id": "mybatis-12", "type": "single", "stem": "判断：MyBatis Generator 生成的代码可以直接使用，不需要人工检查", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：仍需审查"], "explain": "生成结果仍需审查。", "tags": ["basic"], "m": "mybatis"}, {"id": "mybatis-13", "type": "single", "stem": "相比 JPA，MyBatis 更适合的场景是？", "options": ["复杂查询、需要精细控制 SQL", "完全不想写 SQL 的简单增删改查", "不使用数据库的程序", "只做页面展示"], "answer": [0], "why": ["对", "那是 JPA 的长处", "无关", "无关"], "explain": "控制 SQL → MyBatis。", "tags": ["basic"], "m": "mybatis"}]}, {"id": "nosql", "title": "NoSQL 与缓存：Docker、MongoDB、Redis、缓存注解", "short": "NoSQL 与缓存", "group": "第四章 NoSQL 实践", "exam": "第 24—30 讲", "refs": [{"label": "Spring 5.3 文档 · 缓存抽象", "url": "https://docs.spring.io/spring-framework/docs/5.3.x/reference/html/integration.html#cache"}], "lessons": [{"title": "Docker：一键启动数据库（了解）", "cards": ["### 一句话\n\n<strong>Docker 让你不用安装，一条命令就把 MongoDB、Redis 这类软件跑起来。<\/strong>课程用它来辅助开发。\n\n| 词 | 一句话 |\n|---|---|\n| <strong>镜像（image）<\/strong> | 软件的「安装包」，只读 |\n| <strong>容器（container）<\/strong> | 镜像<strong>运行起来<\/strong>的实例 |\n| <strong>端口映射<\/strong> | 把容器里的端口对到电脑上，`-p 电脑端口:容器端口` |\n| <strong>数据卷（volume）<\/strong> | 把数据存到容器外面，容器删了数据还在，`-v` |\n| <strong>环境变量<\/strong> | 启动时传配置，`-e` |\n\n| 命令 | 作用 |\n|---|---|\n| docker <strong>pull<\/strong> | 下载镜像 |\n| docker <strong>run<\/strong> | 用镜像创建并启动容器 |\n| docker <strong>ps<\/strong> | 看正在运行的容器 |\n| docker <strong>logs<\/strong> | 看容器日志 |\n| docker <strong>stop / start<\/strong> | 停止 / 启动容器 |\n\n> 📌 认准：<strong>镜像是安装包，容器是跑起来的程序。<\/strong>"]}, {"title": "MongoDB 和 Redis", "cards": ["### MongoDB：存「文档」的数据库（第 25 讲）\n\nMongoDB 不用表，存的是类似 JSON 的<strong>文档<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 标记一个类对应 MongoDB 里的文档 | <strong>@Document<\/strong> |\n| 主键 | <strong>@Id<\/strong> |\n| 操作 MongoDB 的工具类 | <strong>MongoTemplate<\/strong> |\n| 只写接口就能操作 MongoDB | <strong>MongoRepository<\/strong> |\n| 特殊类型（如金额）的读写转换 | 自定义<strong>转换器<\/strong>（Converter） |\n\n> 💡 和 JPA 对比着记：JPA 是 @Entity + JpaRepository，MongoDB 是 <strong>@Document + MongoRepository<\/strong>，模板类叫 <strong>MongoTemplate<\/strong>。", "### Redis：放在内存里的键值数据库（第 26、27、29 讲）\n\n<strong>Redis 很快，常用来做缓存。<\/strong>数据结构有：<strong>String（字符串）、List（列表）、Hash（哈希）、Set（集合）、ZSet（有序集合）<\/strong>。\n\n<strong>Java 连 Redis 的两个客户端：<\/strong>\n\n| 客户端 | 特点 |\n|---|---|\n| <strong>Jedis<\/strong> | <strong>不是线程安全的<\/strong>，多线程要用连接池 <strong>JedisPool<\/strong> |\n| <strong>Lettuce<\/strong> | 基于 Netty，线程安全，<strong>Spring Boot 2 默认<\/strong> |\n\n<strong>Redis 的两种高可用部署：<\/strong>\n\n| 模式 | 一句话 | Jedis 里用 |\n|---|---|---|\n| <strong>哨兵（Sentinel）<\/strong> | 哨兵<strong>监控<\/strong>主从节点，主挂了<strong>自动切换<\/strong> | JedisSentinelPool |\n| <strong>集群（Cluster）<\/strong> | 数据<strong>分片<\/strong>存到多个节点，共 <strong>16384 个哈希槽<\/strong> | JedisCluster |\n\n> ⚠️ 易混：<strong>哨兵 = 监控 + 故障切换；集群 = 分片。<\/strong>", "### 在 Spring 里操作 Redis（第 29 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 操作 Redis 的模板类 | <strong>RedisTemplate<\/strong>（专门处理字符串的：<strong>StringRedisTemplate<\/strong>） |\n| 操作字符串值 / 哈希 / 列表 | <strong>opsForValue() / opsForHash() / opsForList()<\/strong> |\n| 用 Repository 的方式操作 Redis，实体上贴 | <strong>@RedisHash<\/strong> |\n| 存进 Redis 时怎么把对象转成字节 | <strong>序列化器<\/strong>（RedisSerializer），可自定义，如转成 JSON |\n\n> 💡 「ops」是 operations（操作）的缩写，后面跟数据结构名。"]}, {"title": "缓存抽象：三个注解必背", "cards": ["### 一句话\n\n<strong>在方法上贴个注解，Spring 就自动帮你缓存结果。<\/strong>第二次调用时直接拿缓存，不再查数据库。\n\n先用 <strong>@EnableCaching<\/strong> 打开缓存功能。然后：\n\n| 注解 | 做什么 | 记法 |\n|---|---|---|\n| <strong>@Cacheable<\/strong> | 先查缓存，<strong>有就直接返回<\/strong>，没有才执行方法并放进缓存 | able = 可以缓存 |\n| <strong>@CachePut<\/strong> | <strong>总是执行方法<\/strong>，然后把结果更新到缓存 | Put = 放进去 |\n| <strong>@CacheEvict<\/strong> | <strong>清除<\/strong>缓存 | Evict = 赶走 |\n| @Caching | 把上面几个组合起来 | |\n| @CacheConfig | 贴在类上，写一些公共设置（如缓存名） | Config = 配置 |\n\n> 📌 必背：<strong>Cacheable 有缓存就不执行；CachePut 总是执行再更新；CacheEvict 清除。<\/strong>", "### 缓存放在哪\n\nSpring 只定义了「怎么用缓存」，缓存具体存在哪可以换：\n\n- 本地内存：ConcurrentHashMap、EhCache、Caffeine；\n- 分布式：<strong>Redis<\/strong>（多个程序共用一份缓存）。\n\n配置举例：`spring.cache.type=redis`（用 Redis 做缓存）、`spring.cache.redis.time-to-live`（缓存多久过期）。\n\n<strong>怎么选（第 28 讲）：<\/strong>\n- 只在一台机器上用、数据变化少 → 本地缓存；\n- 多台机器要共享、数据量大 → Redis 这种分布式缓存；\n- 都要考虑<strong>数据一致性<\/strong>和<strong>过期策略<\/strong>。\n\n### SpringBucks 进度（第 30 讲）\n\n咖啡店把<strong>菜单<\/strong>放进 Redis 缓存（菜单读多改少，很适合缓存），订单数据仍然用 JPA 存数据库。"]}], "questions": [{"id": "nosql-p1", "type": "single", "stem": "Docker 中，软件的「安装包」叫什么？", "options": ["镜像", "容器", "数据卷", "端口"], "answer": [0], "why": ["镜像 image", "容器是运行起来的实例", "存数据的", "网络"], "explain": "镜像是安装包，容器是跑起来的。", "tags": [], "lesson": 0, "m": "nosql"}, {"id": "nosql-p2", "type": "single", "stem": "标记一个类对应 MongoDB 中的文档，用？", "options": ["@Document", "@Entity", "@RedisHash", "@Table"], "answer": [0], "why": ["MongoDB", "JPA", "Redis", "JPA 表名"], "explain": "MongoDB → @Document。", "tags": [], "lesson": 1, "m": "nosql"}, {"id": "nosql-p3", "type": "single", "stem": "哪个 Redis 客户端<strong>不是线程安全的<\/strong>，需要配连接池使用？", "options": ["Jedis", "Lettuce", "RedisTemplate", "MongoTemplate"], "answer": [0], "why": ["Jedis → JedisPool", "Lettuce 线程安全", "它是 Spring 的模板", "MongoDB 的"], "explain": "Jedis 不安全，Lettuce 安全。", "tags": [], "lesson": 1, "m": "nosql"}, {"id": "nosql-p4", "type": "single", "stem": "先查缓存，有就直接返回、不执行方法的注解是？", "options": ["@Cacheable", "@CachePut", "@CacheEvict", "@EnableCaching"], "answer": [0], "why": ["对", "它总是执行方法", "它是清除", "它是打开缓存功能"], "explain": "Cacheable。", "tags": [], "lesson": 2, "m": "nosql"}, {"id": "nosql-1", "type": "single", "stem": "Docker 命令中，查看正在运行的容器用？", "options": ["docker r 通过什么方式分片？", "options": ["16384 个哈希槽", "按表名", "按时间", "随机"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "哈希槽。", "tags": ["basic"], "m": "nosql"}, {"id": "nosql-10", "type": "single", "stem": "Spring 中专门操作字符串的 Redis 模板是？", "options": ["StringRedisTemplate", "RedisTemplate", "MongoTemplate", "JdbcTemplate"], "answer": [0], "why": ["对", "通用的", "MongoDB", "JDBC"], "explain": "String + RedisTemplate。", "tags": ["basic"], "m": "nosql"}, {"id": "nosql-11", "type": "single", "stem": "RedisTemplate 中操作哈希结构，用？", "options": ["opsForHash()", "opsForValue()", "opsForList()", "opsForSet()"], "answer": [0], "why": ["对", "字符串值", "列表", "集合"], "explain": "ops + 数据结构名。", "tags": ["basic"], "m": "nosql"}, {"id": "nosql-12", "type": "single", "stem": "用 Repository 方式操作 Redis，实体上贴？", "options": ["@RedisHash", "@Document", "@Entity", "@Cacheable"], "answer": [0], "why": ["对", "MongoDB", "JPA", "缓存"], "explain": "@RedisHash。", "tags": ["basic"], "m": "nosql"}, {"id": "nosql-13", "type": "single", "stem": "打开 Spring 缓存功能的注解是？", "options": ["@EnableCaching", "@Cacheable", "@CacheConfig", "@EnableRedisRepositories"], "answer": [0], "why": ["Enable = 打开", "用缓存", "类级公共配置", "打开 Redis Repository"], "explain": "@EnableCaching。", "tags": ["basic"], "m": "nosql"}, {"id": "nosql-14", "type": "single", "stem": "<strong>总是执行方法<\/strong>，并把结果更新到缓存的注解是？", "options": ["@CachePut", "@Cacheable", "@CacheEvict", "@Caching"], "answer": [0], "why": ["Put = 放进去", "有缓存就不执行", "清除", "组合"], "explain": "CachePut 总是执行。", "tags": ["basic"], "m": "nosql"}, {"id": "nosql-15", "type": "single", "stem": "<strong>清除<\/strong>缓存的注解是？", "options": ["@CacheEvict", "@CachePut", "@Cacheable", "@CacheConfig"], "answer": [0], "why": ["Evict = 赶走", "更新", "读", "公共配置"], "explain": "CacheEvict。", "tags": ["basic"], "m": "nosql"}, {"id": "nosql-16", "type": "single", "stem": "贴在类上、为类中所有缓存注解提供公共设置（如缓存名）的是？", "options": ["@CacheConfig", "@Caching", "@EnableCaching", "@Cacheable"], "answer": [0], "why": ["Config = 配置", "组合 。", "### 三个重要概念\n\n| 概念 | 一句话 |\n|---|---|\n| <strong>订阅才执行<\/strong> | 写好的流水线，<strong>不调用 subscribe() 就什么都不会发生<\/strong> |\n| <strong>背压（backpressure）<\/strong> | <strong>下游告诉上游自己一次能处理多少<\/strong>，防止被数据淹没（通过 request(n)） |\n| <strong>线程调度<\/strong> | 用 <strong>Schedulers<\/strong> 指定在哪种线程上运行；<strong>publishOn<\/strong> 影响它后面的操作，<strong>subscribeOn<\/strong> 影响数据源头 |\n\n### 常用操作符（认名字）\n\n| 操作符 | 作用 |\n|---|---|\n| <strong>map<\/strong> | 把每个元素变成另一个（一对一） |\n| <strong>flatMap<\/strong> | 把每个元素变成<strong>一个新的流<\/strong>再合并 |\n| <strong>filter<\/strong> | 过滤 |\n| <strong>onErrorResume / onErrorReturn<\/strong> | 出错时换一个流 / 返回一个默认值 |\n| <strong>doOnNext<\/strong> | 每来一个元素时顺便做点事（如打日志） |\n\n> 📌 必背：<strong>Mono 0..1，Flux 0..N；不订阅不执行；背压 = 下游控制速度。<\/strong>"]}, {"title": "响应式访问 Redis、MongoDB 和关系型数据库", "cards": ["### 对号入座（第 33—35 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 响应式操作 Redis 的模板 | <strong>ReactiveRedisTemplate<\/strong>（字符串版 ReactiveStringRedisTemplate） |\n| 响应式访问 Redis 需要的客户端 | <strong>Lettuce<\/strong>（Jedis <strong>不支持<\/strong>响应式） |\n| 响应式操作 MongoDB 的模板 | <strong>ReactiveMongoTemplate<\/strong> |\n| 响应式访问<strong>关系型数据库<\/strong>的规范 | <strong>R2DBC<\/strong> |\n| R2DBC 中的连接工厂 / 操作数据库的客户端 | <strong>ConnectionFactory / DatabaseClient<\/strong> |\n\n- 记法：普通版前面加 <strong>Reactive<\/strong> 就是响应式版。\n- <strong>R2DBC<\/strong> = Reactive Relational Database Connectivity（响应式关系数据库连接）。课程录制时它还在<strong>孵化阶段<\/strong>，支持的数据库驱动不多。\n- 传统 JDBC 是<strong>阻塞<\/strong>的，所以响应式访问关系数据库需要 R2DBC。"]}], "questions": [{"id": "reactor-p1", "type": "single", "stem": "Reactor 中表示 <strong>0 个或 1 个<\/strong>结果的类型是？", "options": ["Mono", "Flux", "List", "Optional"], "answer": [0], "why": ["对", "Flux 是 0 到多个", "普通 Java 集合", "普通 Java 类型"], "explain": "Mono 0..1，Flux 0..N。", "tags": [], "lesson": 0, "m": "reactor"}, {"id": "reactor-p2", "type": "single", "stem": "下游告诉上游「我一次能处理多少」的机制叫？", "options": ["背压", "缓存", "事务", "熔断"], "answer": [0], "why": ["backpressure", "无关", "无关", "无关"], "explain": "背压 = 下游控制速度。", "tags": [], "lesson": 0, "m": "reactor"}, {"id": "reactor-p3", "type": "single", "stem": "响应式访问<strong>关系型数据库<\/strong>的规范是？", "options": ["R2DBC", "JDBC", "JPA", "MyBatis"], "answer": [0], "why": ["对", "JDBC 是阻塞的", "不是响应式", "不是响应式"], "explain": "R2DBC。", "tags": [], "lesson": 1, "m": "reactor"}, {"id": "reactor-1", "type": "single", "stem": "Reactor 中表示 <strong>0 到多个<\/strong>结果的类型是？", "options": ["Flux", "Mono", "Future", "Optional"], "answer": [0], "why": ["Flux = 流", "0..1", "普通 Java", "普通 Java"], "explain": "Flux。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-2", "type": "single", "stem": "Project Reactor 实现的规范是？", "options": ["Reactive Streams", "JPA", "Servlet", "JDBC"], "answer": [0], "why": ["对", "持久化规范", "Web 规范", "数据库连接规范"], "explain": "Reactive Streams。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-3", "type": "multi", "stem": "Reactive Streams 中的角色包括？", "options": ["Publisher", "Subscriber", "Subscription", "Repository"], "answer": [0, 1, 2], "why": ["发布者", "订阅者", "订阅关系", "Spring Data 的"], "explain": "还有 Processor。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-4", "type": "single", "stem": "判断：在 Reactor 中，定义好流之后，即使不订阅也会立即执行", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：不订阅什么都不会发生"], "explain": "订阅才执行。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-5", "type": "single", "stem": "把每个元素变成<strong>一个新的流<\/strong>再合并起来的操作符是？", "options": ["flatMap", "map", "filter", "doOnNext"], "answer": [0], "why": ["对", "map 是一对一转换", "过滤", "顺便做点事"], "explain": "map 一对一，flatMap 变成流再合并。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-6", "type": "single", "stem": "把每个元素一对一地转换成另一个值的操作符是？", "options": ["map", "flatMap", "filter", "subscribe"], "answer": [0], "why": ["对", "转换成流", "过滤", "订阅"], "explain": "map。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-7", "type": "single", "stem": "出错时返回一个<strong>默认值<\/strong>的操作符是？", "options": ["onErrorReturn", "onErrorResume", "map", "filter"], "answer": [0], "why": ["Return = 返回一个值", "Resume = 换一个流继续", "转换", "过滤"], "explain": "Return 返回值，Resume 换流。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-8", "type": "single", "stem": "Reactor 中用于指定运行线程的工具是？", "options": ["Schedulers", "DataSource", "Executor 注解", "RestTemplate"], "answer": [0], "why": ["对", "数据源", "不是", "无关"], "explain": "Schedulers。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-9", "type": "single", "stem": "影响它<strong>后面<\/strong>操作所在线程的是？", "options": ["publishOn", "subscribeOn", "map", "filter"], "answer": [0], "why": ["对", "subscribeOn 影响数据源头", "不切线程", "不切线程"], "explain": "publishOn 管后面，subscribeOn 管源头。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-10", "type": "single", "stem": "响应式访问 Redis 必须使用哪个客户端？", "options": ["Lettuce", "Jedis", "Druid", "HikariCP"], "answer": [0], "why": ["对", "Jedis 不支持响应式", "连接池", "连接池"], "explain": "Lettuce 支持响应式。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-11", "type": "single", "stem": "响应式操作 MongoDB 的模板类是？", "options": ["ReactiveMongoTemplate", "MongoTemplate", "ReactiveRedisTemplate", "JdbcTemplate"], "answer": [0], "why": ["Reactive + MongoTemplate", "普通版", "Redis 的", "JDBC"], "explain": "前面加 Reactive。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-12", "type": "single", "stem": "响应式操作 Redis 的模板类是？", "options": ["ReactiveRedisTemplate", "RedisTemplate", "ReactiveMongoTemplate", "WebClient"], "answer": [0], "why": ["对", "普通版", "MongoDB", "调网络接口"], "explain": "前面加 Reactive。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-13", "type": "single", "stem": "R2DBC 中，用来操作数据库的客户端类是？", "options": ["DatabaseClient", "JdbcTemplate", "MongoTemplate", "RestTemplate"], "answer": [0], "why": ["对", "JDBC", "MongoDB", "网络"], "explain": "ConnectionFactory + DatabaseClient。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-14", "type": "single", "stem": "判断：课程录制时，Spring Data R2DBC 还处于孵化阶段，支持的驱动有限", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "第 35 讲。", "tags": ["basic"], "m": "reactor"}, {"id": "reactor-15", "type": "single", "stem": "按 id 查一杯咖啡（最多一个结果），响应式返回类型应该是？", "options": ["Mono", "Flux", "List", "void"], "answer": [0], "why": ["0..1", "多个", "不是响应式", "没有返回值"], "explain": "一个 → Mono。", "tags": ["basic"], "m": "reactor"}]}, {"id": "aop", "title": "AOP：在方法前后自动加一段逻辑", "short": "AOP", "group": "第五章 数据访问进阶", "exam": "第 36—38 讲", "refs": [{"label": "Spring 5.3 文档 · AOP", "url": "https://docs.spring.io/spring-framework/docs/5.3.x/reference/html/core.html#aop"}], "lessons": [{"title": "AOP 的几个词", "cards": ["### 一句话\n\n<strong>AOP（面向切面编程）= 不改原来的代码，在方法执行的前后自动加一段逻辑。<\/strong>\n\n典型用途：打日志、统计耗时、<strong>事务<\/strong>（事务模块讲过，@Transactional 就是靠 AOP 实现的）。这些逻辑到处都要用，叫「<strong>横切逻辑<\/strong>」。\n\n### 术语对号入座（必背）\n\n| 看到题目说…… | 就选 | 记法 |\n|---|---|---|\n| 要加的那段逻辑 + 加在哪，打包在一起 | <strong>切面（Aspect）<\/strong> | 一整块 |\n| 要加的那段逻辑本身（什么时候做、做什么） | <strong>通知（Advice）<\/strong> | 做什么 |\n| 规定<strong>加在哪些方法上<\/strong>的规则 | <strong>切点（Pointcut）<\/strong> | 在哪 |\n| 程序执行中可以加逻辑的点（Spring 里就是方法执行） | <strong>连接点（Join Point）<\/strong> | 可选的点 |\n| 被加了逻辑的原始对象 | <strong>目标对象（Target）<\/strong> | |\n| 把切面加到目标对象上的过程 | <strong>织入（Weaving）<\/strong> | |\n| Spring 生成的、带着额外逻辑的对象 | <strong>AOP 代理（Proxy）<\/strong> | |\n\n> 📌 最常考的三个：<strong>切面 = 通知 + 切点；通知 = 做什么；切点 = 在哪做。<\/strong>"]}, {"title": "五种通知和怎么写", "cards": ["### 五种通知（必背）\n\n| 注解 | 什么时候执行 |\n|---|---|\n| <strong>@Before<\/strong> | 方法执行<strong>之前<\/strong> |\n| <strong>@AfterReturning<\/strong> | 方法<strong>正常返回<\/strong>之后 |\n| <strong>@AfterThrowing<\/strong> | 方法<strong>抛出异常<\/strong>之后 |\n| <strong>@After<\/strong> | 方法结束后，<strong>不管成功还是出错都执行<\/strong>（像 finally） |\n| <strong>@Around<\/strong> | <strong>包住<\/strong>整个方法，前后都能做事，甚至决定方法执不执行 |\n\n- @Around 里要调用 <strong>ProceedingJoinPoint.proceed()<\/strong> 才会真正执行原方法；\n- 统计方法耗时，最适合用 <strong>@Around<\/strong>（前面记开始时间，后面算差值）。", "### 怎么写一个切面\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 标记一个类是切面 | <strong>@Aspect<\/strong>（还要加 @Component 交给 Spring 管理） |\n| 打开 @Aspect 注解支持 | <strong>@EnableAspectJAutoProxy<\/strong>（Boot 自动打开） |\n| 多个切面谁先执行 | <strong>@Order<\/strong>，<strong>数字越小越先执行<\/strong> |\n\n<strong>切点表达式<\/strong>（写「加在哪些方法上」）常见几种：\n- `execution(...)`：按方法签名匹配，<strong>最常用<\/strong>；\n- `within(...)`：某个包或类里的所有方法；\n- `@annotation(...)`：贴了某个注解的方法；\n- `bean(...)`：某个名字的 Bean。\n\n### 代理的两种方式（认关键词）\n\n| 方式 | 适用 |\n|---|---|\n| <strong>JDK 动态代理<\/strong> | 目标类<strong>实现了接口<\/strong> |\n| <strong>CGLIB<\/strong> | 没有接口，直接给<strong>类<\/strong>生成子类代理 |\n\n课程案例：用 AOP 给所有 Repository 方法打印<strong>执行耗时<\/strong>（第 37 讲）。"]}], "questions": [{"id": "aop-p1", "type": "single", "stem": "AOP 中，规定「把逻辑加在哪些方法上」的是？", "options": ["切点（Pointcut）", "通知（Advice）", "目标对象（Target）", "织入（Weaving）"], "answer": [0], "why": ["在哪 → 切点", "做什么 → 通知", "被加逻辑的对象", "加的过程"], "explain": "切点 = 在哪。", "tags": [], "lesson": 0, "m": "aop"}, {"id": "aop-p2", "type": "single", "stem": "方法执行前后都能做事，还能决定方法执不执行的通知是？", "options": ["@Around", "@Before", "@After", "@AfterReturning"], "answer": [0], "why": ["包住整个方法", "只在之前", "只在之后", "只在正常返回后"], "explain": "@Around。", "tags": [], "lesson": 1, "m": "aop"}, {"id": "aop-p3", "type": "single", "stem": "多个切面时，用什么控制执行顺序？", "options": ["@Order", "@Primary", "@Aspect", "@Bean"], "answer": [0], "why": ["数字越小越先执行", "那是指定主 Bean", "标记切面", "造 Bean"], "explain": "@Order。", "tags": [], "lesson": 1, "m": "aop"}, {"id": "aop-1", "type": "single", "stem": "AOP 适合处理哪类逻辑？", "options": ["日志、耗时统计、事务等横切逻辑", "页面布局", "数据库表设计", "前端样式"], "answer": [0], "why": ["对", "无关", "无关", "无关"], "explain": "横切逻辑。", "tags": ["basic"], "m": "aop"}, {"id": "aop-2", "type": "single", "stem": "AOP 中，「要加的那段逻辑本身」叫？", "options": ["通知（Advice）", "切点（Pointcut）", "连接点（Join Point）", "代理（Proxy）"], "answer": [0], "why": ["做什么 → 通知", "在哪", "可选的点", "生成的对象"], "explain": "通知 = 做什么。", "tags": ["basic"], "m": "aop"}, {"id": "aop-3", "type": "single", "stem": "切面（Aspect）由什么组成？", "options": ["通知 + 切点", "目标对象 + 代理", "连接点 + 织入", "Bean + 注解"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "切面 = 通知 + 切点。", "tags": ["basic"], "m": "aop"} "explain": "@Aspect + @Component。", "tags": ["basic"], "m": "aop"}, {"id": "aop-12", "type": "single", "stem": "打开 @Aspect 注解支持的注解是？", "options": ["@EnableAspectJAutoProxy", "@EnableCaching", "@EnableTransactionManagement", "@EnableAutoConfiguration"], "answer": [0], "why": ["对（Boot 自动打开）", "缓存", "事务", "Boot 自动配置"], "explain": "Enable + AspectJ + AutoProxy。", "tags": ["basic"], "m": "aop"}, {"id": "aop-13", "type": "single", "stem": "最常用的、按方法签名匹配的切点表达式是？", "options": ["execution(...)", "within(...)", "bean(...)", "@annotation(...)"], "answer": [0], "why": ["对", "按包或类", "按 Bean 名", "按注解"], "explain": "execution。", "tags": ["basic"], "m": "aop"}, {"id": "aop-14", "type": "single", "stem": "【进阶，可跳过】目标类实现了接口时，可以用哪种方式生成代理？", "options": ["JDK 动态代理", "CGLIB", "两者都可以", "都不行"], "answer": [2], "why": ["可以", "CGLIB 也可以", "有接口两种都行；没接口只能 CGLIB", "可以"], "explain": "没有接口只能用 CGLIB。", "tags": ["进阶"], "m": "aop"}, {"id": "aop-15", "type": "single", "stem": "目标类<strong>没有实现接口<\/strong>时，Spring 用什么生成代理？", "options": ["CGLIB", "JDK 动态代理", "不能代理", "数据库触发器"], "answer": [0], "why": ["生成子类", "JDK 代理需要接口", "可以", "无关"], "explain": "没接口 → CGLIB。", "tags": ["basic"], "m": "aop"}, {"id": "aop-16", "type": "single", "stem": "@Order 的数字和执行顺序的关系是？", "options": ["数字越小越先执行", "数字越大越先执行", "无关", "只能是 0 或 1"], "answer": [0], "why": ["对", "反了", "有关", "不是"], "explain": "越小越优先。", "tags": ["basic"], "m": "aop"}, {"id": "aop-17", "type": "single", "stem": "判断：声明式事务 @Transactional 是基于 AOP 实现的", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "事务模块讲过。", "tags": ["basic"], "m": "aop"}]}, {"id": "mvc", "title": "Spring MVC：请求怎么被处理", "short": "Spring MVC", "group": "第六章 Spring MVC 实践", "exam": "第 39—45、49—52 讲", "refs": [{"label": "Spring 5.3 文档 · Web MVC", "url": "https://docs.spring.io/spring-framework/docs/5.3.x/reference/html/web.html#mvc"}], "lessons": [{"title": "DispatcherServlet 和 Controller", "cards": ["### 一句话\n\n<strong>Spring MVC 是 Spring 处理网页请求的框架。所有请求先到一个总入口 DispatcherServlet，再由它分派给对应的 Controller。<\/strong>\n\nDispatcherServlet 就像前台：自己不干活，负责把请求转给合适的人。\n\n### 前台身边的几个帮手（认名字）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 根据网址找到该由哪个方法处理 | <strong>HandlerMapping<\/strong>（映射） |\n| 真正去调用那个处理方法 | <strong>HandlerAdapter<\/strong>（适配器） |\n| 处理过程中出了异常，负责处理异常 | <strong>HandlerExceptionResolver<\/strong> |\n| 把视图名字解析成真正的页面 | <strong>ViewResolver<\/strong>（视图解析器） |\n| 处理文件上传 | <strong>MultipartResolver<\/strong> |\n| 处理语言、地区 | LocaleResolver |", "### Controller 常用注解（必背）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 处理请求的类 | <strong>@Controller<\/strong> |\n| 处理请求并<strong>直接返回数据<\/strong>（如 JSON） | <strong>@RestController<\/strong> = @Controller + @ResponseBody |\n| 把网址映射到方法 | <strong>@RequestMapping<\/strong> |\n| 只处理 GET / POST / PUT / DELETE 请求 | <strong>@GetMapping / @PostMapping / @PutMapping / @DeleteMapping<\/strong> |\n| 方法返回值直接当响应内容 | <strong>@ResponseBody<\/strong> |\n| 把请求体（如 JSON）转成对象 | <strong>@RequestBody<\/strong> |\n| 取网址路径里的变量，如 /coffee/<strong>{id}<\/strong> | <strong>@PathVariable<\/strong> |\n| 取网址问号后的参数，如 ?name=latte | <strong>@RequestParam<\/strong> |\n| 取请求头 | <strong>@RequestHeader<\/strong> |\n| 指定返回的 HTTP 状态码 | <strong>@ResponseStatus<\/strong> |\n\n@RequestMapping 还可以按 <strong>请求方法、参数、请求头、consumes（接收什么格式）、produces（返回什么格式）<\/strong> 来限定。"]}, {"title": "应用上下文和请求处理流程", "cards": ["### 父子上下文（第 40 讲）\n\nWeb 程序里可能有两层「容器」：\n\n- <strong>父上下文（根上下文）<\/strong>：放 Service、Repository 等；\n- <strong>子上下文（DispatcherServlet 的）<\/strong>：放 Controller 等 Web 相关的。\n\n规则：<strong>子能看到父里的 Bean，父看不到子的。<\/strong>\n\n> ⚠️ 切面（AOP）只对<strong>同一个上下文<\/strong>里的 Bean 生效。切面放错了上下文，就会「不起作用」。\n\n### 一个请求的处理顺序（第 41 讲）\n\n1. 请求到达 <strong>DispatcherServlet<\/strong>；\n2. 通过 <strong>HandlerMapping<\/strong> 找到处理方法（连同拦截器）；\n3. 找到能调用它的 <strong>HandlerAdapter<\/strong>；\n4. 执行拦截器的 <strong>preHandle<\/strong>；\n5. 调用 Controller 方法；\n6. 执行拦截器的 <strong>postHandle<\/strong>；\n7. 处理返回值：解析视图并渲染，或者处理异常；\n8. 执行拦截器的 <strong>afterCompletion<\/strong>。\n\n> 📌 记顺序：<strong>前台 → 找人（Mapping）→ 找调用方式（Adapter）→ 干活 → 出结果（视图 / 异常）。<\/strong>"]}, {"title": "参数转换、校验、视图和异常", "cards": ["### 参数处理（第 43 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 把字符串参数转换成别的类型 | <strong>Converter<\/strong>（转换器）/ <strong>Formatter<\/strong>（格式化器） |\n| 校验参数（如不能为空） | <strong>@Valid<\/strong> + 校验注解（@NotNull、@NotEmpty、@Min……） |\n| 拿到校验结果（哪里不合格） | <strong>BindingResult<\/strong> |\n| 接收上传的文件 | <strong>MultipartFile<\/strong> |\n\nSpring Boot 会<strong>自动注册<\/strong>你写好的 Converter、Formatter Bean。\n\n### 视图与返回值（第 44、45 讲）\n\n- 返回<strong>页面<\/strong>：返回一个视图名，<strong>ViewResolver<\/strong> 把名字解析成 <strong>View<\/strong>，再渲染出页面；\n- 返回<strong>数据<\/strong>（@ResponseBody）：由 <strong>HttpMessageConverter<\/strong>（消息转换器）把对象转成 JSON / XML；\n- 根据请求想要的格式选择返回格式，叫<strong>内容协商<\/strong>；\n- 视图名前加 <strong>redirect:<\/strong> 是重定向，加 <strong>forward:<\/strong> 是转发。\n\n> 📌 认准：<strong>返回页面靠 ViewResolver；返回 JSON 靠 HttpMessageConverter。<\/strong>", "### 异常处理（第 49 讲）\n\nDispatcherServlet 把异常交给 <strong>HandlerExceptionResolver<\/strong> 处理。写法：\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 在 Controller 里写一个处理异常的方法 | <strong>@ExceptionHandler<\/strong> |\n| <strong>集中<\/strong>处理所有 Controller 的异常 | <strong>@ControllerAdvice<\/strong>（返回数据用 <strong>@RestControllerAdvice<\/strong>） |\n\n### 拦截器（第 50 讲）\n\n<strong>HandlerInterceptor<\/strong> 在请求处理的三个时机插入逻辑：\n\n| 方法 | 时机 |\n|---|---|\n| <strong>preHandle<\/strong> | 处理<strong>之前<\/strong>（返回 false 就不往下走了） |\n| <strong>postHandle<\/strong> | 处理<strong>之后<\/strong>、渲染视图之前 |\n| <strong>afterCompletion<\/strong> | <strong>整个请求完成<\/strong>之后（包括渲染完） |\n\n注册拦截器：实现 <strong>WebMvcConfigurer<\/strong> 的 <strong>addInterceptors<\/strong> 方法。异步请求用 AsyncHandlerInterceptor。\n\n### 课程答疑（第 52 讲）\n\n从 H2 内存数据库换到 MySQL：改依赖和连接配置；<strong>生产环境慎用自动建表<\/strong>（ddl-auto）。"]}], "questions": [{"id": "mvc-p1", "type": "single", "stem": "Spring MVC 中所有请求的总入口是？", "options": ["DispatcherServlet", "HandlerMapping", "ViewResolver", "Controller"], "answer": [0], "why": ["前台", "找处理方法", "解析视图", "具体干活的"], "explain": "总入口 DispatcherServlet tes/<\/strong> |\n| 模板文件默认后缀 | <strong>.html<\/strong> |\n| 开发时改了模板马上看到效果，关闭 | <strong>模板缓存<\/strong>（spring.thymeleaf.cache=false） |\n\nController 返回模板的<strong>名字<\/strong>，Thymeleaf 找到对应的 HTML 文件，填入数据后返回。"]}, {"title": "静态资源与缓存", "cards": ["### 静态资源（第 48 讲）\n\n图片、CSS、JS 这类不变的文件叫<strong>静态资源<\/strong>。\n\nSpring Boot 默认从这几个目录找静态资源：\n<strong>classpath:/static/、/public/、/resources/、/META-INF/resources/<\/strong>\n\n| 配置 | 作用 |\n|---|---|\n| spring.mvc.static-path-pattern | 静态资源的访问路径（默认 `/**`） |\n| spring.resources.static-locations | 静态资源放在哪些目录 |\n| spring.resources.cache.cachecontrol.max-age | 让浏览器缓存多久 |\n\n### HTTP 缓存\n\n通过响应头 <strong>Cache-Control<\/strong> 告诉浏览器缓存多久，下次不用重新下载。\n\n### 课程建议\n\n实际部署时，静态资源最好交给<strong>专门的设施<\/strong>，比如 <strong>CDN<\/strong> 或 <strong>Nginx<\/strong>，不要都让 Java 程序来提供。"]}], "questions": [{"id": "view-p1", "type": "single", "stem": "Spring Boot 默认用哪个库处理 JSON？", "options": ["Jackson", "Gson", "Thymeleaf", "Lombok"], "answer": [0], "why": ["对", "另一个 JSON 库，不是默认", "模板引擎", "少写代码的工具"], "explain": "Jackson。", "tags": [], "lesson": 0, "m": "view"}, {"id": "view-p2", "type": "multi", "stem": "Spring Boot 默认的静态资源目录包括？", "options": ["classpath:/static/", "classpath:/public/", "classpath:/templates/", "classpath:/resources/"], "answer": [0, 1, 3], "why": ["是", "是", "那是 Thymeleaf 模板目录", "是"], "explain": "templates 放模板，不放静态资源。", "tags": [], "lesson": 1, "m": "view"}, {"id": "view-1", "type": "single", "stem": "让 Spring MVC 返回 XML，需要加的依赖是？", "options": ["jackson-dataformat-xml", "spring-boot-starter-thymeleaf", "lombok", "druid"], "answer": [0], "why": ["对", "模板", "无关", "连接池"], "explain": "jackson-dataformat-xml。", "tags": ["basic"], "m": "view"}, {"id": "view-2", "type": "single", "stem": "自定义某个类型的 JSON 序列化方式，可以用？", "options": ["@JsonComponent", "@Component", "@RestController", "@Entity"], "answer": [0], "why": ["对", "通用的", "Web", "JPA"], "explain": "@JsonComponent。", "tags": ["basic"], "m": "view"}, {"id": "view-3", "type": "single", "stem": "Thymeleaf 是什么？", "options": ["服务端页面模板引擎", "JSON 库", "连接池", "数据库"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "把数据填进 HTML。", "tags": ["basic"], "m": "view"}, {"id": "view-4", "type": "single", "stem": "Thymeleaf 模板文件默认放在？", "options": ["classpath:/templates/", "classpath:/static/", "classpath:/public/", "WEB-INF/"], "answer": [0], "why": ["对", "静态资源", "静态资源", "不是默认"], "explain": "templates。", "tags": ["basic"], "m": "view"}, {"id": "view-5", "type": "single", "stem": "开发时修改 Thymeleaf 模板后想立即生效，应该？", "options": ["关闭模板缓存", "打开模板缓存", "重装 JDK", "删除静态资源"], "answer": [0], "why": ["spring.thymeleaf.cache=false", "反了", "无关", "无关"], "explain": "开发时关缓存。", "tags": ["basic"], "m": "view"}, {"id": "view-6", "type": "single", "stem": "告诉浏览器资源可以缓存多久的 HTTP 响应头是？", "options": ["Cache-Control", "Content-Type", "Accept", "Host"], "answer": [0], "why": ["对", "内容类型", "客户端想要的格式", "主机"], "explain": "Cache-Control。", "tags": ["basic"], "m": "view"}, {"id": "view-7", "type": "single", "stem": "课程建议，生产环境中的静态资源最好由谁提供？", "options": ["CDN 或 Nginx 等专门设施", "Java 程序", "数据库", "Redis"], "answer": [0], "why": ["对", "不推荐", "不合适", "不合适"], "explain": "第 48 讲。", "tags": ["basic"], "m": "view"}, {"id": "view-8", "type": "single", "stem": "Thymeleaf 的起步依赖是？", "options": ["spring-boot-starter-thymeleaf", "spring-boot-starter-web", "thymeleaf-spring-boot-starter", "spring-boot-starter-json"], "answer": [0], "why": ["官方起步依赖：spring-boot-starter-xxx", "Web", "命名不对", "JSON"], "explain": "官方的以 spring-boot-starter 开头。", "tags": ["basic"], "m": "view"}, {"id": "view-9", "type": "single", "stem": "设置静态资源<strong>访问路径<\/strong>的配置是？", "options": ["spring.mvc.static-path-pattern", "spring.resources.static-locations", "server.port", "spring.thymeleaf.cache"], "answer": [0], "why": ["path pattern = 路径模式", "存放目录", "端口", "模板缓存"], "explain": "path-pattern 访问路径，locations 存放目录。", "tags": ["basic"], "m": "view"}, {"id": "view-10", "type": "single", "stem": "判断：Thymeleaf 中 Controller 返回的是模板的名字，而不是 JSON 数据", "options": ["正 | | RestTemplate | WebClient |\n|---|---|---|\n| 方式 | 同步、阻塞 | <strong>异步、非阻塞<\/strong> |\n| 返回 | 普通对象 | <strong>Mono / Flux<\/strong> |\n| 底层（默认） | JDK HttpURLConnection | <strong>Reactor Netty<\/strong> |\n\n写法认关键词：`WebClient.create()` 或 `WebClient.builder()` 创建 → `.get().uri(...)` → **`.retrieve()`<strong> 取响应 → <\/strong>`bodyToMono()` / `bodyToFlux()`** 转成结果。\n\n### SpringBucks 进度（第 57 讲）\n\n新增 <strong>Customer Service（顾客服务）<\/strong>，用 HTTP 客户端去调用 Waiter Service：<strong>获取菜单、创建订单<\/strong>。\n\n> 📌 认准：<strong>RestTemplate 同步阻塞；WebClient 非阻塞、返回 Mono / Flux。<\/strong>"]}], "questions": [{"id": "client-p1", "type": "single", "stem": "Spring Boot 中创建 RestTemplate 推荐用？", "options": ["RestTemplateBuilder", "new 一个 DataSource", "WebClient", "JdbcTemplate"], "answer": [0], "why": ["Boot 不自动建 RestTemplate，但提供 Builder", "无关", "另一个客户端", "无关"], "explain": "RestTemplateBuilder。", "tags": [], "lesson": 0, "m": "client"}, {"id": "client-p2", "type": "single", "stem": "非阻塞、返回 Mono / Flux 的 HTTP 客户端是？", "options": ["WebClient", "RestTemplate", "JdbcTemplate", "Feign"], "answer": [0], "why": ["对", "同步阻塞", "数据库", "声明式客户端（后面讲）"], "explain": "WebClient。", "tags": [], "lesson": 1, "m": "client"}, {"id": "client-1", "type": "single", "stem": "RestTemplate 发 GET 请求并<strong>直接拿到对象<\/strong>，用？", "options": ["getForObject()", "getForEntity()", "exchange()", "postForObject()"], "answer": [0], "why": ["只要内容", "完整响应", "最灵活", "POST"], "explain": "ForObject 只要内容。", "tags": ["basic"], "m": "client"}, {"id": "client-2", "type": "single", "stem": "RestTemplate 发 GET 请求，需要拿到<strong>状态码和响应头<\/strong>，用？", "options": ["getForEntity()", "getForObject()", "put()", "delete()"], "answer": [0], "why": ["返回 ResponseEntity", "只有内容", "PUT", "DELETE"], "explain": "ForEntity 要完整响应。", "tags": ["basic"], "m": "client"}, {"id": "client-3", "type": "single", "stem": "RestTemplate 中最灵活、可自定义请求方法和请求头的方法是？", "options": ["exchange()", "getForObject()", "postForEntity()", "put()"], "answer": [0], "why": ["对", "只能 GET", "只能 POST", "只能 PUT"], "explain": "exchange。", "tags": ["basic"], "m": "client"}, {"id": "client-4", "type": "single", "stem": "包含状态码、响应头和内容的完整响应对象是？", "options": ["ResponseEntity", "RequestEntity", "Mono", "RowMapper"], "answer": [0], "why": ["响应", "请求", "响应式类型", "JDBC"], "explain": "Request 请求，Response 响应。", "tags": ["basic"], "m": "client"}, {"id": "client-5", "type": "single", "stem": "返回值是 `List<Coffee>` 这种泛型类型时，RestTemplate 需要借助？", "options": ["ParameterizedTypeReference", "UriComponentsBuilder", "RequestEntity", "RowMapper"], "answer": [0], "why": ["对", "拼网址", "构造请求", "JDBC"], "explain": "ParameterizedTypeReference。", "tags": ["basic"], "m": "client"}, {"id": "client-6", "type": "single", "stem": "拼接请求网址，可以用？", "options": ["UriComponentsBuilder", "RestTemplateBuilder", "WebClient", "ResponseEntity"], "answer": [0], "why": ["Uri = 网址", "创建 RestTemplate", "另一个客户端", "响应"], "explain": "UriComponentsBuilder。", "tags": ["basic"], "m": "client"}, {"id": "client-7", "type": "single", "stem": "让 RestTemplate 底层使用 Apache HttpClient，用哪个工厂类？", "options": ["HttpComponentsClientHttpRequestFactory", "SimpleClientHttpRequestFactory", "OkHttp3ClientHttpRequestFactory", "ConnectionFactory"], "answer": [0], "why": ["HttpComponents 是 Apache HttpClient 的项目名", "JDK 默认", "OkHttp", "R2DBC"], "explain": "认 HttpComponents。", "tags": ["basic"], "m": "client"}, {"id": "client-8", "type": "multi", "stem": "定制 RestTemplate 时，通常要设置哪些？", "options": ["连接池", "连接超时", "读取超时", "数据库隔离级别"], "answer": [0, 1, 2], "why": ["要", "要", "要", "无关"], "explain": "超时一定要设。", "tags": ["basic"], "m": "client"}, {"id": "client-9", "type": "single", "stem": "调用的下游服务很慢、又没设超时，会出现什么问题？", "options": ["调用方的线程被大量占住", "下游自动变快", "数据库自动回滚", "没有影响"], "answer": [0], "why": ["对", "不会", "无关", "有影响"], "explain": "第 55 讲。", "tags": ["basic"], "m": "client"}, {"id": "client-10", "type": "single", "stem": "WebClient 中把响应体转成 Mono 的方法是？", "options": ["bodyToMono()", "getForObject()", "subscribe()", "block()"], "answer": [0], "why": ["对", "RestTemplate 的", "订阅", "阻塞等待"], "explain": "bodyToMono / bodyToFlux。", "tags": ["basic"], "m": "client"}, {"id": "client-11", "type": "single", "stem": "WebClient 默认的底层是？", "options": ["Reactor Netty", "JDK HttpURLConnection", "Apache HttpClient", "Tomcat"], "answer": [0], "why": ["对", "RestTemplate 默认", "可选", "服务器"], "explain": "Reactor Netty。", "tags": ["basic"], "m": "client"}, {"id": "client-12", "type": "single", "stem": "判断：Spring Boot 会自动创建一个 RestTemplate Bean", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：只提供 RestTemplateBuilder"], "explain": "需要自己用 Builder 建。", "tags": ["basic"], "m": "client"}, {"id": "client-13", "type": "single", "stem": "判断：RestTemplate 是同步阻塞的", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "发出请求后等结果回来。", "tags": ["basic"], "m": "client"}, {"id": "client-14", "type": "multi", "stem": "SpringBucks 中新增的 Customer Service 用 HTTP 客户端做了什么？", "options": ["获取菜单", "创建订单", "直接改数据库", "发送邮件"], "answer": [0, 1], "why": ["对", "对", "不是", "不是"], "explain": "第 57 讲。", "tags": ["basic"], "m": "client"}]}, {"id": "rest", "title": "Web 进阶：REST、HATEOAS、分布式 Session、WebFlux", "short": "REST 与 WebFlux", "group": "第八章 Web 开发进阶", "exam": "第 58—66 讲", "refs": [{"label": "Richardson 成熟度模型（Martin Fowler）", "url": "https://martinfowler.com/articles/richardsonMaturityModel.html"}], "lessons": [{"title": "RESTful：成熟度模型、方法、状态码", "cards": ["### 一句话\n\n<strong>REST 是一种设计网络接口的风格：把东西看成「资源」，用网址表示资源，用 HTTP 方法表示操作。<\/strong>\n\n### Richardson 成熟度模型：四个等级（必背）\n\n| 等级 | 名字 | 一句话 |\n|---|---|---|\n| Level 0 | POX（普通 XML / RPC） | 一个网址干所有事 |\n| Level 1 | <strong>资源<\/strong> | 不同资源用不同网址 |\n| Level 2 | <strong>HTTP 方法<\/strong> | 用 GET / POST / PUT / DELETE 表示不同操作 |\n| Level 3 | <strong>超媒体控制（HATEOAS）<\/strong> | 响应里带上「接下来能做什么」的链接 |\n\n### 网址设计\n\n- 用<strong>名词<\/strong>表示资源，不用动词：`/coffee` 而不是 `/getCoffee`；\n- 资源一般用<strong>复数<\/strong>，有层级：`/customers/1/orders`。", "### HTTP 方法：安全和幂等（必背）\n\n- <strong>安全<\/strong>：不会修改数据（只读）；\n- <strong>幂等<\/strong>：做一次和做多次，<strong>结果一样<\/strong>。\n\n| 方法 | 用途 | 安全 | 幂等 |\n|---|---|---|---|\n| <strong>GET<\/strong> | 查询 | 是 | 是 |\n| <strong>POST<\/strong> | 新建 | 否 | <strong>否<\/strong> |\n| <strong>PUT<\/strong> | 整体更新（替换） | 否 | 是 |\n| <strong>DELETE<\/strong> | 删除 | 否 | 是 |\n| PATCH | 部分更新 | 否 | 否 |\n| HEAD / OPTIONS | 只要响应头 / 问支持哪些方法 | 是 | 是 |\n\n> 📌 记法：<strong>只有 GET（和 HEAD、OPTIONS）是安全的；POST 和 PATCH 不幂等，其他都幂等。<\/strong>\n\n### 常用状态码\n\n| 状态码 | 意思 |\n|---|---|\n| <strong>200<\/strong> OK | 成功 |\n| <strong>201<\/strong> Created | 新建成功 |\n| 204 No Content | 成功，但没有返回内容 |\n| 304 Not Modified | 内容没变，用缓存 |\n| <strong>400<\/strong> Bad Request | 请求有错 |\n| <strong>401<\/strong> Unauthorized | <strong>没登录<\/strong>（没认证） |\n| <strong>403<\/strong> Forbidden | 登录了但<strong>没权限<\/strong> |\n| <strong>404<\/strong> Not Found | 找不到 |\n| 405 Method Not Allowed | 不支持这个请求方法 |\n| <strong>500<\/strong> Internal Server Error | 服务器内部出错 |\n\n> 💡 2 开头成功，3 开头重定向/缓存，<strong>4 开头是客户端的错，5 开头是服务器的错<\/strong>。"]}, {"title": "HATEOAS 和 Spring Data REST", "cards": ["### HATEOAS（第 60 讲）\n\n<strong>HATEOAS = 服务端在返回的数据里附上链接，告诉客户端「接下来可以做什么」<\/strong>，客户端顺着链接走就行，不用提前写死网址。它是成熟度模型的<strong>最高级（Level 3）<\/strong>。\n\n### HAL：表示链接的一种格式\n\nHAL（Hypertext Application Language）用两个特殊字段：\n- <strong>_links<\/strong>：链接；\n- <strong>_embedded<\/strong>：嵌入的其他资源。\n\n### Spring Data REST（第 61、62 讲）\n\n<strong>把 Repository 直接暴露成 REST 接口，不用自己写 Controller。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 起步依赖 | <strong>spring-boot-starter-data-rest<\/strong> |\n| 自定义暴露的路径 | <strong>@RepositoryRestResource<\/strong> |\n| 返回格式 | 默认 <strong>HAL<\/strong> |\n| 自定义查询方法会出现在 | <strong>/search<\/strong> 路径下 |\n\n客户端（第 62 讲）配置好 HAL 解析，就可以读取响应里的链接，顺着链接访问、修改资源。"]}, {"title": "分布式 Session 和 WebFlux", "cards": ["### 分布式环境的 Session 问题（第 63 讲）\n\nSession 用来记住「用户是谁」（如登录状态）。程序部署在<strong>多台机器<\/strong>上时，用户这次访问 A、下次访问 B，B 不认识他。三种解决办法：\n\n| 方案 | 一句话 |\n|---|---|\n| <strong>粘性会话<\/strong>（Sticky Session） | 让同一个用户<strong>总是访问同一台<\/strong>机器 |\n| <strong>会话复制<\/strong>（Session Replication） | 各台机器之间<strong>互相复制<\/strong> Session |\n| <strong>集中存储<\/strong>（Session 集中化） | Session 统一存到 <strong>Redis<\/strong> 等外部存储，大家都去那里读 |\n\n<strong>Spring Session<\/strong> 就是用来做集中存储的：支持 <strong>Redis<\/strong>、JDBC、Hazelcast 等；用 Redis 时开启注解 <strong>@EnableRedisHttpSession<\/strong>。\n\n### WebFlux：用响应式代替 Spring MVC（第 64—66 讲）\n\n| | Spring MVC | <strong>WebFlux<\/strong> |\n|---|---|---|\n| 模型 | 阻塞，一个请求占一个线程 | <strong>非阻塞<\/strong>，基于 Reactor（Mono / Flux） |\n| 默认服务器 | Tomcat | <strong>Netty<\/strong> |\n| 优点 | 简单、生态成熟 | <strong>用很少的线程扛更多并发<\/strong> |\n\n- WebFlux <strong>不一定让单个请求更快<\/strong>，好处是同样资源下能处理更多请求；\n- 整条链路都要是非阻塞的才有意义（数据库要用 R2DBC 等）；\n- 写法可以和 MVC 一样用 @RestController 注解，也可以用<strong>函数式<\/strong>的 RouterFunction。"]}], "questions": [{"id": "rest-p1", "type": "single", "stem": "Richardson 成熟度模型中，引入 HTTP 方法（GET、POST 等）表示操作的是第几级？", "options": ["Level 0", "Level 1", "Level 2", "Level 3"], "answer": [2], "why": ["一个网址干所有事", "资源", "HTTP 方法", "超媒体"], "explain": "0 RPC → 1 资源 → 2 方法 → 3 超媒体。", "tags": [], "lesson": 0, "m": "rest"}, {"id": "rest-p2", "type": "single", "stem": "下列 HTTP 方法中<strong>不是幂等<\/strong>的是？", "options": ["POST", "GET", "PUT", "DELETE"], "answer": [0], "why": ["新建，做两次会新建两个", "幂等", "幂等", "幂等"], "explain": "POST、PATCH 不幂等。", "tags": [], "lesson": 0, "m": "rest"}, {"id": "rest-p3", "type": "single", "stem": "把 Repository 直接暴露为 REST 接口的是？", "options": ["Spring Data REST", "Spring Session", "WebFlux", "RestTemplate"], "answer": [0], "why": ["对", "会话共享", "响应式 Web", "HTTP 客户端"], "explain": "Spring Data REST。", "tags": [], "lesson": 1, "m": "rest"}, {"id": "rest-p4", "type": "single", "stem": "把 Session 统一存到 Redis 中，用？", "options": ["Spring Session", "Spring Data REST", "Spring Cache", "Spring Cloud Stream"], "answer": [0], "why": ["对", "暴露 Repository", "缓存", "消息"], "explain": "Spring Session。", "tags": [], "lesson": 2, "m": "rest"}, {"id": "rest-1", "type": "single", "stem": "Richardson 成熟度模型的最高级（Level 3）是？", "options": ["超媒体控制（HATEOAS）", "资源", "HTTP 方法", "POX"], "answer": [0], "why": ["对", "Level 1", "Level 2", "Level 0"], "explain": "Level 3 = HATEOAS。", "tags": ["basic"], "m": "rest"}, {"id": "rest-2", "type": "single", "stem": "RESTful 网址设计，下列更合适的是？", "options": ["/coffee", "/getCoffee", "/deleteCoffeeById", "/doQuery"], "answer": [0], "why": ["名词", "网址里不放动词", "网址里不放动词", "网址里不放动词"], "explain": "用名词，操作交给 HTTP 方法。", "tags": ["basic"], "m": "rest"}, {"id": "rest-3", "type": "multi", "stem": "下列 HTTP 方法中，属于<strong>安全<\/strong>方法（不修改数据）的是？", "options": ["GET", "HEAD", "POST", "DELETE"], "answer": [0, 1], "why": ["只读", "只要响应头", "会新建", "会删除"], "explain": "还有 OPTIONS。", "tags": ["basic"], "m": "rest"}, {"id": "rest-4", "type": "multi", "stem": "下列哪些 HTTP 方法是<strong>幂等<\/strong>的？", "options": ["GET", "PUT", "DELETE", "POST"], "answer": [0, 1, 2], "why": ["是", "是", "是", "不是"], "explain": "POST、PATCH 不幂等。", "tags": ["basic"], "m": "rest"}, {"id": "rest-5", "type": "single", "stem": "新建资源成功，通常返回状态码？", "options": ["201", "200", "204", "404"], "answer": [0], "why": ["Created", "一般成功", "无内容", "找不到"], "explain": "201 Created。", "tags": ["basic"], "m": "rest"}, {"id": "rest-6", "type": "single", "stem": "用户<strong>没有登录<\/strong>（未认证），返回状态码？", "options": ["401", "403", "404", "500"], "answer": [0], "why": ["Unauthorized", "登录了但没权限", "找不到", "服务器错误"], "explain": "401 没登录，403 没权限。", "tags": ["basic"], "m": "rest"}, {"id": "rest-7", "type": "single", "stem": "用户登录了，但<strong>没有权限<\/strong>访问，返回状态码？", "options": ["403", "401", "400", "405"], "answer": [0], "why": ["Forbidden", "没登录", "请求有错", "方法不支持"], "explain": "403。", "tags": ["basic"], "m": "rest"}, {"id": "rest-8", "type": "single", "stem": "服务器内部出错，返回状态码？", "options": ["500", "400", "404", "304"], "answer": [0], "why": ["5 开头是服务器错", "4 开头是客户端错", "找不到", "没变化"], "explain": "500。", "tags": ["basic"], "m": "rest"}, {"id": "rest-9", "type": "single", "stem": "状态码 4 开头表示？", "options": ["客户端的错误", "服务器的错误", "成功", "重定向"], "answer": [0], "why": ["对
