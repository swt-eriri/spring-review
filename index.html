st-17", "type": "single", "stem": "WebFlux 默认使用的服务器是？", "options": ["Netty", "Tomcat", "Jetty", "Nginx"], "answer": [0], "why": ["对", "MVC 默认", "另一种容器", "反向代理"], "explain": "WebFlux → Netty。", "tags": ["basic"], "m": "rest"}, {"id": "rest-18", "type": "single", "stem": "关于 WebFlux，下列说法正确的是？", "options": ["基于非阻塞和响应式流", "一定让每个请求都更快", "必须配合阻塞的 JDBC 使用", "不能使用 @RestController"], "answer": [0], "why": ["对", "不一定，好处是并发", "应该全链路非阻塞", "可以使用"], "explain": "WebFlux：非阻塞、少线程扛高并发。", "tags": ["basic"], "m": "rest"}, {"id": "rest-19", "type": "single", "stem": "WebFlux 除了注解方式，还支持哪种写法？", "options": ["函数式路由（RouterFunction）", "XML 配置路由", "SQL 路由", "只支持注解"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "RouterFunction。", "tags": ["basic"], "m": "rest"}, {"id": "rest-20", "type": "single", "stem": "判断：使用 WebFlux 后，单个请求的处理速度一定比 Spring MVC 快", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：不一定，优势在于用更少线程处理更多并发"], "explain": "第 64 讲。", "tags": ["basic"], "m": "rest"}]}, {"id": "boot", "title": "Spring Boot 原理：自动配置、起步依赖、配置加载", "short": "Boot 原理", "group": "第九章 重新认识 Spring Boot", "exam": "第 67—74 讲", "refs": [{"label": "Spring Boot 2.1 文档 · 外部化配置", "url": "https://docs.spring.io/spring-boot/docs/2.1.x/reference/html/boot-features-external-config.html"}], "lessons": [{"title": "Spring Boot 由什么组成", "cards": ["### 一句话\n\n<strong>Spring Boot 帮你快速做出一个能独立运行的 Spring 程序。<\/strong>\n\n### 四个组成部分（必背，第 67 讲）\n\n| 组成 | 一句话 |\n|---|---|\n| <strong>自动配置<\/strong>（Auto Configuration） | 根据你引入了什么，<strong>自动<\/strong>帮你配好 Bean |\n| <strong>起步依赖<\/strong>（Starter） | 把一个功能需要的依赖<strong>打包成一个<\/strong>，引一个就够 |\n| <strong>命令行工具<\/strong>（CLI） | 在命令行里快速运行 Groovy 脚本（了解） |\n| <strong>Actuator<\/strong> | 监控和管理运行中的程序 |\n\n### Spring Boot <strong>不是<\/strong>什么（常考判断）\n\n- 不是应用服务器（它内嵌了服务器，但本身不是）；\n- 不是 Java EE 规范的实现；\n- 不是代码生成器；\n- 不是 Spring Framework 的替代品（它建立在 Spring Framework 之上）。"]}, {"title": "自动配置的原理", "cards": ["### 自动配置怎么找到要配什么（第 68 讲，认关键词）\n\n1. <strong>@EnableAutoConfiguration<\/strong>（包含在 @SpringBootApplication 里）开启自动配置；\n2. 它通过 <strong>AutoConfigurationImportSelector<\/strong>（导入选择器）去读取\n3. 各个 jar 包里的 <strong>META-INF/spring.factories<\/strong> 文件，找到所有候选的自动配置类；\n4. 每个配置类上有<strong>条件注解<\/strong>，条件满足才生效。\n\n> 📌 一句话：<strong>@EnableAutoConfiguration → 读 spring.factories → 按条件注解决定生不生效。<\/strong>\n\n### 条件注解：对号入座（必背）\n\n| 注解 | 什么时候生效 |\n|---|---|\n| <strong>@ConditionalOnClass<\/strong> | 类路径里<strong>有<\/strong>某个类 |\n| @ConditionalOnMissingClass | 类路径里<strong>没有<\/strong>某个类 |\n| @ConditionalOnBean | 容器里<strong>有<\/strong>某个 Bean |\n| <strong>@ConditionalOnMissingBean<\/strong> | 容器里<strong>没有<\/strong>某个 Bean（<strong>你自己配了，就用你的<\/strong>） |\n| <strong>@ConditionalOnProperty<\/strong> | 配置文件里有某个配置 / 等于某个值 |\n| @ConditionalOnWebApplication | 是 Web 程序 |\n| @ConditionalOnResource | 有某个资源文件 |", "### 自己写自动配置（第 69、70 讲）\n\n1. 写一个配置类，里面用 @Bean 造 Bean；\n2. 加上<strong>条件注解<\/strong>控制何时生效；\n3. 在 <strong>spring.factories<\/strong> 里登记它。\n\n- 控制顺序：<strong>@AutoConfigureBefore / @AutoConfigureAfter / @AutoConfigureOrder<\/strong>；\n- 允许用户覆盖：用 <strong>@ConditionalOnMissingBean<\/strong>，用户自己配了就不再配；\n- 查看哪些自动配置生效了：启动时加 <strong>--debug<\/strong>，会打印「条件评估报告」；\n- 不要某个自动配置：<strong>exclude<\/strong>。\n\n<strong>低版本 Spring（没有条件注解）怎么做<\/strong>：用 <strong>BeanFactoryPostProcessor<\/strong> 等扩展点，在启动时检查并注册 Bean（第 70 讲）。"]}, {"title": "起步依赖和配置加载", "cards": ["### 起步依赖（第 71、72 讲）\n\n<strong>Starter 把一个功能需要的依赖打包好<\/strong>，版本由 <strong>BOM<\/strong>（spring-boot-dependencies）统一管理。\n\n<strong>命名规则（常考）：<\/strong>\n\n| 谁做的 | 命名 | 例子 |\n|---|---|---|\n| <strong>官方<\/strong> | <strong>spring-boot-starter-xxx<\/strong> | spring-boot-starter-web |\n| <strong>第三方 / 自己<\/strong> | <strong>xxx-spring-boot-starter<\/strong> | mybatis-spring-boot-starter |\n\n自己做 Starter 时：\n- 通常拆成两个模块：<strong>autoconfigure 模块<\/strong>（放自动配置代码）+ <strong>starter 模块<\/strong>（只负责引入依赖）；\n- 配置前缀不要用 spring 开头，和官方区分开。\n\n依赖冲突时：用 <strong>mvn dependency:tree<\/strong> 看依赖树，用 <strong>exclusion<\/strong> 排除。", "### 配置加载的优先级（第 73 讲，记大方向）\n\n同一个配置在多个地方都写了，<strong>优先级高的覆盖低的<\/strong>。从高到低大致是：\n\n1. <strong>命令行参数<\/strong>（如 `--server.port=8081`）\n2. Java 系统属性（-D）\n3. <strong>操作系统环境变量<\/strong>\n4. jar 包<strong>外面<\/strong>的 application-{profile} 配置文件\n5. jar 包<strong>里面<\/strong>的 application-{profile} 配置文件\n6. jar 包<strong>外面<\/strong>的 application 配置文件\n7. jar 包<strong>里面<\/strong>的 application 配置文件\n8. @PropertySource 指定的文件\n9. 默认属性\n\n> 📌 记三条：<strong>命令行最高；带 profile 的高于不带的；jar 外高于 jar 内。<\/strong>\n\n- <strong>Profile<\/strong>：区分环境（如 dev、prod），用 <strong>spring.profiles.active<\/strong> 指定；\n- <strong>宽松绑定<\/strong>：`spring.jpa.database-platform`、`spring.jpa.databasePlatform`、环境变量 `SPRING_JPA_DATABASEPLATFORM` 都能对上，推荐用<strong>中划线<\/strong>写法。", "### PropertySource 抽象（第 74 讲）\n\n- 所有配置来源都被统一抽象成 <strong>PropertySource<\/strong>，汇总在 <strong>Environment<\/strong>（环境）里；\n- 把一组配置绑定到一个 Java 对象：<strong>@ConfigurationProperties(prefix = \"...\")<\/strong>；\n- 读取单个配置值：<strong>@Value(\"${...}\")<\/strong>；\n- 加一个自定义的配置来源：实现 <strong>EnvironmentPostProcessor<\/strong>，并在 spring.factories 里登记。\n\n> 📌 认准：<strong>一组配置 → @ConfigurationProperties；单个值 → @Value。<\/strong>"]}], "questions": [{"id": "boot-p1", "type": "multi", "stem": "Spring Boot 的组成部分包括？", "options": ["自动配置", "起步依赖", "Actuator", "应用服务器规范"], "answer": [0, 1, 2], "why": ["是", "是", "是", "Boot 不是应用服务器"], "explain": "还有命令行 CLI。", "tags": [], "lesson": 0, "m": "boot"}, {"id": "boot-p2", "type": "single", "stem": "自动配置的候选配置类登记在哪个文件里（课程所用版本）？", "options": ["META-INF/spring.factories", "application.properties", "pom.xml", "sql-error-codes.xml"], "answer": [0], "why": ["对", "应用配置", "Maven", "错误码"], "explain": "spring.factories。", "tags": [], "lesson": 1, "m": "boot"}, {"id": "boot-p3", "type": "single", "stem": "官方起步依赖的命名格式是？", "options": ["spring-boot-starter-xxx", "xxx-spring-boot-starter", "starter-xxx", "xxx-starter-spring"], "answer": [0], "why": ["官方", "第三方", "不对", "不对"], "explain": "官方前缀，第三方后缀。", "tags": [], "lesson": 2, "m": "boot"}, , "exam": "第 75—85 讲", "refs": [{"label": "Spring Boot 2.1 文档 · Actuator 端点", "url": "https://docs.spring.io/spring-boot/docs/2.1.x/reference/html/production-ready-endpoints.html"}], "lessons": [{"title": "Actuator 和健康检查", "cards": ["### 一句话\n\n<strong>Actuator = 给程序装上「仪表盘」，通过一些网址查看程序的运行状态。<\/strong>这些网址叫<strong>端点<\/strong>（Endpoint），默认都在 <strong>/actuator<\/strong> 下面。\n\n### 常用端点：对号入座\n\n| 端点 | 看什么 |\n|---|---|\n| <strong>health<\/strong> | 健康状态 |\n| info | 程序信息 |\n| <strong>beans<\/strong> | 容器里所有的 Bean |\n| <strong>conditions<\/strong> | 自动配置的条件评估结果 |\n| configprops | 所有 @ConfigurationProperties 配置 |\n| <strong>env<\/strong> | 环境变量和配置 |\n| <strong>mappings<\/strong> | 所有请求映射（网址 → 方法） |\n| <strong>metrics<\/strong> | 各种指标 |\n| loggers | 日志级别（还能在线修改） |\n| threaddump / heapdump | 线程信息 / 内存快照 |\n| <strong>shutdown<\/strong> | 关闭程序（<strong>默认关闭<\/strong>） |\n\n> ⚠️ Spring Boot 2 通过 HTTP <strong>默认只开放 health 和 info<\/strong>。想全开：`management.endpoints.web.exposure.include=*`。也可以通过 JMX 访问。生产环境要注意<strong>访问控制<\/strong>。", "### 健康检查（第 76 讲）\n\n- 自定义健康检查：实现 <strong>HealthIndicator<\/strong> 接口，返回 <strong>Health.up()<\/strong> 或 <strong>Health.down()<\/strong>；\n- 状态有四种：<strong>UP<\/strong>（正常）、<strong>DOWN<\/strong>（挂了）、<strong>OUT_OF_SERVICE<\/strong>（暂停服务）、<strong>UNKNOWN<\/strong>（未知）；\n- 内置的健康检查：数据库（DataSourceHealthIndicator）、磁盘空间（DiskSpaceHealthIndicator）、Redis 等；\n- 整体状态由所有检查<strong>聚合<\/strong>而来：只要有一个 DOWN，整体就是 DOWN；\n- 显示详细信息：`management.endpoint.health.show-details`，可选 <strong>never（默认）/ when-authorized / always<\/strong>。"]}, {"title": "指标、Spring Boot Admin、Web 容器", "cards": ["### Micrometer：指标采集（第 77 讲）\n\n<strong>Micrometer 是指标采集的「统一接口」，号称「监控界的 SLF4J」<\/strong>：写一套代码，就能把指标发到 Prometheus、Graphite、InfluxDB 等不同的监控系统。\n\n| 指标类型 | 一句话 |\n|---|---|\n| <strong>Counter<\/strong> | 计数器，只增不减（如订单总数） |\n| <strong>Timer<\/strong> | 计时器（如方法耗时） |\n| <strong>Gauge<\/strong> | 当前值，可增可减（如在线人数） |\n| DistributionSummary | 分布统计（如订单金额分布） |\n\n- 用<strong>标签（Tag）<\/strong>区分维度；\n- 自定义指标的入口：<strong>MeterRegistry<\/strong>；也可以实现 MeterBinder。\n\n### Spring Boot Admin（第 78 讲）\n\n<strong>一个可视化的管理界面，把多个程序的 Actuator 信息集中展示。<\/strong>（codecentric 公司开发，不是 Spring 官方的）\n\n- 服务端：<strong>@EnableAdminServer<\/strong>；\n- 客户端：配置 <strong>spring.boot.admin.client.url<\/strong> 指向服务端（或通过服务发现）；\n- 需要开放 Actuator 端点，并注意加上访问认证。", "### 定制 Web 容器（第 79 讲）\n\n| 配置 | 作用 |\n|---|---|\n| <strong>server.port<\/strong> | 端口 |\n| server.compression.enabled | 开启压缩 |\n| server.tomcat.max-threads | Tomcat 最大线程数 |\n| server.tomcat.max-connections | 最大连接数 |\n| server.error.include-stacktrace | 错误页是否显示堆栈（生产环境别显示） |\n| server.use-forward-headers | 在反向代理后面时，读取代理传来的头 |\n\n用代码定制：实现 <strong>WebServerFactoryCustomizer<\/strong>。\n\n### HTTPS 和 HTTP/2（第 80、81 讲）\n\n- 生成证书：JDK 自带的 <strong>keytool<\/strong>；\n- 配置 HTTPS：<strong>server.ssl.key-store<\/strong>（密钥库）、key-store-password、key-store-type（<strong>PKCS12<\/strong> 或 JKS）；\n- 开启 HTTP/2：<strong>server.http2.enabled=true<\/strong>；浏览器上的 HTTP/2 <strong>需要 HTTPS<\/strong>；支持与否和 JDK、容器版本有关；\n- 客户端可以用 <strong>OkHttp<\/strong> 访问 HTTP/2。"]}, {"title": "命令行程序、可执行 jar、Docker", "cards": ["### 命令行程序（第 82 讲）\n\n不需要网页服务器时：`spring.main.web-application-type=none`（可选 <strong>NONE / SERVLET / REACTIVE<\/strong>）。\n\n启动后执行一段任务：\n\n| 接口 | 参数 |\n|---|---|\n| <strong>CommandLineRunner<\/strong> | 原始的字符串数组参数 |\n| <strong>ApplicationRunner<\/strong> | 包装好的 <strong>ApplicationArguments<\/strong> |\n\n- 多个 Runner 的顺序：<strong>@Order<\/strong>；\n- 自定义退出码：<strong>ExitCodeGenerator<\/strong>。\n\n### 可执行 jar 的秘密（第 83 讲）\n\n<strong>spring-boot-maven-plugin<\/strong> 的 <strong>repackage<\/strong> 把程序重新打包成可执行 jar：\n\n| jar 里的东西 | 作用 |\n|---|---|\n| <strong>META-INF/MANIFEST.MF<\/strong> | 清单：<strong>Main-Class<\/strong> 是启动器 <strong>JarLauncher<\/strong>，<strong>Start-Class<\/strong> 是你自己的 main 类 |\n| org/springframework/boot/loader | 启动器代码 |\n| <strong>BOOT-INF/classes<\/strong> | 你自己的代码 |\n| <strong>BOOT-INF/lib<\/strong> | 依赖的 jar（嵌套在里面） |\n\n> 📌 认准：<strong>Main-Class = JarLauncher（启动器）；Start-Class = 你的程序入口。<\/strong>运行仍需要 Java 环境；配置 executable 后还能在 Linux 上直接 `./xxx.jar` 运行。\n\n### 打包成 Docker 镜像（第 84 讲）\n\n写 <strong>Dockerfile<\/strong>：<strong>FROM<\/strong>（基础镜像，如 openjdk）→ <strong>ADD / COPY<\/strong>（把 jar 放进去）→ <strong>ENTRYPOINT<\/strong>（启动命令 `java -jar`）。课程还演示了用 Maven 插件（dockerfile-maven-plugin）构建。"]}], "questions": [{"id": "ops-p1", "type": "single", "stem": "Actuator 端点默认的访问前缀是？", "options": ["/actuator", "/admin", "/manage", "/monitor"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "/actuator/health 等。", "tags": [], "lesson": 0, "m": "ops"}, {"id": "ops-p2", "type": "single", "stem": "号称「监控界的 SLF4J」、提供统一指标接口的是？", "options": ["Micrometer", "Spring Boot Admin", "Actuator", "Druid"], "answer": [0], "why": ["对", "可视化管理界面", "端点", "连接池"], "explain": "Micrometer。", "tags": [], "lesson": 1, "m": "ops"}, {"id": "ops-p3", "type": "single", "stem": "可执行 jar 的 MANIFEST.MF 中，Main-Class 指向的是？", "options": ["JarLauncher", "你自己的 main 类", "DispatcherServlet", "Tomcat"], "answer": [0], "why": ["启动器", "那是 Start-Class", "无关", "无关"], "explain": "Main-Class 启动器，Start-Class 你的入口。", "tags": [], "lesson": 2, "m": "ops"}, {"id": "ops-1", "type": "multi", "stem": "Spring Boot 2 中，通过 HTTP <strong>默认开放<\/strong>的 Actuator 端点是？", "options": ["health", "info", "env", "beans"], "answer": [0, 1], "why": ["默认开放", "默认开放", "需配置开放", "需配置开放"], "explain": "默认只开 health 和 info。", "tags": ["basic"], "m": "ops"}, {"id": "ops-2", "type": "single", "stem": "开放所有 Actuator Web 端点的配置是？", "options": ["management.endpoints.web.exposure.include=*", "server.port=*", "spring.actuator.all=true", "management.health.enabled=true"], "answer": [0], "why": ["对", "不对", "不存在", "不对"], "explain": "exposure.include=*。", "tags": ["basic"], "m": "ops"}, {"id": "ops-3", "type": "single", "stem": "查看程序中所有请求映射（网址 → 方法）的端点是？", "options": ["mappings", "beans", "env", "metrics"], "answer": [0], "why": ["对", "所有 Bean", "环境配置", "指标"], "explain": "mappings。", "tags": ["basic"], "m": "ops"}, {"id": "ops-4", "type": "single", "stem": "查看自动配置条件评估结果的端点是？", "options": ["conditions", "configprops", "beans", "health"], "answer": [0], "why": ["对", "配置属性", "Bean", "健康"], "explain": "conditions。", "tags": ["basic"], "m": "ops"}, {"id": "ops-5", "type": "single", "stem": "默认<strong>不启用<\/strong>、用于关闭程序的端点是？", "options": ["shutdown", "health", "info", "loggers"], "answer": [0], "why": ["对", "默认开放", "默认开放", "日志"], "explain": "shutdown 默认关闭。", "tags": ["basic"], "m": "ops"}, {"id": "ops-6", "type": "single", "stem": "可以查看并<strong>在线修改日志级别<\/strong>的端点是？", "options": ["loggers", "env", "metrics", "threaddump"], "answer": [0], "why": ["对", "环境", "指标", "线程"], "explain": "loggers。", "tags": ["basic"], "m": "ops"}, {"id": "ops-7", "type": "single", "stem": "自定义健康检查要实现的接口是？", "options": ["HealthIndicator", "HandlerInterceptor", "CommandLineRunner", "MeterBinder"], "answer": [0], "why": ["对", "拦截器", "启动任务", "指标"], "explain": "HealthIndicator。", "tags": ["basic"], "m": "ops"}, {"id": "ops-8", "type": "multi", "stem": "健康检查的状态包括？", "options": ["UP", "DOWN", "OUT_OF_SERVICE", "UNKNOWN"], "answer": [0, 1, 2, 3], "why": ["正常", "挂了", "暂停服务", "未知"], "explain": "四种状态。", "tags": ["basic"], "m": "ops"}, {"id": "ops-9", "type": "single", "stem": "`management.endpoint.health.show-details` 的默认值是？", "options": ["never", "always", "when-authorized", "true"], "answer": [0], "why": ["默认不显示详情", "不是默认", "不是默认", "不是可选值"], "explain": "never / when-authorized / always。", "tags": ["basic"], "m": "ops"}, {"id": "ops-10", "type": "single", "stem": "Micrometer 中<strong>只增不减<\/strong>的计数指标是？", "options": ["Counter", "Gauge", "Timer", "DistributionSummary"], "answer": [0], "why": ["计数器", "当前值，可增可减", "计时", "分布"], "explain": "Counter。", "tags": ["basic"], "m": "ops"}, {"id": "ops-11", "type": "single", "stem": "Micrometer 中表示<strong>当前值、可增可减<\/strong>（如在线人数）的指标是？", "options": ["Gauge", "Counter", "Timer", "Tag"], "answer": [0], "why": ["仪表", "只增", "计时", "标签"], "explain": "Gauge。", "tag ype=none", "server.port=0", "server.enabled=false", "spring.web=false"], "answer": [0], "why": ["对", "0 是随机端口", "不存在", "不存在"], "explain": "NONE / SERVLET / REACTIVE。", "tags": ["basic"], "m": "ops"}, {"id": "ops-20", "type": "single", "stem": "程序启动后执行任务，参数是包装好的 ApplicationArguments 的接口是？", "options": ["ApplicationRunner", "CommandLineRunner", "HealthIndicator", "ExitCodeGenerator"], "answer": [0], "why": ["对", "参数是原始字符串数组", "健康", "退出码"], "explain": "ApplicationRunner 包装参数，CommandLineRunner 原始参数。", "tags": ["basic"], "m": "ops"}, {"id": "ops-21", "type": "single", "stem": "自定义程序退出码，用？", "options": ["ExitCodeGenerator", "CommandLineRunner", "@Order", "HealthIndicator"], "answer": [0], "why": ["对", "启动任务", "顺序", "健康"], "explain": "ExitCodeGenerator。", "tags": ["basic"], "m": "ops"}, {"id": "ops-22", "type": "single", "stem": "可执行 jar 中，你自己写的代码放在？", "options": ["BOOT-INF/classes", "BOOT-INF/lib", "META-INF", "org/springframework/boot/loader"], "answer": [0], "why": ["对", "依赖 jar", "清单", "启动器"], "explain": "classes 自己的，lib 依赖。", "tags": ["basic"], "m": "ops"}, {"id": "ops-23", "type": "single", "stem": "把程序重新打包成可执行 jar 的是 spring-boot-maven-plugin 的哪个目标？", "options": ["repackage", "clean", "compile", "install"], "answer": [0], "why": ["重新打包", "清理", "编译", "安装"], "explain": "repackage。", "tags": ["basic"], "m": "ops"}, {"id": "ops-24", "type": "single", "stem": "判断：可执行 jar 已经包含了 Java 运行环境，不需要安装 Java", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：运行仍需要 Java"], "explain": "第 83 讲。", "tags": ["basic"], "m": "ops"}, {"id": "ops-25", "type": "single", "stem": "Dockerfile 中指定基础镜像的指令是？", "options": ["FROM", "ENTRYPOINT", "COPY", "RUN"], "answer": [0], "why": ["对", "启动命令", "复制文件", "构建时执行命令"], "explain": "FROM → COPY/ADD → ENTRYPOINT。", "tags": ["basic"], "m": "ops"}]}, {"id": "cloud", "title": "微服务、云原生、12-Factor 和 Spring Cloud 全貌", "short": "微服务与云原生", "group": "第十一章 Spring Cloud 与云原生概述", "exam": "第 86—90 讲", "refs": [{"label": "The Twelve-Factor App（中文）", "url": "https://12factor.net/zh_cn/"}], "lessons": [{"title": "微服务和云原生", "cards": ["### 微服务（第 86 讲）\n\n<strong>微服务 = 把一个大程序拆成很多个小服务，每个服务独立开发、独立部署。<\/strong>\n\n| 好处 | 代价 |\n|---|---|\n| 可以<strong>单独部署<\/strong>、单独扩容 | 服务间要<strong>网络调用<\/strong>，会失败、会慢 |\n| 每个服务可以选不同技术 | <strong>数据一致性<\/strong>更难 |\n| 一个服务出问题不一定拖垮全部 | <strong>测试、运维<\/strong>更复杂 |\n\n> ⚠️ 拆分要服从实际业务，不是越细越好。\n\n### 云原生（第 87 讲）\n\n课程从<strong>四个方面<\/strong>解释云原生（必背）：\n\n1. <strong>DevOps<\/strong>（开发和运维一体化）\n2. <strong>持续交付<\/strong>（随时能可靠地发布）\n3. <strong>微服务<\/strong>\n4. <strong>容器<\/strong>（如 Docker）"]}, {"title": "12-Factor App：十二条原则", "cards": ["### 12-Factor（第 88、89 讲）\n\n一套构建云上应用的 12 条原则。<strong>认得出每条在说什么就行：<\/strong>\n\n| # | 原则 | 一句话 |\n|---|---|---|\n| 1 | <strong>基准代码<\/strong> | 一份代码库，多处部署 |\n| 2 | <strong>依赖<\/strong> | 显式声明依赖，不依赖系统里碰巧装了的东西 |\n| 3 | <strong>配置<\/strong> | 配置放在<strong>环境<\/strong>里，不写死在代码里 |\n| 4 | <strong>后端服务<\/strong> | 数据库、缓存等当作可替换的附加资源 |\n| 5 | <strong>构建、发布、运行<\/strong> | 三个阶段严格分开 |\n| 6 | <strong>进程<\/strong> | 进程<strong>无状态<\/strong>，状态存到外部（如数据库、Redis） |\n| 7 | <strong>端口绑定<\/strong> | 通过端口对外提供服务（自带服务器） |\n| 8 | <strong>并发<\/strong> | 通过<strong>增加进程<\/strong>来扩展 |\n| 9 | <strong>易处理<\/strong> | <strong>快速启动、优雅停止<\/strong> |\n| 10 | <strong>开发与生产环境等价<\/strong> | 开发、测试、生产尽量一致 |\n| 11 | <strong>日志<\/strong> | 把日志当作<strong>事件流<\/strong>输出 |\n| 12 | <strong>管理进程<\/strong> | 后台管理任务当作一次性进程运行 |\n\n> 💡 考题常给一句描述问是哪条：看到「无状态」→ 进程；看到「配置放环境变量」→ 配置；看到「快速启动、优雅停机」→ 易处理。"]}, {"title": "Spring Cloud 能做什么", "cards": ["### 一句话\n\n<strong>Spring Cloud 给微服务常见问题提供统一的编程方式，底下的具体实现可以替换。<\/strong>（第 90 讲）\n\n| 问题 | Spring Cloud 提供 | 常见实现（后面模块讲） |\n|---|---|---|\n| 服务在哪 | <strong>服务注册与发现<\/strong> | Eureka、ZooKeeper、Consul、Nacos |\n| 调哪台机器 | <strong>客户端负载均衡<\/strong> | Ribbon、Spring Cloud LoadBalancer |\n| 配置统一管 | <strong>配置中心<\/strong> | Config Server、ZooKeeper、Consul、Nacos |\n| 下游挂了怎么办 | <strong>熔断、限流<\/strong> | Hystrix、Resilience4j |\n| 服务间发消息 | <strong>消息<\/strong> | Spring Cloud Stream |\n| 请求经过了哪些服务 | <strong>链路追踪<\/strong> | Sleuth + Zipkin |\n| 统一入口 | 服务网关 | Zuul、Gateway |\n\n### 版本\n\nSpring Cloud 的版本用<strong>伦敦地铁站名<\/strong>命名，按<strong>字母顺序<\/strong>：Angel、Brixton、Camden、Dalston、Edgware、<strong>Finchley<\/strong>、<strong>Greenwich<\/strong>、Hoxton……\n\n- 各组件版本要<strong>互相匹配<\/strong>，用 <strong>spring-cloud-dependencies<\/strong>（BOM）统一管理；\n- Finchley 对应 Spring Boot 2.0，Greenwich 对应 Spring Boot 2.1。"]}], "questions": [{"id": "cloud-p1", "type": "multi", "stem": "课程中解释云原生的四个方面是？", "options": ["DevOps", "持续交付", "微服务", "容器"], "answer": [0, 1, 2, 3], "why": ["是", "是", "是", "是"], "explain": "四个全是。", "tags": [], "lesson": 0, "m": "cloud"}, {"id": "cloud-p2", "type": "single", "stem": "12-Factor 中，「进程应该无状态，状态存到外部」对应哪条？", "options": ["进程", "配置", "日志", "依赖"], "answer": [0], "why": ["对", "配置放环境", "日志事件流", "显式声明依赖"], "explain": "无状态 → 进程。", "tags": [], "lesson": 1, "m": "cloud"}, {"id": "cloud-p3", "type": "single", "stem": "Spring Cloud 的版本命名来自？", "options": ["伦敦地铁站名", "星座", "咖啡种类", "城市名"], "answer": [0], "why": ["按字母顺序", "不是", "不是", "不是"], "explain": "Angel、Brixton、Camden……", "tags": [], "lesson": 2, "m": "cloud"}, {"id": "cloud-1", "type": "multi", "stem": "下列哪些是微服务带来的代价？", "options": ["网络调用失败和延迟", "数据一致性更难", "测试运维更复杂", "无法独立部署"], "answer": [0, 1, 2], "why": ["是", "是", "是", "独立部署是微服务的好处"], "explain": "好处：独立部署、技术多样、故障隔离。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-2", "type": "single", "stem": "判断：微服务拆分得越细越好", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：拆分应服从实际业务"], "explain": "第 86 讲。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-3", "type": "single", "stem": "12-Factor 中，「配置应存储在环境中，不写死在代码里」对应？", "options": ["配置", "依赖", "基准代码", "后端服务"], "answer": [0], "why": ["对", "依赖", "代码库", "附加资源"], "explain": "配置。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-4", "type": "single", "stem": "12-Factor 中，「快速启动、优雅停止」对应？", "options": ["易处理", "并发", "进程", "端口绑定"], "answer": [0], "why": ["Disposability", "扩展", "无状态", "端口"], "explain": "易处理。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-5", "type": "single", "stem": "12-Factor 中，「一份代码库，多处部署」对应？", "options": ["基准代码", "依赖", "构建、发布、运行", "开发与生产等价"], "answer": [0], "why": ["Codebase", "依赖", "三阶段分离", "环境一致"], "explain": "基准代码。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-6", "type": "single", "stem": "12-Factor 中，「把日志当作事件流输出」对应？", "options": ["日志", "管理进程", "后端服务", "配置"], "answer": [0], "why": ["对", "一次性任务", "附加资源", "配置"], "explain": "日志。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-7", "type": "single", "stem": "12-Factor 中，「通过增加进程数量来扩展」对应？", "options": ["并发", "进程", "易处理", "端口绑定"], "answer": [0], "why": ["Concurrency", "无状态", "快启快停", "端口"], "explain": "并发。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-8", "type": "single", "stem": "12-Factor 中，「构建、发布、运行三个阶段严格分开」对应？", "options": ["构建、发布、运行", "基准代码", "依赖", "日志"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "名字就是意思。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-9", "type": "single", "stem": "12-Factor 中，「开发、测试、生产环境尽量保持一致」对应？", "options": ["开发与生产环境等价", "配置", "基准代码", "并发"], "answer": [0], "why": ["Dev/prod parity", "不是", "不是", "不是"], "explain": "环境等价。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-10", "type": "single", "stem": "12-Factor 中，「把数据库、缓存等当作可替换的附加资源」对应？", "options": ["后端服务", "依赖", "进程", "端口绑定"], "answer": [0], "why": ["Backing services", "依赖", "无状态", "端口"], "explain": "后端服务。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-11", "type": "multi", "stem": "Spring Cloud 提供了哪些能力？", "options": ["服务注册与发现", "配置中心", "熔断", "链路追踪"], "answer": [0, 1, 2, 3], "why": ["是", "是", "是", "是"], "explain": "还有负载均衡、消息、网关等。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-12", "type": "single", "stem": "Spring Cloud 中统一管理各组件版本的 BOM 是？", "options": ["spring-cloud-dependencies", "spring-boot-starter-parent", "spring-cloud-starter", "pom.xml"], "answer": [0], "why": ["对", "Boot 的父 POM", "不对", "文件名"], "explain": "spring-cloud-dependencies。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-13", "type": "single", "stem": "下列 Spring Cloud 版本，按发布顺序排在最前面的是？", "options": ["Dalston", "Finchley", "Greenwich", "Hoxton"], "answer": [0], "why": ["D 在最前", "F", "G", "H"], "explain": "按字母顺序。", "tags": ["basic"], "m": "cloud"}, {"id": "cloud-14", "type": "single", "stem": "【进阶，可跳过】Spring Cloud Greenwich 对应的 Spring Boot 版本是？", "options": ["2.1", "1.5", "2.0", "3.0"], "answer": [0], "why": ["对", "Dalston / Edgware", "Finchley", "不是"], "explain": "Finchley 2.0，Greenwich 2.1。", "tags": ["进阶"], "m": "cloud"}]}, {"id": "discovery", "title": "服务注册与发现：Eureka、ZooKeeper、Consul、Nacos、负载均衡、Feign", "short": "注册与发现", "group": "第十二章 服务注册与发现", "exam": "第 91—99 讲", "refs": [{"label": "Spring Cloud Netflix 文档（Greenwich）", "url": "https://cloud.spring.io/spring-cloud-netflix/2.1.x/single/spring-cloud-netflix.html"}], "lessons": [{"title": "注册与发现，以及 Eureka", "cards": ["### 一句话\n\n服务多了以后，调用方需要知道「某个服务现在有哪些机器、地址是什么」。\n\n- <strong>服务注册<\/strong>：服务启动时把自己的地址<strong>登记<\/strong>到注册中心；\n- <strong>服务发现<\/strong>：调用方去注册中心<strong>查<\/strong>某个服务有哪些实例。\n\n<strong>DiscoveryClient<\/strong> 是 Spring Cloud 定义的「服务发现」接口：按服务名拿到实例列表（getServices()、getInstances(服务名)）。\n\n### Eureka（第 91、94 讲）\n\n<strong>Netflix 开源的注册中心。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启 Eureka 服务端 | <strong>@EnableEurekaServer<\/strong> |\n| 开启服务发现客户端（通用） | <strong>@EnableDiscoveryClient<\/strong> |\n| 客户端配置注册中心地址 | <strong>eureka.client.service-url.defaultZone<\/strong> |\n| 单机的注册中心自己不要注册自己 | register-with-eureka=false、fetch-registry=false |\n\n- 客户端定时发<strong>心跳<\/strong>续约（默认 30 秒），太久没心跳（默认 90 秒）会被剔除；\n- Eureka 2.x 的开发已经<strong>停止<\/strong>。"]}, {"title": "负载均衡和 Feign", "cards": ["### 客户端负载均衡（第 92 讲）\n\n一个服务有好几台机器，调用方<strong>自己<\/strong>决定这次调用哪一台，叫<strong>客户端负载均衡<\/strong>。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 课程中用的客户端负载均衡组件（Netflix） | <strong>Ribbon<\/strong> |\n| Ribbon 进入维护后，Spring 官方的替代品 | <strong>Spring Cloud LoadBalancer<\/strong> |\n| 让 RestTemplate 能用<strong>服务名<\/strong>代替真实地址 | 在 RestTemplate 上贴 <strong>@LoadBalanced<\/strong> |\n\n例子：网址写 `http://waiter-service/coffee`，加了 @LoadBalanced 后，会自动把 waiter-service 换成某台机器的真实地址。\n\n### Feign：声明式的服务调用（第 93 讲）\n\n<strong>Feign = 只写一个接口，贴上注解，就能调用远程服务<\/strong>，不用自己拼网址、发请求。\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 起步依赖 | <strong>spring-cloud-starter-openfeign<\/strong> |\n| 开启 Feign | <strong>@EnableFeignClients<\/strong> |\n| 声明一个远程服务的客户端接口 | <strong>@FeignClient(name = \"服务名\")<\/strong> |\n| 超时设置 | feign.client.config.default.connect-timeout / read-timeout |\n\n底层的 HTTP 库可以换成 Apache HttpClient 或 OkHttp。\n\n> 📌 认准：<strong>@LoadBalanced 让 RestTemplate 认服务名；@FeignClient 只写接口就能调。<\/strong>"]}, {"title": "其他注册中心：ZooKeeper、Consul、Nacos", "cards": ["### 四个注册中心对比（第 95—99 讲，常考）\n\n| 注册中心 | 出身 | 特点（认关键词） |\n|---|---|---|\n| <strong>Eureka<\/strong> | Netflix | <strong>AP<\/strong>（优先保证可用）；2.x 已停止开发 |\n| <strong>ZooKeeper<\/strong> | Apache | <strong>CP<\/strong>（优先保证一致）；用<strong>临时节点<\/strong>登记服务；网络有问题时可能不可用，课程认为<strong>不太适合做注册中心<\/strong> |\n| <strong>Consul<\/strong> | HashiCorp | 自带<strong>健康检查<\/strong>、<strong>DNS 接口<\/strong>、KV 存储、多数据中心 |\n| <strong>Nacos<\/strong> | <strong>阿里巴巴<\/strong> | <strong>服务发现 + 配置管理<\/strong>二合一；有控制台（默认端口 8848） |\n\n- CAP 里：C = 一致性，A = 可用性，P = 分区容错。（补充）\n- 起步依赖都长一个样：spring-cloud-starter-<strong>zookeeper<\/strong>-discovery、spring-cloud-starter-<strong>consul<\/strong>-discovery、spring-cloud-starter-<strong>alibaba-nacos<\/strong>-discovery。\n- Nacos 地址配置：<strong>spring.cloud.nacos.discovery.server-addr<\/strong>。\n\n### 自己实现 DiscoveryClient（第 98 讲）\n\n实现 DiscoveryClient 接口的方法（getServices、getInstances 等），比如从固定配置里读出服务列表；再适配给 Ribbon（实现 ServerList）。"]}], "questions": [{"id": "disc-p1", "type": "single", "stem": "服务启动时把自己的地址登记到注册中心，叫？", "options": ["服务注册", "服务发现", "负载均衡", "熔断"], "answer": [0], "why": ["登记 → 注册", "查 → 发现", "选机器", "保护"], "explain": "注册是登记，发现是查。", "tags": [], "lesson": 0, "m": "discovery"}, {"id": "disc-p2", "type": "single", "stem": "让 RestTemplate 可以用服务名代替真实地址，贴？", "options": ["@LoadBalanced", "@FeignClient", "@EnableDiscoveryClient", "@Primary"], "answer": [0], "why": ["对", "Feign 的", "开启发现", "主 Bean"], "explain": "@LoadBalanced。", "tags": [], "lesson": 1, "m": "discovery"}, {"id": "disc-p3", "type": "single", "stem": "阿里巴巴开源、同时支持服务发现和配置管理的是？", "options": ["Nacos", "Eureka", "ZooKeeper", "Consul"], "answer": [0], "why": ["对", "Netflix", "Apache", "HashiCorp"], "explain": "Nacos 二合一。", "tags": [], "lesson": 2, "m": "discovery"}, {"id": "disc-1", "type": "single", "stem": "Spring Cloud 中定义的、按服务名获取实例列表的接口是？", "options": ["DiscoveryClient", "RestTemplate", "FeignClient", "LoadBalancer"], "answer": [0], "why": ["对", "HTTP 客户端", "声明式客户端", "负载均衡"], "explain": "DiscoveryClient.getInstances。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-2", "type": "single", "stem": "开启 Eureka 服务端的注解是？", "options": ["@EnableEurekaServer", "@EnableDiscoveryClient", "@EnableFeignClients", "@EnableConfigServer"], "answer": [0], "why": ["对", "客户端", "Feign", "配置中心"], "explain": "@EnableEurekaServer。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-3", "type": "single", "stem": "Eureka 客户端配置注册中心地址的配置项是？", "options": ["eureka.client.service-url.defaultZone", "spring.datasource.url", "server.port", "spring.cloud.nacos.discovery.server-addr"], "answer": [0], "why": ["对", "数据库", "端口", "Nacos 的"], "explain": "defaultZone。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-4", "type": "single", "stem": "Eureka 客户端通过什么告诉注册中心「我还活着」？", "options": ["定时发送心跳", "发送邮件", "写数据库", "什么都不做"], "answer": [0], "why": ["续约，默认 30 秒一次", "不是", "不是", "不是"], "explain": "心跳续约。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-5", "type": "single", "stem": "调用方自己决定调用哪台机器，这叫？", "options": ["客户端负载均衡", "服务端负载均衡", "服务注册", "熔断"], "answer": [0], "why": ["对", "那是 Nginx 等做的", "不是", "不是"], "explain": "客户端负载均衡。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-6", "type": "single", "stem": "课程中使用的 Netflix 客户端负载均衡组件是？", "options": ["Ribbon", "Hystrix", "Eureka", "Zuul"], "answer": [0], "why": ["对", "熔断", "注册中心", "网关"], "explain": "Ribbon。", "t "tags": ["basic"], "m": "discovery"}, {"id": "disc-14", "type": "single", "stem": "自带健康检查和 DNS 接口的注册中心是？", "options": ["Consul", "Eureka", "ZooKeeper", "Ribbon"], "answer": [0], "why": ["HashiCorp 的", "不是", "不是", "不是"], "explain": "Consul。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-15", "type": "single", "stem": "ZooKeeper 用什么方式登记服务实例（服务下线时自动消失）？", "options": ["临时节点", "永久文件", "数据库表", "环境变量"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "临时节点。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-16", "type": "single", "stem": "Nacos 服务发现配置服务端地址的配置项是？", "options": ["spring.cloud.nacos.discovery.server-addr", "eureka.client.service-url.defaultZone", "spring.cloud.consul.host", "server.port"], "answer": [0], "why": ["对", "Eureka", "Consul", "端口"], "explain": "server-addr。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-17", "type": "single", "stem": "【进阶，可跳过】Nacos 控制台默认端口是？", "options": ["8848", "8080", "8761", "9411"], "answer": [0], "why": ["对（珠峰高度）", "Tomcat 默认", "Eureka 常用", "Zipkin"], "explain": "8848。", "tags": ["进阶"], "m": "discovery"}, {"id": "disc-18", "type": "single", "stem": "判断：课程认为 ZooKeeper 非常适合做服务注册中心", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：它是 CP，网络分区时可能不可用，不太适合"], "explain": "第 95 讲。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-19", "type": "single", "stem": "判断：Eureka 2.x 的开发已经停止", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "组件维护状态。", "tags": ["basic"], "m": "discovery"}, {"id": "disc-20", "type": "multi", "stem": "【进阶，可跳过】自己实现一个 DiscoveryClient，需要实现哪些方法？", "options": ["getServices()", "getInstances()", "description()", "proceed()"], "answer": [0, 1, 2], "why": ["要", "要", "要", "AOP 的"], "explain": "第 98 讲。", "tags": ["进阶"], "m": "discovery"}]}, {"id": "resilience", "title": "熔断与限流：断路器、Hystrix、Resilience4j", "short": "熔断与限流", "group": "第十三章 服务熔断", "exam": "第 100—106 讲", "refs": [{"label": "Resilience4j 文档", "url": "https://resilience4j.readme.io/docs"}], "lessons": [{"title": "断路器是什么", "cards": ["### 一句话\n\n下游服务挂了，如果还一直去调它，调用方的线程会被卡住，最后<strong>一个挂掉拖垮一片<\/strong>（雪崩）。<strong>断路器就像家里的保险丝：失败太多就先「断开」，不再调用，直接返回一个备用结果。<\/strong>\n\n### 断路器的三种状态（必背）\n\n| 状态 | 意思 |\n|---|---|\n| <strong>关闭（Closed）<\/strong> | 正常调用，同时统计失败情况 |\n| <strong>打开（Open）<\/strong> | 失败太多，<strong>直接拒绝调用<\/strong>，返回备用结果（降级） |\n| <strong>半开（Half-Open）<\/strong> | 过一段时间后，<strong>放少量请求试探<\/strong>：成功就关闭，失败就重新打开 |\n\n> 📌 记法：<strong>电路「关闭」时电流通过 = 正常调用；「打开」= 断了。<\/strong>这和平时说的「开 / 关」正好相反，最容易记错。\n\n- <strong>降级（fallback）<\/strong>：调用失败或被拒绝时，返回一个备用结果（如默认值、缓存的数据）。"]}, {"title": "Hystrix 和熔断监控", "cards": ["### Hystrix（第 101 讲）\n\n<strong>Netflix 开源的断路器<\/strong>，课程用它做演示。<strong>现在已进入维护状态，不再开发新功能。<\/strong>\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启断路器 | <strong>@EnableCircuitBreaker<\/strong>（或 @EnableHystrix） |\n| 给一个方法加上熔断保护 | <strong>@HystrixCommand<\/strong> |\n| 指定失败时的备用方法 | <strong>@HystrixCommand(fallbackMethod = \"...\")<\/strong> |\n| 两种隔离方式 | <strong>线程池隔离<\/strong>（THREAD）和<strong>信号量隔离<\/strong>（SEMAPHORE） |\n| 和 Feign 一起用 | <strong>feign.hystrix.enabled=true<\/strong>，在 @FeignClient 里指定 <strong>fallback<\/strong> |\n\n### 观察熔断（第 102 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Hystrix 的可视化仪表盘 | <strong>Hystrix Dashboard<\/strong>（@EnableHystrixDashboard） |\n| 仪表盘的数据来源端点 | <strong>/actuator/hystrix.stream<\/strong> |\n| <strong>聚合<\/strong>多个实例的熔断数据 | <strong>Turbine<\/strong> |"]}, {"title": "Resilience4j：断路器、Bulkhead、RateLimiter", "cards": ["### Resilience4j（第 103 讲）\n\n<strong>一个轻量级的容错库，受 Hystrix 启发，基于 Java 8 函数式编程。<\/strong>按模块引入，用哪个引哪个：\n\n| 模块 | 作用 |\n|---|---|\n| <strong>CircuitBreaker<\/strong> | 断路器 |\n| <strong>Bulkhead<\/strong> | 限制<strong>同时<\/strong>进行的调用数量 |\n| <strong>RateLimiter<\/strong> | 限制<strong>一段时间内<\/strong>的调用次数 |\n| Retry | 重试 |\n| TimeLimiter | 超时控制 |\n| Cache | 缓存 |\n\n断路器常用配置：<strong>failureRateThreshold<\/strong>（失败率阈值，默认 50%）、<strong>waitDurationInOpenState<\/strong>（打开状态保持多久后转半开）、统计窗口大小。\n\n可以用注解（如 <strong>@CircuitBreaker(name = \"...\")<\/strong>）或编程方式接入，还能导出指标给 Micrometer。", "### 三种保护手段：最容易混（必背，第 104—106 讲）\n\n| 手段 | 管什么 | 打个比方 |\n|---|---|---|\n| <strong>断路器 CircuitBreaker<\/strong> | 根据<strong>失败率<\/strong>，暂停调用并试探恢复 | 保险丝 |\n| <strong>Bulkhead（舱壁 / 并发隔离）<\/strong> | 限制<strong>同时<\/strong>在执行的调用数 | 船的隔水舱，一个舱进水不沉全船 |\n| <strong>RateLimiter（限流）<\/strong> | 限制<strong>单位时间内<\/strong>的调用次数 | 每分钟只放 100 人进门 |\n\n- Bulkhead 配置：<strong>maxConcurrentCalls<\/strong>（最大并发数）、maxWaitTime（排队最多等多久）；满了抛 BulkheadFullException；\n- RateLimiter 配置：<strong>limitForPeriod<\/strong>（每个周期允许几次）、<strong>limitRefreshPeriod<\/strong>（周期多长）、timeoutDuration（等许可最多多久）；超了抛 RequestNotPermitted。\n\n> 📌 认准：<strong>看失败率 → 断路器；看同时有几个 → Bulkhead；看每秒（每段时间）几次 → RateLimiter。<\/strong>三者可以一起用。"]}], "questions": [{"id": "res-p1", "type": "single", "stem": "断路器处于哪个状态时，会<strong>直接拒绝调用<\/strong>？", "options": ["打开（Open）", "关闭（Closed）", "半开（Half-Open）", "任何状态都不拒绝"], "answer": [0], "why": ["对", "关闭 = 正常调用", "半开放少量请求试探", "会拒绝"], "explain": "打开 = 断了。", "tags": [], "lesson": 0, "m": "resilience"}, {"id": "res-p2", "type": "single", "stem": "指定 Hystrix 失败时的备用方法，用？", "options": ["@HystrixCommand(fallbackMethod = \"...\")", "@EnableCircuitBreaker", "@FeignClient", "@Cacheable"], "answer": [0], "why": ["对", "开启断路器", "Feign", "缓存"], "explain": "fallbackMethod。", "tags": [], "lesson": 1, "m": "resilience"}, {"id": "res-p3", "type": "single", "stem": "限制<strong>同时<\/strong>进行的调用数量的是？", "options": ["Bulkhead", "RateLimiter", "CircuitBreaker", "Retry"], "answer": [0], "why": ["舱壁", "单位时间次数", "失败率", "重试"], "explain": "同时 → Bulkhead。", "tags": [], "lesson": 2, "m": "resilience"}, {"id": "res-1", "type": "multi", "stem": "断路器的三种状态是？", "options": ["关闭", "打开", "半开", "暂停"], "answer": [0, 1, 2], "why": ["是", "是", "是", "不是"], "explain": "Closed / Open / Half-Open。", "tags": ["basic"], "m": "resilience"}, {"id": "res-2", "type": "single", "stem": "断路器处于<strong>关闭（Closed）<\/strong>状态时？", "options": ["正常调用，并统计失败情况", "拒绝所有调用", "只放少量请求", "程序关闭"], "answer": [0], "why": ["电路接通 = /hystrix.stream", "/actuator/health", "/actuator/metrics", "/actuator/env"], "answer": [0], "why": ["对", "健康", "指标", "环境"], "explain": "hystrix.stream。", "tags": ["basic"], "m": "resilience"}, {"id": "res-11", "type": "single", "stem": "判断：Hystrix 目前已进入维护状态，不再开发新功能", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "课程推荐了 Resilience4j。", "tags": ["basic"], "m": "resilience"}, {"id": "res-12", "type": "single", "stem": "关于 Resilience4j，说法正确的是？", "options": ["轻量级，受 Hystrix 启发，基于 Java 8 函数式", "是 Netflix 的主力产品", "只能做断路器", "必须引入全部模块"], "answer": [0], "why": ["对", "不是 Netflix 的", "还有 Bulkhead、RateLimiter、Retry 等", "按需引入"], "explain": "Resilience4j。", "tags": ["basic"], "m": "resilience"}, {"id": "res-13", "type": "single", "stem": "限制<strong>单位时间内<\/strong>调用次数的是？", "options": ["RateLimiter", "Bulkhead", "CircuitBreaker", "TimeLimiter"], "answer": [0], "why": ["限流", "同时并发数", "失败率", "超时"], "explain": "每段时间几次 → RateLimiter。", "tags": ["basic"], "m": "resilience"}, {"id": "res-14", "type": "single", "stem": "根据<strong>失败率<\/strong>决定是否暂停调用的是？", "options": ["CircuitBreaker", "Bulkhead", "RateLimiter", "Cache"], "answer": [0], "why": ["断路器", "并发", "频率", "缓存"], "explain": "失败率 → 断路器。", "tags": ["basic"], "m": "resilience"}, {"id": "res-15", "type": "single", "stem": "Resilience4j 断路器中，设置失败率阈值的配置是？", "options": ["failureRateThreshold", "maxConcurrentCalls", "limitForPeriod", "limitRefreshPeriod"], "answer": [0], "why": ["failure rate = 失败率", "Bulkhead 的", "RateLimiter 的", "RateLimiter 的"], "explain": "failureRateThreshold，默认 50%。", "tags": ["basic"], "m": "resilience"}, {"id": "res-16", "type": "single", "stem": "Bulkhead 中设置最大并发调用数的配置是？", "options": ["maxConcurrentCalls", "limitForPeriod", "failureRateThreshold", "waitDurationInOpenState"], "answer": [0], "why": ["concurrent = 同时", "限流", "断路器", "断路器"], "explain": "maxConcurrentCalls。", "tags": ["basic"], "m": "resilience"}, {"id": "res-17", "type": "single", "stem": "RateLimiter 中设置每个周期允许几次调用的配置是？", "options": ["limitForPeriod", "limitRefreshPeriod", "maxConcurrentCalls", "timeoutDuration"], "answer": [0], "why": ["每周期限额", "周期多长", "Bulkhead", "等多久"], "explain": "limitForPeriod 次数，limitRefreshPeriod 周期。", "tags": ["basic"], "m": "resilience"}, {"id": "res-18", "type": "single", "stem": "断路器打开后多久转为半开，在 Resilience4j 中由哪个配置决定？", "options": ["waitDurationInOpenState", "failureRateThreshold", "maxConcurrentCalls", "limitForPeriod"], "answer": [0], "why": ["在打开状态等待多久", "失败率", "并发", "限流"], "explain": "waitDurationInOpenState。", "tags": ["basic"], "m": "resilience"}, {"id": "res-19", "type": "single", "stem": "【进阶，可跳过】Bulkhead 满了以后抛出的异常是？", "options": ["BulkheadFullException", "RequestNotPermitted", "DuplicateKeyException", "TimeoutException"], "answer": [0], "why": ["Full = 满了", "RateLimiter 的", "数据库", "不是"], "explain": "名字就是意思。", "tags": ["进阶"], "m": "resilience"}, {"id": "res-20", "type": "single", "stem": "判断：断路器、Bulkhead、RateLimiter 解决的问题不同，可以配合使用", "options": ["正确", "错误"], "answer": [0], "why": ["对", "错"], "explain": "第 106 讲。", "tags": ["basic"], "m": "resilience"}]}, {"id": "config", "title": "配置中心：Config Server、ZooKeeper、Consul、Nacos、Apollo", "short": "配置中心", "group": "第十四章 服务配置", "exam": "第 107—113 讲", "refs": [{"label": "Spring Cloud Config 文档（Greenwich）", "url": "https://cloud.spring.io/spring-cloud-config/2.1.x/single/spring-cloud-config.html"}], "lessons": [{"title": "Spring Cloud Config：基于 Git 的配置中心", "cards": ["### 一句话\n\n服务多了，每个服务的配置文件分散在各处，改一次很麻烦。<strong>配置中心 = 把所有服务的配置集中管理，服务启动时去配置中心拿配置。<\/strong>\n\n> 💡 和注册中心区分：<strong>注册中心管「服务在哪」，配置中心管「用什么配置」。<\/strong>\n\n### Config Server（第 107 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启配置中心服务端 | <strong>@EnableConfigServer<\/strong> |\n| 默认的配置存储后端 | <strong>Git<\/strong>（也支持 SVN、本地文件、Vault、JDBC 等） |\n| 常用端口 | 8888 |\n\n<strong>三个词确定要读哪份配置（必背）：<\/strong>\n\n| 词 | 意思 |\n|---|---|\n| <strong>application<\/strong> | 应用名（spring.application.name） |\n| <strong>profile<\/strong> | 环境（如 dev、prod） |\n| <strong>label<\/strong> | 版本，对 Kafka Binder） |\n| <strong>Binding<\/strong> | 把程序里的<strong>输入 / 输出通道<\/strong>和中间件里的<strong>目的地<\/strong>绑在一起 |\n\n> 📌 认准：<strong>Binder 对接中间件；Binding 绑通道和目的地。<\/strong>\n\n### 课程用的早期注解写法（认名字）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| 开启绑定 | <strong>@EnableBinding<\/strong> |\n| 监听消息 | <strong>@StreamListener<\/strong> |\n| 定义输入 / 输出通道 | <strong>@Input / @Output<\/strong> |\n| 内置的只发 / 只收 / 又收又发接口 | <strong>Source / Sink / Processor<\/strong> |\n| 处理完把结果发到另一个通道 | <strong>@SendTo<\/strong> |", "### 消费组（必背）\n\n`spring.cloud.stream.bindings.<通道名>.group` 指定消费组：\n\n- <strong>不同的组<\/strong>：每个组都会收到<strong>一份<\/strong>消息；\n- <strong>同一个组里<\/strong>：一条消息<strong>只会被其中一个实例<\/strong>处理（大家分摊）。\n\n例子：咖啡师服务部署了 3 台，放在同一个组里，一个订单只会被一台机器做，不会做三杯。\n\n### RabbitMQ 和 Kafka（第 115、116 讲）\n\n| 中间件 | 认关键词 |\n|---|---|\n| <strong>RabbitMQ<\/strong> | <strong>交换机（Exchange）<\/strong>、队列、<strong>路由键（routing key）<\/strong>、绑定 |\n| <strong>Kafka<\/strong> | <strong>主题（Topic）<\/strong>、<strong>broker<\/strong>（服务节点）、消费组；当时版本需要 ZooKeeper |\n\n### SpringBucks 进度（第 115—117 讲）\n\n- Waiter（服务员）发「新订单」消息 → Barista（咖啡师）收到后做咖啡 → 做好后再发消息通知；\n- 用消息<strong>通知<\/strong>代替<strong>轮询<\/strong>（不用一遍遍去问「好了没」）；\n- 用 RabbitMQ 的<strong>路由键<\/strong>把订单完成消息发给对应的顾客实例；\n- 第 116 讲还用到了<strong>定时任务<\/strong>（@Scheduled）和 <strong>Spring 事件<\/strong>（ApplicationEvent / @EventListener）来解耦业务。"]}, {"title": "链路追踪：Dapper、Sleuth、Zipkin", "cards": ["### 一句话\n\n一个请求可能经过好几个服务，出了问题很难知道卡在哪。<strong>链路追踪 = 给每个请求编号，记录它经过了哪些服务、每一步花了多久。<\/strong>\n\n### 两个核心概念（来自 Google 的 Dapper 论文，必背）\n\n| 概念 | 一句话 | 编号 |\n|---|---|---|\n| <strong>Trace<\/strong> | <strong>一次完整的请求<\/strong>（从头到尾） | <strong>Trace ID<\/strong>，整条链路共用一个 |\n| <strong>Span<\/strong> | 链路中的<strong>一个工作单元<\/strong>（如一次服务调用） | <strong>Span ID<\/strong>，每一步一个 |\n\n- 一个 Trace 由多个 Span 组成，Span 之间有父子关系；\n- <strong>采样<\/strong>：不是每个请求都记录，只记录一部分，减少开销。\n\n### 四个时间点（了解）\n\n<strong>cs<\/strong>（客户端发出）→ <strong>sr<\/strong>（服务端收到）→ <strong>ss<\/strong>（服务端发出）→ <strong>cr<\/strong>（客户端收到）。", "### Sleuth + Zipkin（第 119、120 讲）\n\n| 看到题目说…… | 就选 |\n|---|---|\n| Spring Cloud 的链路追踪组件 | <strong>Spring Cloud Sleuth<\/strong> |\n| Sleuth 底层使用的追踪库 | <strong>Brave<\/strong> |\n| 收集并<strong>可视化展示<\/strong>调用链的系统 | <strong>Zipkin<\/strong>（默认端口 9411） |\n| Zipkin 地址配置 | <strong>spring.zipkin.base-url<\/strong> |\n| 采样比例配置 | <strong>spring.sleuth.sampler.probability<\/strong>（默认 0.1，即 10%） |\n\n- 加了 Sleuth 后，<strong>日志里会自动带上 Trace ID 和 Span ID<\/strong>，格式类似 `[应用名,TraceID,SpanID,是否上报]`，方便按编号搜索跨服务的日志；\n- 追踪数据可以通过 <strong>HTTP<\/strong> 直接发给 Zipkin，也可以通过 <strong>RabbitMQ / Kafka<\/strong> 消息发送（spring.zipkin.sender.type）；\n- 消息收发（如 RabbitMQ）的链路也能追踪，追踪信息随消息一起传递。\n\n### 除了链路还要治理什么（第 121、122 讲）\n\n容量规划、依赖关系、配置变更、发布审计、代码质量、监控告警……<strong>链路追踪只是观察系统的一部分<\/strong>。生产环境的采样比例要在开销和排查需要之间权衡。第 122 讲用 <strong>Docker Compose<\/strong> 把所有服务一起编排启动。\n\n> 📌 必背：<strong>Trace = 整个请求，Span = 其中一步；Sleuth 采集，Zipkin 展示；日志带 TraceID。<\/strong>"]}], "questions": [{"id": "stream-p1", "type": "single", "stem": "Spring Cloud Stream 中，负责对接具体消息中间件的是？", "options": ["Binder", "Binding", "Span", "Trace"], "answer": [0], "why": ["适配器", "绑定通道和目的地", "追踪", "追踪"], "explain": "Binder 对接中间件。", "tags": [], "lesson": 0, "m": "stream"}, {"id": "stream-p2", "type": "single", "stem": "同一个消费组里有 3 个实例，一条消息会被处理几次？", "options": ["1 次", "3 次", "0 次", "随机"], "answer": [0], "why": ["组内只有一个实例处理", "不同组才会各收一份", "会处理", "确定的"], "explain": "组内分摊。", "tags": [], "lesson": 0, "m": "stream"}, {"id": "stream-p3", "type": "single", "stem": "链路追踪中，表示<strong>一次完整请求<\/strong>的是？", "options": ["Trace", "Span", "Binder", "Topic"], "answer": [0], "why": ["对", "一个工作单元", "消息", "Kafka"], "explain": "Trace 整条，Span 一步。", "tags": [], "lesson": 1, "m": "stream"}, {"id": "stream-1", "type": "single", "stem": "Spring Cloud Stream 的作用是？", "options": ["用统一的方式收发消息，屏蔽不同中间件的差异", "做链路追踪", "做服务注册", "做页面渲染"], "answer": [0], "why": ["对", "Sleuth", "Eureka 等", "无关"], "explain": "Stream = 统一的消息编程模型。", "tags": ["basic"], "m": "stream"}, {"id": "stream-2", "type": "single", "stem": "Spring Cloud Stream 中，把程序的通道和中间件目的地绑在一起的是？", "options": ["Binding", "Binder", "Exchange", "Span"], "answer": [0], "why": ["对", "对接中间件", "RabbitMQ 的", "追踪"], "explain": "Binding 绑定。", "tags": ["basic"], "m": "stream"}, {"id": "stream-3", "type": "single", "stem": "早期注解式写法中，开启绑定的注解是？", "options": ["@EnableBinding", "@StreamListener", "@EnableKafka", "@EnableCaching"], "answer": [0], "why": ["对", "监听消息", "不是", "缓存"], "explain": "@EnableBinding + @StreamListener。", "tags": ["basic"], "m": "stream"}, {"id": "stream-4", "type": "single", "stem": "早期注解式写法中，监听并处理消息的注解是？", "options": ["@StreamListener", "@EnableBinding", "@Output", "@SendTo"], "answer": [0], "why": ["对", "开启绑定", "输出通道", "发到另一个通道"], "explain": "@StreamListener。", "tags": ["basic"], "m": "stream"}, {"id": "stream-5", "type": "single", "stem": "Spring Cloud Stream 内置的「只接收消息」的接口是？", "options": ["Sink", "Source", "Processor", "Binder"], "answer": [0], "why": ["Sink = 水槽，只进", "Source = 源头，只出", "又收又发", "适配器"], "explain": "Source 发，Sink 收，Processor 都有。", "tags": ["basic"], "m": "stream"}, {"id": "stream-6", "type": "single", "stem": "设置消费组的配置项是？", "options": ["spring.cloud.stream.bindings.<通道名>.group", "spring.kafka.topic", "spring.rabbitmq.host", "spring.cloud.stream.binder"], "answer": [0], "why": ["对", "不对", "RabbitMQ 地址", "不对"], "explain": "bindings.<通道名>.group。", "tags": ["basic"], "m": "stream"}, {"id": "stream-7", "type": "single", "stem": "两个<strong>不同的<\/strong>消费组都订阅了同一个目的地，一条消息会怎样？", "options": ["每个组各收到一份", "只有一个组收到", "两个组都收不到", "随机"], "answer": [0], "why": ["对", "组内才分摊", "会收到", "确定的"], "explain": "不同组各一份，同组分摊。", "tags": ["basic"], "m": "stream"}, {"id": "stream-8", "type": "multi", "stem": "下列属于 RabbitMQ 的概念是？", "options": ["交换机（Exchange）", "路由键（routing key）", "队列", "哈希槽"], "answer": [0, 1, 2], "why": ["是", "是", "是", "Redis Cluster 的"], "explain": "RabbitMQ：交换机、队列、路由键。", "tags": ["basic"], "m": "stream"}, {"id": "stream-9", "type": "single", "stem": "Kafka 中消息按什么分类？", "options": ["主题（Topic）", "交换机", "哈希槽", "Span"], "answer": [0], "why": ["对", "RabbitMQ", "Redis", "追踪"], "explain": "Kafka Topic。", "tags": ["basic"], "m": "stream"}, {"id": "stream-10", "type": "single", "stem": "SpringBucks 中用消息通知代替了什么？", "options": ["轮询", "数据库", "缓存", "事务"], "answer": [0], "why": ["不用一遍遍去问", "不是", "不是", "不是"], "explain": "第 117 讲。", "tags": ["basic"], "m": "stream"}, {"id": "stream-11", "type": "single", "stem": "链路追踪的 Trace 和 Span 概念来自哪篇论文？", "options": ["Google Dapper", "Amazon Dynamo", "Google MapReduce", "Netflix Hystrix"], "answer": [0], "why": ["对", "数据库", "大数据计算", "不是论文"], "explain": "Dapper。", "tags": ["basic"], "m": "stream"}, {"id": "stream-12", "type": "single", "stem": "链路追踪中，表示链路里<strong>一个工作单元<\/strong>的是？", "options": ["Span", "Trace", "Topic", "Binder"], "answer": [0], "why": ["对", "整条链路", "Kafka", "Stream"], "explain": "Span。", "tags": ["basic"], "m": "stream"}, {"id": "stream-13", "type": "single", "stem": "只记录一部分请求的追踪数据以减少开销，叫？", "options": ["采样", "熔断", "缓存", "限流"], "answer": [0], "why": ["对", "不是", "不是", "不是"], "explain": "采样。", "tags": ["basic"], "m": "stream"}, {"id": "stream-14", "type": "single", "stem": "Spring Cloud 的链路追踪组件是？", "options": ["Spring Cloud Sleuth", "Spring Cloud Stream", "Spring Cloud Config", "Spring Cloud Bus"], "answer": [0], "why": ["Sleuth = 侦探", "消息", "配置", "总线"], "explain": "Sleuth 采集。", "tags": ["basic"], "m": "stream"}, {"id": "stream-15", "type": "single", "stem": "收集追踪数据并可视化展示调用链的系统是？", "options": ["Zipkin", "Turbine", "Spring Boot Admin", "Eureka"], "answer": [0], "why": ["对（端口 9411）", "Hystrix 聚合", "Actuator 管理界面", "注册中心"], "explain": "Zipkin 展示。", "tags": ["basic"], "m": "stream"}, {"id": "stream-16", "type": "single", "stem": "Sleuth 底层使用的追踪库是？", "options": ["Brave", "Hystrix", "Ribbon", "Lettuce"], "answer": [0], "why": ["对", "熔断", "负载均衡", "Redis 客户端"], "explain": "Brave。", "tags": ["basic"], "m": "stream"}, {"id": "stream-17", "type": "multi", "stem": "加了 Sleuth 后，日志里会自动带上？", "options": ["Trace ID", "Span ID", "数据库密码", "用户手机号"], "answer": [0, 1], "why": ["是", "是", "不会", "不会"], "explain": "方便按编号查跨服务日志。", "tags": ["basic"], "m": "stream"}, {"id": "stream-18", "type": "single", "stem": "Sleuth 设置采样比例的配置是？", "options": ["spring.sleuth.sampler.probability", "spring.zipkin.base-url", "spring.sleuth.enabled", "management.metrics"], "answer": [0], "why": ["对（默认 0.1）", "Zipkin 地址", "开关", "指标"], "explain": "probability = 概率。", "tags": ["basic"], "m": "stream"}, {"id": "stream-19", "type": "multi", "stem": "Sleuth 把追踪数据发送给 Zipkin 的方式有？", "options": ["HTTP", "RabbitMQ", "Kafka", "发邮件"], "answer": [0, 1, 2], "why": ["可以", "可以", "可以", "不可以"], "explain": "spring.zipkin.sender.type。", "tags": ["basic"], "m": "stream"}, {"id": "stream-20", "type": "single", "stem": "判断：链路追踪就是服务治理的全部", "options": ["正确", "错误"], "answer": [1], "why": ["错", "对：还有容量、依赖、变更、审计、监控等"], "explain": "第 121 讲。", "tags": ["basic"], "m": "stream"}, {"id": "stream-21", "type": "single", "stem": "第 122 讲中，用什么把咖啡店的所有服务和依赖一起编排启动？", "options": ["Docker Compose", "Maven", "Spring Initializr", "Turbine"], "answer": [0], "why": ["对", "构建工具", "生成工程", "Hystrix 聚合"], "explain": "Docker Compose。", "tags": ["basic"], "m": "stream"}]}], "cheatsheet": "### 初识 Spring（第 01—04、13 讲）\n\n- Framework 地基（IoC、AOP），Boot 快速搭建（自动配置、起步依赖），Cloud 分布式（发现、配置、熔断）。\n- IoC = 交给 Spring 管；DI = Spring 自动塞；Bean = 被管的对象；容器 = ApplicationContext。\n- 分层注解：@Controller → @Service → @Repository，都是 @Component；@Autowired 自动塞；@Configuration + @Bean 用方法造 Bean。\n- @SpringBootApplication = @Configuration + @EnableAutoConfiguration + @ComponentScan。\n- start.spring.io = Initializr；/actuator/health 看健康；父 POM / BOM 管版本；spring-boot-maven-plugin 打可执行 jar。Spring 5 要 Java 8+。\n\n### 数据源与连接池（第 05—08 讲）\n\n- 单数据源：Boot 自动配 <strong>DataSource + DataSourceTransactionManager + JdbcTemplate<\/strong>；配置前缀 spring.datasource；schema.sql 建表、data.sql 插数据。\n- 多数据源：每个配自己的事务管理器；排除自动配置（exclude）或用 <strong>@Primary<\/strong> 指定主数据源。\n- <strong>HikariCP<\/strong> = Boot 2 默认，主打快（字节码精简、FastList、ConcurrentBag）；maximumPoolSize 最大连接数（默认 10），maxLifetime 寿命，connectionTimeout 等待。Boot 1 默认 Tomcat 连接池。\n- <strong>Druid<\/strong> = 阿里，主打监控：SQL 统计、慢 SQL、WallFilter 防注入、密码加密、Filter 扩展；druid-spring-boot-starter。\n\n### JdbcTemplate 与异常（第 09、12 讲）\n\n- update 增删改；query / queryForList 查多条；queryForObject 查一个；batchUpdate 批量；execute 任意语句。\n- RowMapper 行 → 对象；SimpleJdbcInsert 插入拿主键；NamedParameterJdbcTemplate 用 :名字 当参数。\n- 异常根 <strong>DataAccessException<\/strong>（运行时异常）；主键重复 DuplicateKeyException；翻译器 SQLErrorCodeSQLExceptionTranslator；对照表 sql-error-codes.xml（可自定义覆盖）。\n\n### 事务（第 10、11、14 讲）\n\n- 事务 = 一组操作要么全成功（提交），要么全撤销（回滚）。\n- <strong>Manager 干活<\/strong>（PlatformTransactionManager：开启/提交/回滚），<strong>Definition 定规则<\/strong>（TransactionDefinition），<strong>Status 看状态<\/strong>（TransactionStatus）。\n- 经理名字前半截 = 技术：JDBC / MyBatis → <strong>DataSource<\/strong>；JPA → <strong>Jpa<\/strong>；分布式 → <strong>Jta<\/strong>。\n- 默认值：传播 <strong>REQUIRED<\/strong>，隔离 <strong>DEFAULT（跟数据库走）<\/strong>，超时 -1，只读 false。\n- 传播：REQUIRES_NEW = 总是新的独立事务；NESTED = 原事务里存档；MANDATORY 没有就报错；NEVER 有就报错。\n- 并发问题：未提交 → 脏读；值变了 → 不可重复读；行数变了 → 幻读。SERIALIZABLE 全挡。\n- Template → 编程式（手动回滚 setRollbackOnly）；@Transactional → 声明式，靠 <strong>AOP 代理<\/strong>；传统 Spring 用 @EnableTransactionManagement 打开，Boot 自动打开。\n- 回滚：<strong>带 Runtime 的错误回滚，不带的不回滚<\/strong>，除非写 rollbackFor。\n- 三个坑：类里自己调自己不生效；错误被 catch 接住不回滚；贴在非 public 方法上不生效。\n\n### JPA（第 15—19、23 讲）\n\n- ORM 对象 ↔ 表；<strong>JPA 规范，Hibernate 实现，Spring Data JPA 提供 Repository<\/strong>。\n- @Entity 实体，@Table 表名，@Id 主键，@GeneratedValue 自动生成，@Column 列，@ManyToMany 多对多，@CreationTimestamp / @UpdateTimestamp，@Enumerated 枚举，@MappedSuperclass 公共父类。\n- Lombok：@Data 一大堆，@Builder 链式，@Slf4j 日志，@NoArgsConstructor / @AllArgsConstructor。金额用 Joda Money。\n- CrudRepository（增删改查）→ PagingAndSortingRepository（+分页排序）→ JpaRepository；@EnableJpaRepositories；@NoRepositoryBean。\n- 方法名查询：findBy… And / OrderBy / Top3 / Desc；countBy…；Pageable 分页、Sort 排序。\n- 接口 → 代理 → 默认实现 SimpleJpaRepository。Query by Example = 样例对象当条件。\n\n### MyBatis（第 20—22 讲）\n\n- MyBatis 自己写 SQL（复杂查询、精细控制）；JPA 自动生成 SQL（简单增删改查）。\n- mybatis-spring-boot-starter；@Mapper / @MapperScan；@Select 等写 SQL；@Options(useGeneratedKeys=true) 拿主键；TypeHandler 类型转换。\n- 配置：mapper-locations（XML 位置）、type-handlers-package、map-underscore-to-camel-case（下划线转驼峰）。\n- <strong>MyBatis Generator<\/strong> 生成 Model / Mapper / XML，配置 generatorConfig.xml，命令行 / Maven 插件 / Java 运行，结果要审查。\n- <strong>PageHelper<\/strong> 分页：pagehelper-spring-boot-starter，RowBounds 或方法参数，PageInfo。\n\n### NoSQL 与缓存（第 24—30 讲）\n\n- Docker：镜像 = 安装包，容器 = 运行实例；-p 端口，-v 数据卷，-e 环境变量；pull / run / ps / logs / stop。\n- MongoDB：@Document + @Id，MongoTemplate，MongoRepository，自定义 Converter。\n- Redis：String / List / Hash / Set / ZSet。<strong>Jedis 线程不安全（JedisPool），Lettuce 线程安全、Boot 2 默认<\/strong>。\n- <strong>哨兵 = 监控 + 自动切换<\/strong>（JedisSentinelPool）；<strong>集群 = 分片，16384 哈希槽<\/strong>（JedisCluster）。\n- RedisTemplate / StringRedisTemplate；opsForValue / opsForHash / opsForList；@RedisHash；可自定义序列化器。\n- 缓存：@EnableCaching 打开；<strong>@Cacheable 有就不执行；@CachePut 总执行再更新；@CacheEvict 清除<\/strong>；@Caching 组合；@CacheConfig 类级配置。共享用 Redis，spring.cache.redis.time-to-live 过期。\n\n### Reactor 响应式（第 31—35 讲）\n\n- Reactor 实现 Reactive Streams（Publisher / Subscriber / Subscription / Processor）。\n- <strong>Mono 0..1，Flux 0..N<\/strong>；<strong>不订阅不执行<\/strong>；<strong>背压 = 下游用 request(n) 控制速度<\/strong>。\n- map 一对一，flatMap 变流再合并，filter 过滤，onErrorReturn 默认值 / onErrorResume 换流，doOnNext 顺便做事。\n- Schedulers 指定线程；publishOn 管后面，subscribeOn 管源头。\n- ReactiveRedisTemplate（只能用 Lettuce），ReactiveMongoTemplate，<strong>R2DBC<\/strong>（ConnectionFactory、DatabaseClient，当时在孵化）。\n\n### AOP（第 36—38 讲）\n\n- AOP = 不改代码，在方法前后加横切逻辑（日志、耗时、事务）。\n- <strong>切面 = 通知 + 切点；通知 = 做什么；切点 = 在哪<\/strong>；连接点 = 方法执行；织入 = 应用过程；目标对象；AOP 代理。\n- 通知：@Before 前，@AfterReturning 正常返回后，@AfterThrowing 出错后，@After 都执行（finally），<strong>@Around 包住<\/strong>（proceed() 执行原方法，适合统计耗时）。\n- @Aspect + @Component；@EnableAspectJAutoProxy（Boot 自动）；<strong>@Order 越小越先<\/strong>。\n- 切点表达式：execution（最常用）、within、@annotation、bean。\n- 有接口 JDK 动态代理或 CGLIB；没接口 CGLIB。\n\n### Spring MVC（第 39—45、49—52 讲）\n\n- 总入口 <strong>DispatcherServlet<\/strong>；HandlerMapping 找方法，HandlerAdapter 调方法，HandlerExceptionResolver 处理异常，ViewResolver 解析视图，MultipartResolver 上传。\n- @RestController = @Controller + @ResponseBody；@RequestMapping / @GetMapping…；@PathVariable 路径变量，@RequestParam 问号参数，@RequestBody 请求体，@RequestHeader，@ResponseStatus。\n- 父子上下文：<strong>子看父，父看不到子<\/strong>；切面只对同一上下文生效。\n- 流程：DispatcherServlet → Mapping → Adapter → preHandle → 方法 → postHandle → 视图 / 异常 → afterCompletion。\n- Converter / Formatter（Boot 自动注册）；@Valid + BindingResult；MultipartFile。\n- 页面 ViewResolver → View；JSON <strong>HttpMessageConverter<\/strong>；内容协商；redirect: / forward:。\n- @ExceptionHandler 单个，<strong>@ControllerAdvice<\/strong> 集中；拦截器 preHandle（false 拦下）/ postHandle / afterCompletion，WebMvcConfigurer.addInterceptors。\n\n### 视图与静态资源（第 46—48 讲）\n\n- JSON 默认 Jackson；XML 加 jackson-dataformat-xml；@JsonComponent 自定义序列化。\n- Thymeleaf：spring-boot-starter-thymeleaf，模板在 classpath:/templates/，后缀 .html，开发时 spring.thymeleaf.cache=false。\n- 静态资源目录：/static、/public、/resources、/META-INF/resources；static-path-pattern 访问路径，static-locations 目录；Cache-Control 缓存；生产交给 CDN / Nginx。\n\n### HTTP 客户端（第 53—57 讲）\n\n- <strong>RestTemplate<\/strong> 同步阻塞；Boot 不自动建，用 <strong>RestTemplateBuilder<\/strong>。\n- getForObject 只要内容，getForEntity 要完整响应（ResponseEntity）；postForObject / put / delete；<strong>exchange<\/strong> 最灵活。\n- RequestEntity 构造请求，UriComponentsBuilder 拼网址，ParameterizedTypeReference 处理泛型。\n- 底层换 Apache HttpClient：HttpComponentsClientHttpRequestFactory；配连接池、连接 / 读取超时（下游慢会卡住线程）。\n- <strong>WebClient<\/strong> 非阻塞，返回 Mono / Flux，底层 Reactor Netty；retrieve() → bodyToMono / bodyToFlux。\n\n### REST 与 WebFlux（第 58—66 讲）\n\n- 成熟度：0 POX → 1 资源 → 2 HTTP 方法 → <strong>3 超媒体（HATEOAS）<\/strong>。网址用名词复数、分层级。\n- <strong>安全<\/strong>：GET、HEAD、OPTIONS；<strong>不幂等<\/strong>：POST、PATCH（其余幂等）。\n- 状态码：200 成功，201 新建，204 无内容，304 没变，400 请求错，<strong>401 没登录，403 没权限<\/strong>，404，405，500。4 客户端错，5 服务器错。\n- HATEOAS 响应带链接；HAL：_links、_embedded。Spring Data REST：spring-boot-starter-data-rest，@RepositoryRestResource，/search。\n- Session：粘性会话 / 会话复制 / 集中存储；Spring Session + Redis，@EnableRedisHttpSession。\n- WebFlux：非阻塞、Reactor、默认 Netty；不一定更快，少线程高并发；全链路非阻塞（R2DBC）；注解或 RouterFunction。\n\n### Boot 原理（第 67—74 讲）\n\n- 四部分：<strong>自动配置、起步依赖、CLI、Actuator<\/strong>。Boot 不是：应用服务器、Java EE 实现、代码生成器、Spring 替代品。\n- <strong>@EnableAutoConfiguration → AutoConfigurationImportSelector → META-INF/spring.factories → 条件注解<\/strong>。\n- 条件：OnClass / OnMissingClass / OnBean / <strong>OnMissingBean（用户可覆盖）<\/strong> / OnProperty / OnWebApplication / OnResource。\n- 顺序 @AutoConfigureBefore / After / Order；--debug 看条件报告；exclude 排除；低版本用 BeanFactoryPostProcessor。\n- Starter：<strong>官方 spring-boot-starter-xxx，第三方 xxx-spring-boot-starter<\/strong>；拆 autoconfigure + starter；BOM 管版本；mvn dependency:tree + exclusion。\n- 优先级：<strong>命令行最高；带 profile > 不带；jar 外 > jar 内<\/strong>；spring.profiles.active；宽松绑定（推荐中划线）。\n- PropertySource → Environment；<strong>@ConfigurationProperties 一组，@Value 单个<\/strong>；EnvironmentPostProcessor 加配置源。\n\n### Boot 运维（第 75—85 讲）\n\n- Actuator 端点在 /actuator：health、info、beans、conditions、configprops、env、mappings、metrics、loggers（可改级别）、threaddump、heapdump、shutdown（默认关）。HTTP 默认只开 <strong>health、info<\/strong>；exposure.include=* 全开。\n- HealthIndicator，Health.up() / down()；UP / DOWN / OUT_OF_SERVICE / UNKNOWN；有一个 DOWN 整体 DOWN；show-details 默认 never。\n- <strong>Micrometer = 监控界的 SLF4J<\/strong>；Counter 只增，Gauge 当前值，Timer 计时；Tag 维度；MeterRegistry。\n- Spring Boot Admin（codecentric）：@EnableAdminServer；spring.boot.admin.client.url。\n- server.port、server.compression.enabled、server.tomcat.max-threads；WebServerFactoryCustomizer。HTTPS：keytool + server.ssl.key-store；HTTP/2：server.http2.enabled（浏览器需 HTTPS）。\n- web-application-type=none；ApplicationRunner（ApplicationArguments）/ CommandLineRunner（原始参数）；@Order；ExitCodeGenerator。\n- 可执行 jar：repackage；MANIFEST <strong>Main-Class = JarLauncher，Start-Class = 你的入口<\/strong>；BOOT-INF/classes、BOOT-INF/lib；仍需 Java。\n- Dockerfile：FROM → COPY / ADD → ENTRYPOINT。\n\n### 微服务与云原生（第 86—90 讲）\n\n- 微服务好处：独立部署扩容、技术多样、故障隔离；代价：网络调用、数据一致性、测试运维复杂；按业务拆，不是越细越好。\n- 云原生四方面：<strong>DevOps、持续交付、微服务、容器<\/strong>。\n- 12-Factor：基准代码、依赖、<strong>配置（放环境）<\/strong>、后端服务、构建发布运行分离、<strong>进程（无状态）<\/strong>、端口绑定、并发（加进程）、<strong>易处理（快启优雅停）<\/strong>、环境等价、日志（事件流）、管理进程。\n- Spring Cloud：注册发现、负载均衡、配置、熔断、消息、追踪、网关；实现可替换。版本 = 伦敦地铁站名按字母序（Finchley↔Boot 2.0，Greenwich↔Boot 2.1）；spring-cloud-dependencies 管版本。\n\n### 注册与发现（第 91—99 讲）\n\n- 注册 = 登记，发现 = 查；<strong>DiscoveryClient<\/strong>（getServices、getInstances）。\n- Eureka（Netflix，<strong>AP<\/strong>，2.x 停止）：@EnableEurekaServer；@EnableDiscoveryClient；defaultZone；心跳 30 秒、90 秒剔除。\n- 客户端负载均衡：<strong>Ribbon<\/strong>（维护）→ <strong>Spring Cloud LoadBalancer<\/strong>；<strong>@LoadBalanced<\/strong> 让 RestTemplate 认服务名。\n- <strong>Feign<\/strong>：spring-cloud-starter-openfeign，@EnableFeignClients，<strong>@FeignClient(name=)<\/strong>，可配超时、换 HttpClient / OkHttp。\n- ZooKeeper（Apache，<strong>CP<\/strong>，临时节点，不太适合做注册中心）；Consul（HashiCorp，健康检查、DNS、KV）；<strong>Nacos（阿里，发现 + 配置，8848）<\/strong>，server-addr。\n\n### 熔断与限流（第 100—106 讲）\n\n- 断路器防雪崩：<strong>关闭 = 正常调用；打开 = 直接拒绝；半开 = 放少量试探<\/strong>；降级 fallback。\n- Hystrix（Netflix，已维护）：@EnableCircuitBreaker，@HystrixCommand(fallbackMethod)，线程池 / 信号量隔离；Feign：feign.hystrix.enabled + fallback；Dashboard 读 /actuator/hystrix.stream，<strong>Turbine 聚合<\/strong>。\n- Resilience4j：轻量、Java 8 函数式、按模块引入（CircuitBreaker、Bulkhead、RateLimiter、Retry、TimeLimiter、Cache）。\n- <strong>失败率 → 断路器<\/strong>（failureRateThreshold 默认 50%，waitDurationInOpenState）；<strong>同时几个 → Bulkhead<\/strong>（maxConcurrentCalls，BulkheadFullException）；<strong>每段时间几次 → RateLimiter<\/strong>（limitForPeriod、limitRefreshPeriod，RequestNotPermitted）。可配合使用。\n\n### 配置中心（第 107—113 讲）\n\n- 配置中心管「用什么配置」，注册中心管「服务在哪」。\n- Config Server：<strong>@EnableConfigServer<\/strong>，默认 <strong>Git<\/strong>，端口 8888；<strong>application 应用名 / profile 环境 / label 分支<\/strong>。\n- 客户端：spring-cloud-starter-config，写在 <strong>bootstrap.yml<\/strong>，spring.cloud.config.uri，fail-fast，spring-retry 重试，discovery.enabled。\n- 刷新：<strong>@RefreshScope + POST /actuator/refresh<\/strong>；Spring Cloud <strong>Bus<\/strong> 广播（/actuator/bus-refresh）；ZooKeeper / Consul / Nacos 监听自动刷新。\n- PropertySourceLocator 接入远程配置，默认远程优先。\n- ZooKeeper 节点监听；Consul KV + Watch；<strong>Nacos（阿里）Data ID + Group<\/strong>；<strong>Apollo（携程）灰度、权限、审计、多环境<\/strong>。\n\n### 消息与追踪（第 114—122 讲）\n\n- Stream 统一收发消息；<strong>Binder 对接中间件，Binding 绑通道和目的地<\/strong>；@EnableBinding、@StreamListener、@Input / @Output、Source 发 / Sink 收 / Processor、@SendTo。\n- <strong>消费组<\/strong>：不同组各收一份；同组只有一个实例处理（bindings.<通道>.group）。\n- RabbitMQ：交换机、队列、路由键；Kafka：Topic、broker、消费组。消息通知代替轮询；@Scheduled、Spring 事件解耦。\n- Dapper：<strong>Trace = 一次完整请求（Trace ID），Span = 一个工作单元（Span ID）<\/strong>；采样；cs / sr / ss / cr。\n- <strong>Sleuth 采集（底层 Brave），Zipkin 展示（9411）<\/strong>；spring.zipkin.base-url；spring.sleuth.sampler.probability 默认 0.1；日志带 TraceID / SpanID；HTTP 或 RabbitMQ / Kafka 上报；消息链路也能追踪。\n- 治理不只链路：容量、依赖、变更、审计、监控；Docker Compose 编排。", "harness": "", "stages": [{"n": 1, "name": "数据访问", "desc": "第 1—38 讲：Spring 基础、JDBC、事务、JPA / MyBatis、Redis 与缓存、响应式、AOP", "mods": ["base", "ds", "jdbc", "tx", "jpa", "mybatis", "nosql", "reactor", "aop"]}, {"n": 2, "name": "Web 开发", "desc": "第 39—66 讲：Spring MVC、视图、HTTP 客户端、REST、WebFlux", "mods": ["mvc", "view", "client", "rest"]}, {"n": 3, "name": "Spring Boot", "desc": "第 67—85 讲：自动配置、起步依赖、配置加载、Actuator、打包部署", "mods": ["boot", "ops"]}, {"n": 4, "name": "Spring Cloud", "desc": "第 86—122 讲：微服务、注册发现、熔断限流、配置中心、消息、链路追踪", "mods": ["cloud", "discovery", "resilience", "config", "stream"]}], "blueprint": [{"m": "base", "type": "single", "tag": "basic"}, {"m": "base", "type": "single", "tag": "basic"}, {"m": "ds", "type": "single", "tag": "basic"}, {"m": "ds", "type": "single", "tag": "basic"}, {"m": "jdbc", "type": "single", "tag": "basic"}, {"m": "jdbc", "type": "single", "tag": "basic"}, {"m": "tx", "type": "single", "tag": "basic"}, {"m": "tx", "type": "single", "tag": "basic"}, {"m": "tx", "type": "single", "tag": "basic"}, {"m": "jpa", "type": "single", "tag": "basic"}, {"m": "jpa", "type": "single", "tag": "basic"}, {"m": "mybatis", "type": "single", "tag": "basic"}, {"m": "mybatis", "type": "single", "tag": "basic"}, {"m": "nosql", "type": "single", "tag": "basic"}, {"m": "nosql", "type": "single", "tag": "basic"}, {"m": "reactor", "type": "single", "tag": "basic"}, {"m": "reactor", "type": "single", "tag": "basic"}, {"m": "aop", "type": "single", "tag": "basic"}, {"m": "aop", "type": "single", "tag": "basic"}, {"m": "mvc", "type": "single", "tag": "basic"}, {"m": "mvc", "type": "single", "tag": "basic"}, {"m": "mvc", "type": "single", "tag": "basic"}, {"m": "view", "type": "single", "tag": "basic"}, {"m": "client", "type": "single", "tag": "basic"}, {"m": "client", "type": "single", "tag": "basic"}, {"m": "rest", "type": "single", "tag": "basic"}, {"m": "rest", "type": "single", "tag": "basic"}, {"m": "boot", "type": "single", "tag": "basic"}, {"m": "boot", "type": "single", "tag": "basic"}, {"m": "boot", "type": "single", "tag": "basic"}, {"m": "ops", "type": "single", "tag": "basic"}, {"m": "ops", "type": "single", "tag": "basic"}, {"m": "cloud", "type": "single", "tag": "basic"}, {"m": "cloud", "type": "single", "tag": "basic"}, {"m": "discovery", "type": "single", "tag": "basic"}, {"m": "discovery", "type": "single", "tag": "basic"}, {"m": "resilience", "type": "single", "tag": "basic"}, {"m": "resilience", "type": "single", "tag": "basic"}, {"m": "resilience", "type": "single", "tag": "basic"}, {"m": "config", "type": "single", "tag": "basic"}, {"m": "config", "type": "single", "tag": "basic"}, {"m": "stream", "type": "single", "tag": "basic"}, {"m": "stream", "type": "single", "tag": "basic"}, {"m": "tx", "type": "multi", "tag": "basic"}, {"m": "nosql", "type": "multi", "tag": "basic"}, {"m": "mvc", "type": "multi", "tag": "basic"}, {"m": "rest", "type": "multi", "tag": "basic"}, {"m": "boot", "type": "multi", "tag": "basic"}, {"m": "ops", "type": "multi", "tag": "basic"}, {"m": "cloud", "type": "multi", "tag": "basic"}, {"m": "resilience", "type": "multi", "tag": "basic"}, {"m": "config", "type": "multi", "tag": "basic"}, {"m": "stream", "type": "multi", "tag": "basic"}], "brand": "考试冲刺", "brandSub": "Spring 全家桶", "storageKey": "spring-review-v2"};

<script>'use strict';

/* ============================================================
 * 数据
 * ============================================================ */
const DATA = window.EXAM_DATA;
const MODS = DATA.modules;
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));
const QS = {};
MODS.forEach(m => m.questions.forEach(q => { QS[q.id] = q; }));

const STAGES = DATA.stages;

// 模拟卷结构：按考试大纲题号
const BLUEPRINT = DATA.blueprint;

const TYPE_NAME = { single: '单选', multi: '多选', short: '简答', code: '代码' };
const DAY = 24 * 3600 * 1000;
const isPractice = q => q.lesson !== undefined;
const drillPool = () => Object.values(QS).filter(q => !isPractice(q));

/* ============================================================
 * 进度存储
 * ============================================================ */
const KEY = DATA.storageKey;
const DEFAULT_STATE = () => ({ lessons: {}, q: {}, mocks: [], code: {}, last: null, settings: { blind: false } });
let S = loadState();

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && typeof raw === 'object') return Object.assign(DEFAULT_STATE(), raw);
  } catch (e) { /* 损坏就重新开始 */ }
  return DEFAULT_STATE();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('进度保存失败：浏览器存储不可用'); }
}

const qs = id => S.q[id] || {};
const lessonKey = (mid, li) => `${mid}:${li}`;
const lessonState = (mid, li) => S.lessons[lessonKey(mid, li)] || {};

// 记录一次作答。错题进错题本；在错题本里连续答对 2 次移出
function record(id, ok) {
  const st = S.q[id] || (S.q[id] = { n: 0, wrong: 0 });
  st.n++; st.ok = ok; st.t = Date.now();
  if (!ok) {
    st.wrong++;
    st.box = { lv: 0, due: Date.now() };
  } else if (st.box) {
    if (st.box.lv === 0) st.box = { lv: 1, due: Date.now() + DAY };
    else delete st.box;
  }
  save();
}
function toggleUnsure(id) {
  const st = S.q[id] || (S.q[id] = { n: 0, wrong: 0 });
  st.unsure = !st.unsure;
  save();
  return st.unsure;
}

const FILTERS = {
  all: { name: '全部', fn: () => true },
  new: { name: '没做过', fn: id => !qs(id).n },
  wrong: { name: '做错过', fn: id => qs(id).wrong > 0 },
  unsure: { name: '不熟', fn: id => !!qs(id).unsure },
};

function modStats(mid) {
  const m = MOD[mid];
  const pool = m.questions.filter(q => !isPractice(q));
  const done = pool.filter(q => qs(q.id).n);
  const right = done.filter(q => qs(q.id).ok);
  const lessonsDone = m.lessons.filter((_, i) => lessonState(mid, i).done).length;
  return { total: pool.length, done: done.length, right: right.length, lessons: m.lessons.length, lessonsDone };
}
const dueList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].box && S.q[id].box.due <= Date.now());
const boxList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].box);
const unsureList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].unsure);

/* ============================================================
 * 小工具
 * ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function confirmBox(msg, okText = '确定', cancelText = '取消') {
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `<div class="modal-bg"><div class="modal-card" role="dialog"><div class="modal-msg">${msg}</div>
      <div class="modal-actions"><button class="btn secondary" data-v="0">${cancelText}</button><button class="btn primary" data-v="1">${okText}</button></div></div></div>`;
    m.classList.add('show');
    const done = v => { m.classList.remove('show'); m.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); done(false); }
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true); }
    };
    document.addEventListener('keydown', onKey, true);
    m.querySelectorAll('button').forEach(b => b.onclick = () => done(b.dataset.v === '1'));
    $('.btn.primary', m).focus();
  });
}

const PY_KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PY_BI = new Set('print len range list dict set tuple str int float bool type isinstance sorted enumerate zip map filter sum min max abs open iter next repr id super object Exception ValueError TypeError KeyError IndexError StopIteration ZeroDivisionError'.split(' '));
const SQL_KW = new Set('SELECT FROM WHERE AND OR NOT GROUP BY HAVING ORDER ASC DESC AS COUNT SUM AVG MIN MAX INSERT INTO VALUES CREATE TABLE LIMIT JOIN ON IN IS NULL DISTINCT BETWEEN LIKE'.split(' '));


const JAVA_KW = new Set('public private protected class interface extends implements static final void return new if else for while try catch finally throw throws this super null true false int long boolean double String import package'.split(' '));
function highlightJava(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?[LlFfDd]?\b)|(@\w+)|([A-Za-z_$][\w$]*)|([^/"\w@$]+|.)/g;
  return code.replace(re, (m, c, s, n, ann, w) => {
    if (c) return `<span class="hl-c">${esc(c)}</span>`;
    if (s) return `<span class="hl-s">${esc(s)}</span>`;
    if (n) return `<span class="hl-n">${n}</span>`;
    if (ann) return `<span class="hl-d">${esc(ann)}</span>`;
    if (w) return JAVA_KW.has(w) ? `<span class="hl-k">${w}</span>` : /^[A-Z]/.test(w) ? `<span class="hl-b">${w}</span>` : w;
    return esc(m);
  });
}

function highlight(code, lang) {
  if (lang === 'java') return highlightJava(code);
  if (lang === 'sql') {
    return code.replace(/(--[^\n]*)|('(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([^\w'-]+|-)/g, (m, c, s, n, w) => {
      if (c) return `<span class="hl-c">${esc(c)}</span>`;
      if (s) return `<span class="hl-s">${esc(s)}</span>`;
      if (n) return `<span class="hl-n">${n}</span>`;
      if (w && SQL_KW.has(w.toUpperCase())) return `<span class="hl-k">${w}</span>`;
      return esc(m);
    });
  }
  if (lang !== 'python' && lang !== 'py') return esc(code);
  const re = /(#[^\n]*)|([rbfuRBFU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'))|(\b\d[\d_]*(?:\.\d+)?(?:e-?\d+)?\b)|(@\w+)|([A-Za-z_]\w*)|([^#'"\w@]+|.)/g;
  let prevDef = false;
  return code.replace(re, (m, c, s, n, deco, w) => {
    if (c) return `<span class="hl-c">${esc(c)}</span>`;
    if (s) return `<span class="hl-s">${esc(s)}</span>`;
    if (n) return `<span class="hl-n">${n}</span>`;
    if (deco) return `<span class="hl-d">${esc(deco)}</span>`;
    if (w) {
      if (prevDef) { prevDef = false; return `<span class="hl-f">${w}</span>`; }
      if (PY_KW.has(w)) { prevDef = (w === 'def' || w === 'class'); return `<span class="hl-k">${w}</span>`; }
      if (PY_BI.has(w)) return `<span class="hl-b">${w}</span>`;
      return w;
    }
    return esc(m);
  });
}

const CALLOUTS = [
  { re: /^\s*💡\uFE0F?\s*/, cls: 'tip', label: '提示', icon: 'bulb' },
  { re: /^\s*⚠\uFE0F?\s*/, cls: 'warn', label: '注意', icon: 'alert' },
  { re: /^\s*📌\uFE0F?\s*/, cls: 'key', label: '本节要点', icon: 'bookmark' },
];
function decorateCallout(bq) {
  const walker = document.createTreeWalker(bq, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode()) && !node.nodeValue.trim());
  if (!node) return;
  const c = CALLOUTS.find(c => c.re.test(node.nodeValue));
  if (!c) { bq.classList.add('callout', 'tip'); return; }
  node.nodeValue = node.nodeValue.replace(c.re, '');
  const first = bq.firstElementChild;
  if (c.cls === 'key' && first && /^本节要(记住|点)$/.test(first.textContent.trim())) first.remove();
  bq.classList.add('callout', c.cls);
  bq.prepend(h(`<div class="callout-head">${icon(c.icon, 15)}<span>${c.label}</span></div>`));
}

/* ============================================================
 * Python 运行环境（Pyodide，放在 Web Worker 里，死循环可以强制停）
 * ============================================================ */
const PY_URL = 'https://cdn.jsdelivr.net/pyodide/v0.29.0/full/';
const Py = (() => {
  let worker = null, ready = false, readyWaiters = [], seq = 0, pending = {}, loadError = null;
  const src = `
    importScripts('${PY_URL}pyodide.js');
    const boot = loadPyodide({ indexURL: '${PY_URL}' }).then(py => { postMessage({ type: 'ready' }); return py; },
      err => { postMessage({ type: 'fail', error: String(err && err.message || err) }); throw err; });
    function clean(msg) {
      const lines = String(msg).split('\\n');
      const i = lines.findIndex(l => l.includes('File "<exec>"'));
      return i >= 0 ? 'Traceback (most recent call last):\\n' + lines.slice(i).join('\\n').trim() : String(msg).trim();
    }
    self.onmessage = async e => {
      const { id, code, after } = e.data;
      const py = await boot;
      const out = [];
      py.setStdout({ batched: s => out.push(s) });
      py.setStderr({ batched: s => out.push(s) });
      const ns = py.globals.get('dict')();
      let phase = 'user';
      try {
        const all = code + '\\n' + (after || '');
        const want = ['numpy', 'pandas', 'scipy', 'sqlite3'].filter(p => new RegExp('^\\\\s*(import|from)\\\\s+' + p + '\\\\b', 'm').test(all));
        if (want.length) await py.loadPackage(want, { messageCallback: () => {} });
        await py.runPythonAsync(code, { globals: ns });
        let results = null;
        if (after) {
          phase = 'tests';
          await py.runPythonAsync(after, { globals: ns });
          results = ns.get('_results_json');
        }
        postMessage({ type: 'done', id, ok: true, out: out.join('\\n'), results });
      } catch (err) {
        postMessage({ type: 'done', id, ok: false, phase, out: out.join('\\n'), error: clean(err && err.message || err) });
      } finally { ns.destroy(); }
    };`;

  function start() {
    ready = false; loadError = null;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const d = e.data;
      if (d.type === 'ready') { ready = true; readyWaiters.splice(0).forEach(f => f(true)); updateBadge(); }
      else if (d.type === 'fail') { loadError = d.error; readyWaiters.splice(0).forEach(f => f(false)); updateBadge(); }
      else if (d.type === 'done' && pending[d.id]) { pending[d.id](d); delete pending[d.id]; }
    };
    worker.onerror = e => {
      loadError = e.message || '无法加载 Python 运行环境';
      readyWaiters.splice(0).forEach(f => f(false));
      updateBadge();
    };
    updateBadge();
  }
  function waitReady() {
    if (!worker) start();
    if (ready) return Promise.resolve(true);
    if (loadError) return Promise.resolve(false);
    return new Promise(r => readyWaiters.push(r));
  }
  function updateBadge() {
    const b = $('#py-status');
    if (b) b.textContent = status();
  }
  function status() {
    if (!worker) return '未加载（第一次运行代码时自动加载）';
    if (ready) return '✅ 已就绪';
    if (loadError) return '❌ 加载失败：' + loadError;
    return '⏳ 加载中…';
  }
  async function run(code, after, onStatus, timeoutMs = 15000) {
    if (!ready) onStatus && onStatus('正在加载 Python 运行环境（第一次需要联网下载约 10MB，之后会快很多）…');
    const ok = await waitReady();
    if (!ok) {
      const err = loadError;
      worker && worker.terminate(); worker = null; // 下次重试
      return { ok: false, offline: true, error: 'Python 运行环境加载失败（需要联网）。\n' + (err || '') };
    }
    onStatus && onStatus('运行中…');
    const id = ++seq;
    return new Promise(resolve => {
      const timer = setTimeout(() => {
        delete pending[id];
        worker.terminate(); worker = null; ready = false;
        resolve({ ok: false, error: `运行超过 ${timeoutMs / 1000} 秒被强制停止——是不是写了死循环？` });
      }, timeoutMs);
      pending[id] = d => { clearTimeout(timer); resolve(d); };
      worker.postMessage({ id, code, after });
    });
  }
  return { run, status, preload: () => waitReady() };
})();

  $('#tabbar').innerHTML = NAV.filter(n => n.href !== '#/settings' && !n.hub).map(n =>
    `<a href="${n.href}" class="${n === active ? 'on' : ''}">${icon(n.icon, 20)}<span>${n.short || n.name}</span>${n.href === '#/review' && due ? `<i class="count">${due}</i>` : ''}</a>`).join('');
  // 侧栏底部：总进度
  const allLessons = MODS.reduce((a, m) => a + m.lessons.length, 0);
  const doneLessons = MODS.reduce((a, m) => a + modStats(m.id).lessonsDone, 0);
  const pool = drillPool(), done = pool.filter(q => qs(q.id).n).length;
  $('#side-foot').innerHTML = `<div class="side-progress">
    <div class="sp-row"><span>课程</span><b>${doneLessons}<small> / ${allLessons}</small></b></div>
    <div class="meter"><i style="width:${allLessons ? doneLessons / allLessons * 100 : 0}%"></i></div>
    <div class="sp-row"><span>刷题</span><b>${done}<small> / ${pool.length}</small></b></div>
    <div class="meter"><i style="width:${pool.length ? done / pool.length * 100 : 0}%"></i></div>
  </div>`;
}

function initShell() {
  $('#brand').innerHTML = BRAND;
  $('#mobile-top').innerHTML = `<a class="brand" href="#/">${BRAND}</a><a class="icon-btn" href="https://swt-eriri.github.io/study/" aria-label="全部学习站">${icon('layers', 20)}</a><a class="icon-btn" href="#/settings" aria-label="设置">${icon('settings', 20)}</a>`;
}

function route() {
  if (viewLeave) { viewLeave(); viewLeave = null; }
  viewKeys = null;
  const hash = location.hash || '#/';
  const parts = hash.slice(2).split('/').filter(Boolean);
  const main = $('#main');
  main.innerHTML = '';
  main.className = '';
  const [p0, p1, p2] = parts;
  if (!p0) viewHome(main);
  else if (p0 === 'm' && MOD[p1]) viewModule(main, p1);
  else if (p0 === 'l' && MOD[p1] && MOD[p1].lessons[+p2]) viewLesson(main, p1, +p2);
  else if (p0 === 'drill') viewDrill(main, p1);
  else if (p0 === 'run') viewRun(main);
  else if (p0 === 'review') viewReview(main);
  else if (p0 === 'mock' && p1) viewMockPaper(main, p1);
  else if (p0 === 'mock') viewMockHome(main);
  else if (p0 === 'sheet') viewSheet(main);
  else if (p0 === 'settings') viewSettings(main);
  else viewHome(main);
  document.body.classList.toggle('focus-mode', p0 === 'run' || p0 === 'l' || (p0 === 'mock' && !!p1));
  renderNav();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('show')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'textarea' || tag === 'input' || e.target.isContentEditable;
  if (typing && !((e.ctrlKey || e.metaKey) && e.key === 'Enter')) return;
  if (e.altKey) return;
  if ((e.ctrlKey || e.metaKey) && e.key !== 'Enter') return;
  if (viewKeys) viewKeys(e);
});

const go = hash => { if (location.hash === hash) route(); else location.hash = hash; };
function setLast(hash, label) { S.last = { hash, label }; save(); }

function nextLesson() {
  for (const st of STAGES) for (const mid of st.mods) {
    const m = MOD[mid]; if (!m) continue;
    for (let i = 0; i < m.lessons.length; i++) if (!lessonState(mid, i).done) return { mid, i };
  }
  return null;
}
function greeting() {
  const hr = new Date().getHours();
  return hr < 6 ? '夜深了' : hr < 11 ? '早上好' : hr < 13 ? '中午好' : hr < 18 ? '下午好' : '晚上好';
}

  main.className = 'wide';

    <a class="kpi" href="#/drill"><div class="kpi-ic">${icon('list', 18)}</div><div><b>${done}<small> / ${pool.length}</small></b><span>刷题单已做</span></div></a>
    <a class="kpi" href="#/drill"><div class="kpi-ic">${icon('target', 18)}</div><div><b>${done ? Math.round(right / done * 100) + '<small>%</small>' : '—'}</b><span>最近正确率</span></div></a>
    <a class="kpi ${due ? 'alert' : ''}" href="#/review"><div class="kpi-ic">${icon('review', 18)}</div><div><b>${due}</b><span>${due ? '道错题待复习' : '暂无待复习错题'}</span></div></a>

  for (const st of STAGES) {
